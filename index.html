<style>
/* MB Musawo — design system */
:root{
  --navy:#04125C; --blue:#1941BA; --blue-2:#316FF6; --teal:#316FF6; --teal-2:#316FF6; --warm:#316FF6; --warm-2:#FFB36B;
  --green:#0F9D6B; --red:#E5484D; --amber:#E9A23B; --purple:#1941BA;
  --bg:#F5F8FE; --bg-2:#E9F1F8; --surface:#FFFFFF; --surface-2:#F7FAFD; --line:#E1E8F0; --line-2:#CBD6E2;
  --text:#0E1B2C; --text-2:#3A4A5E; --muted:#6B7A8F;
  --ring:rgba(25,65,186,.25); --shadow:0 1px 2px rgba(4,18,92,.06),0 8px 24px rgba(4,18,92,.06);
  --shadow-lg:0 20px 60px rgba(4,18,92,.18);
  --r:14px; --r-sm:10px; --r-lg:20px;
  --side:260px; --top:64px;
  --grad:linear-gradient(135deg,#04125C 0%,#1941BA 55%,#316FF6 100%);
  --grad-warm:linear-gradient(135deg,#316FF6,#F5B04F);
  --fs:15px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050B26; --bg-2:#0A1435; --surface:#0C1838; --surface-2:#112046; --line:#1C2C5C; --line-2:#283C72;
  --text:#E8EEF7; --text-2:#B6C3D6; --muted:#8193AC; --blue:#5B8DF8; --blue-2:#92BDF9; --teal:#92BDF9; --ring:rgba(91,141,248,.35);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#050B26; --bg-2:#0A1435; --surface:#0C1838; --surface-2:#112046; --line:#1C2C5C; --line-2:#283C72;
  --text:#E8EEF7; --text-2:#B6C3D6; --muted:#8193AC; --blue:#5B8DF8; --blue-2:#92BDF9; --teal:#92BDF9; --ring:rgba(91,141,248,.35);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
:root[data-text="large"]{--fs:17px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--fs);line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--blue);text-decoration:none}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.2;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.6vw,52px);font-weight:800}
h2{font-size:clamp(20px,2.4vw,28px);font-weight:800}
h3{font-size:17px;font-weight:700}
h4{font-size:14px;font-weight:700}
p{margin:0 0 .8em}
small,.small{font-size:.82em}
.muted{color:var(--muted)} .t2{color:var(--text-2)}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.88em}
i[data-lucide],svg.lucide{width:18px;height:18px;stroke-width:2;flex:none;vertical-align:middle}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.side .brand{padding:18px 18px 12px;display:flex;align-items:center;gap:10px}
.side nav{overflow:auto;padding:6px 10px 16px;flex:1}
.nav-sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 6px;font-weight:700}
.nav-a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--text-2);font-weight:600;font-size:14px;margin:1px 0}
.nav-a:hover{background:var(--surface-2);color:var(--text)}
.nav-a.on{background:linear-gradient(90deg,rgba(25,65,186,.12),rgba(49,111,246,.08));color:var(--blue)}
.nav-a .pill{margin-left:auto}
.side .foot{padding:12px;border-top:1px solid var(--line)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .search{flex:1;max-width:460px;position:relative}
.top .search input{width:100%;padding:9px 12px 9px 36px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.top .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.content{padding:24px;max-width:1360px;width:100%;margin:0 auto;flex:1}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h h2{margin:0}
.crumb{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.bnav{display:none}
#scrim{position:fixed}
.icon-btn.hamb{display:none}

/* ---------- logo ---------- */
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--text);font-size:18px;letter-spacing:-.02em}
.logo b{color:var(--teal)}
.logo .tag{display:block;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-top:-2px}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-21{grid-template-columns:2fr 1fr}
.g-12{grid-template-columns:1fr 2fr}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.sp{flex:1}
.mt{margin-top:16px}.mt2{margin-top:24px}.mb{margin-bottom:16px}.mb0{margin-bottom:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid transparent;font-weight:700;font-size:14px;background:var(--blue);color:#fff;transition:.15s;white-space:nowrap;min-height:42px}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn.teal{background:var(--teal)} .btn.warm{background:var(--warm)} .btn.green{background:var(--green)} .btn.red{background:var(--red)} .btn.purple{background:var(--purple)}
.btn.grad{background:var(--grad)}
.btn.ghost{background:transparent;color:var(--text-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.outline{background:transparent;color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,transparent)}
.btn.sm{padding:6px 11px;font-size:13px;min-height:34px;border-radius:9px}
.btn.lg{padding:14px 22px;font-size:16px;min-height:52px;border-radius:14px}
.btn.block{width:100%}
.icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:var(--text-2);position:relative}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--text-2);border:1px solid var(--line);white-space:nowrap}
.badge.blue{background:rgba(25,65,186,.1);color:var(--blue);border-color:transparent}
.badge.teal{background:rgba(49,111,246,.12);color:var(--teal);border-color:transparent}
.badge.green{background:rgba(15,157,107,.12);color:var(--green);border-color:transparent}
.badge.red{background:rgba(229,72,77,.12);color:var(--red);border-color:transparent}
.badge.amber{background:rgba(233,162,59,.15);color:#B9770E;border-color:transparent}
.badge.purple{background:rgba(25,65,186,.12);color:var(--purple);border-color:transparent}
.badge.warm{background:rgba(49,111,246,.14);color:#1941BA;border-color:transparent}
.pill{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:800}
.tabs{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:12px;overflow:auto;max-width:100%}
.tab{padding:8px 14px;border-radius:9px;border:0;background:transparent;color:var(--text-2);font-weight:700;font-size:13.5px;white-space:nowrap}
.tab.on{background:var(--surface);color:var(--blue);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--text-2)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.av{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none;background:var(--grad)}
.av.sm{width:32px;height:32px;font-size:12px}.av.lg{width:64px;height:64px;font-size:22px}
.divider{height:1px;background:var(--line);margin:14px 0}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* stats */
.stat{display:flex;flex-direction:column;gap:6px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .d{font-size:12px;font-weight:700}

<script>
/* MB Musawo — core: state, router, shell, UI helpers */
const R = {};          // routes: key -> () => html
const A = {};          // actions (called from onclick)
const AFTER = [];      // callbacks after each render
const KEY = 'mbm-demo-v2';

/* ---------- state ---------- */
function freshState(){
  const s = JSON.parse(JSON.stringify(SEED));
  Object.assign(s, {theme:'light', text:'normal', lang:'en', branch:'all', role:null, offline:false, outbox:[], premium:false, country:'UG', labPersona:'scientist', tabs:{}, ver:1});
  return s;
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || freshState(); } catch(e){ S = freshState(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
A.resetDemo = () => { try{localStorage.removeItem(KEY);}catch(e){} S = freshState(); save(); toast('Sample data restored','green'); go('#/'); render(); };

/* ---------- helpers ---------- */
const $ = (q,el=document)=>el.querySelector(q);
const $$ = (q,el=document)=>[...el.querySelectorAll(q)];
const ic = (n,cls='')=>`<i data-lucide="${n}" class="${cls}"></i>`;
const ugx = n => 'UGX ' + Math.round(n).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => n.replace(/^(Dr\.|Sr\.|Nurse|Scientist|Admin)\s+/,'').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
const fdate = (iso,opt) => new Date(iso).toLocaleDateString('en-GB', opt||{day:'numeric',month:'short',year:'numeric'});
const ftime = iso => new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const fdt = iso => fdate(iso,{day:'numeric',month:'short'}) + ', ' + ftime(iso);
const isToday = iso => new Date(iso).toDateString() === new Date().toDateString();
const ago = iso => { const m = Math.round((Date.now()-new Date(iso))/60000); if(m<1) return 'just now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); if(h<24) return h+' h ago'; const d=Math.round(h/24); return d+' d ago'; };
const uid = p => p + '-' + Math.floor(1000 + Math.random()*9000);
const pat = id => S.patients.find(p=>p.id===id) || {name:'Unknown', id};
const doc = id => S.doctors.find(d=>d.id===id) || {name:'Unknown'};
const lab = id => S.labs.find(l=>l.id===id) || {name:'Unknown'};
const test = c => S.tests.find(t=>t.code===c) || {name:c, price:0};
const med = id => S.meds.find(m=>m.id===id) || {name:id, price:0};
const branch = id => S.branches.find(b=>b.id===id) || {name:'All branches'};
const age = dob => Math.floor((Date.now()-new Date(dob))/31557600000);
const bmi = (h,w) => (w/((h/100)**2)).toFixed(1);
const av = (name, cls='') => `<span class="av ${cls}" style="background:${avColor(name)}">${initials(name)}</span>`;
function avColor(n){ const c=['linear-gradient(135deg,#1941BA,#316FF6)','linear-gradient(135deg,#316FF6,#316FF6)','linear-gradient(135deg,#316FF6,#F5B04F)','linear-gradient(135deg,#1941BA,#1941BA)','linear-gradient(135deg,#04125C,#316FF6)','linear-gradient(135deg,#0F9D6B,#316FF6)']; let h=0; for(const ch of n) h=(h*31+ch.charCodeAt(0))>>>0; return c[h%c.length]; }
const stars = r => '★★★★★'.slice(0,Math.round(r)) + '<span class="muted">' + '★★★★★'.slice(Math.round(r)) + '</span>';
const badgeFor = st => { const m={Requested:'amber',Pending:'amber',Confirmed:'blue',Arrived:'teal','In consultation':'purple',Done:'green',Cancelled:'red',Viewed:'blue',Ordered:'blue',Paid:'green','Sample received':'teal','In progress':'purple','Awaiting review':'amber',Released:'green',Shared:'teal',Expired:'red',Received:'amber',Ready:'teal','Out for delivery':'purple',Delivered:'green',Approved:'green',Submitted:'blue',Query:'amber',Rejected:'red',Draft:'',Claimed:'blue','En route':'purple',Accepted:'blue',Declined:'red','Due soon':'amber',Active:'green','Follow-up':'blue',High:'red',Low:'green',Available:'green',Busy:'amber'}; return `<span class="badge ${m[st]||''}">${esc(st)}</span>`; };
const stat = (k,v,icon,col='blue',d='') => `<div class="card stat"><div class="k"><span class="ic ${col}">${ic(icon)}</span>${k}</div><div class="v">${v}</div>${d?`<div class="d">${d}</div>`:''}</div>`;
const tabs = (key, list, cur) => `<div class="tabs" role="tablist">${list.map(([k,l])=>`<button class="tab ${cur===k?'on':''}" onclick="A.tab('${key}','${k}')">${l}</button>`).join('')}</div>`;
A.tab = (key,v) => { S.tabs[key]=v; save(); render(); };
const tabOf = (key, def) => S.tabs[key] || def;

/* ---------- audit / notifications ---------- */
function audit(action, obj, ok=true){ const u=me(); S.audit.unshift({at:new Date().toISOString(), actor:u.name, role:u.roleName, action, obj, ok}); save(); }
function notify(pid, msg, go, type='info'){ S.notifications.unshift({id:uid('n'), pid, type, msg, at:new Date().toISOString(), read:false, go}); save(); }

/* ---------- router ---------- */
function go(h){ if(location.hash!==h) location.hash=h; else render(); }
function route(){ const h=(location.hash||'#/').slice(1); const parts=h.split('/').filter(Boolean); return parts; }
let charts = [], maps = [];
function render(){
  charts.forEach(c=>{try{c.destroy()}catch(e){}}); charts=[];
  maps.forEach(m=>{try{m.remove()}catch(e){}}); maps=[];
  AFTER.length=0;
  document.documentElement.dataset.theme = S.theme;
  document.documentElement.dataset.text = S.text;
  const p = route();
  let html;
  if(p[0]==='app'){
    const role=p[1]||S.role||'p', page=p[2]||'home';
    if(!ROLES[role]){ go('#/signin'); return; }
    if(S.role!==role){ S.role=role; save(); }
    const fn = R[role+'/'+page] || (page==='sos'?R['pub/emergency-app']:null) || R['common/'+page];
    html = shell(role, page, fn ? safe(fn, p.slice(3)) : `<div class="card empty">Page not found.</div>`);
  } else if(p[0]==='signin' || p[0]==='register'){
    html = (R['auth/'+p[0]]||(()=>''))(p.slice(1));
  } else {
    const page = p[0]||'home';
    html = pubShell(page, safe(R['pub/'+page] || R['pub/404'], p.slice(1)));
  }
  $('#root').innerHTML = html;
  document.title = 'MB Musawo — ' + (p[0]==='app' ? ROLES[p[1]]?.name+' · '+(p[2]||'home') : (p[0]||'your health companion'));
  if(window.lucide) lucide.createIcons();
  AFTER.forEach(f=>{ try{f()}catch(e){console.error(e)} });
  window.scrollTo({top: window.__keepScroll? window.scrollY : 0});
  window.__keepScroll=false;
}
function safe(fn,args){ try{ return fn(...(args||[])); }catch(e){ console.error(e); return `<div class="note red">${ic('alert-triangle')} Something went wrong on this screen: ${esc(e.message)}</div>`; } }
window.addEventListener('hashchange', render);
/* re-render without jumping to top */
function rerender(){ window.__keepScroll=true; render(); }

/* ---------- modal & toast ---------- */
function modal(title, body, foot='', wide=false){
  closeModal();
  const el=document.createElement('div'); el.className='modal-bg'; el.id='modal';
  el.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h3>${title}</h3><button class="icon-btn" onclick="closeModal()" aria-label="Close">${ic('x')}</button></div><div class="modal-b" id="modal-b">${body}</div>${foot?`<div class="modal-f" id="modal-f">${foot}</div>`:''}</div>`;
  el.addEventListener('click', e=>{ if(e.target===el) closeModal(); });
  document.body.appendChild(el); if(window.lucide) lucide.createIcons();
}
function setModal(body, foot){ const b=$('#modal-b'); if(b){ b.innerHTML=body; } const f=$('#modal-f'); if(f&&foot!==undefined) f.innerHTML=foot; if(window.lucide) lucide.createIcons(); }
function closeModal(){ const m=$('#modal'); if(m) m.remove(); if(window.__stream){ window.__stream.getTracks().forEach(t=>t.stop()); window.__stream=null; } }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
function toast(msg, kind=''){
  let box=$('#toasts'); if(!box){ box=document.createElement('div'); box.id='toasts'; box.className='toasts'; document.body.appendChild(box); }
  const el=document.createElement('div'); el.className='toast '+kind; el.innerHTML=`${ic(kind==='red'?'alert-circle':kind==='green'?'check-circle-2':'info')}<div>${msg}</div>`;
  box.appendChild(el); if(window.lucide) lucide.createIcons(); setTimeout(()=>{el.style.opacity='0';el.style.transition='.3s'; setTimeout(()=>el.remove(),300);}, 4200);
}

/* ---------- charts & maps ---------- */
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function chart(id, cfg){
  AFTER.push(()=>{ const el=document.getElementById(id); if(!el||!window.Chart) return;
    Chart.defaults.font.family='"Plus Jakarta Sans",system-ui,sans-serif'; Chart.defaults.color=css('--muted'); Chart.defaults.borderColor=css('--line');
    cfg.options = Object.assign({responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{boxWidth:10,boxHeight:10,usePointStyle:true}}}}, cfg.options||{});
    charts.push(new Chart(el, cfg)); });
}
function leaflet(id, center, zoom, markers, extra){
  AFTER.push(()=>{ const el=document.getElementById(id); if(!el) return;
    if(!window.L){ el.innerHTML='<div class="empty">Map library could not load (offline?). The list below still works.</div>'; return; }
    const m=L.map(el,{scrollWheelZoom:false}).setView(center, zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19, attribution:'© OpenStreetMap'}).addTo(m);
    (markers||[]).forEach(mk=>{ const c=L.circleMarker([mk.lat,mk.lng],{radius:mk.r||9,color:'#fff',weight:2,fillColor:mk.color||'#1941BA',fillOpacity:1}).addTo(m); if(mk.popup) c.bindPopup(mk.popup); });
    extra && extra(m); maps.push(m); setTimeout(()=>{ if(maps.includes(m)) try{ m.invalidateSize(); }catch(e){} },150); });
}

const EMERGENCY_RX = /(chest pain|pain in (my )?chest|can'?t breathe|cannot breathe|difficulty breathing|short(ness)? of breath|not breathing|severe bleeding|bleeding (heavily|a lot)|heavy bleeding|unconscious|fainted|passed out|not waking|stroke|face (is )?droop|slurred speech|one side weak|convulsion|seizure|fitting|suicid|kill myself|poison|snake ?bite|bleeding.*pregnan|pregnan.*bleeding)/i;
const AI_RULES = [

}

A.bindSOS = () => {
  const b=$('#sosbtn'); if(!b) return; let t0=null, raf=null; const ring=$('#sosring');
  const tick=()=>{ const p=Math.min(1,(Date.now()-t0)/3000); ring.setAttribute('stroke-dashoffset', 295*(1-p)); if(p>=1){ stop(); fire(); } else raf=requestAnimationFrame(tick); };
  const start=e=>{ e.preventDefault(); t0=Date.now(); raf=requestAnimationFrame(tick); };
  const stop=()=>{ cancelAnimationFrame(raf); t0=null; ring.setAttribute('stroke-dashoffset',295); };
  const fire=()=>{ audit('SOS triggered','location shared'); $('#sosmsg').innerHTML=`<div class="note red" style="text-align:left">${ic('map-pin')}<div><b>SOS sent.</b> Your location (0.3540, 32.6150 · Ntinda) was sent by SMS to John Mukasa with a map link. Now call an emergency number.</div></div>`; lucide.createIcons(); toast('SOS sent to your emergency contact','red'); if(navigator.vibrate) navigator.vibrate([200,100,200]); };
  b.addEventListener('pointerdown',start); ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{ if(t0) stop(); }));
  b.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){ if(!t0){ start(e); } } }); b.addEventListener('keyup',()=>{ if(t0) stop(); });
};

A.ask = (ctx, text) => {
  text=(text||'').trim(); if(!text) return;
  if(ctx==='pub'){ S.tabs.pubAI=(S.tabs.pubAI||0)+1; if(S.tabs.pubAI>3){ toast('Free preview limit reached. Sign in for unlimited checks.','red'); go('#/signin'); return; } }

  log.push({me:false, html:'<span class="typing"><span></span><span></span><span></span></span>', tmp:true}); rerender();

    log.pop(); const r=triage(text);
    if(r.emergency){ log.push({me:false, html:`<b style="color:var(--red)">${ic('siren')} This could be an emergency.</b><br>Please call an ambulance or go to the nearest hospital now. <br><a class="btn red sm mt" href="#/${ctx==='pub'?'emergency':'app/p/sos'}">Open Emergency</a>`}); }

  }, 900);
};

  if(st.step==='2fa') return authShell(`<h2>Two-step verification</h2><p class="muted">Staff and administrator accounts need a code from your authenticator app.</p><div class="field"><label>Authenticator code</label><input class="inp" id="totp" inputmode="numeric" placeholder="6 digits" value="135790"></div><button class="btn grad block lg" onclick="A.finishLogin()">Continue</button><p class="small muted mt">Lost your device? Recovery is administrator-assisted with identity checks.</p>`);
  if(st.step==='role') return authShell(`<div style="text-align:center"><div class="ic green" style="width:64px;height:64px;border-radius:50%;margin:0 auto">${ic('shield-check')}</div><h2 class="mt">Verified</h2><p class="muted">The server found your account and role:</p><div class="card flat"><div class="row" style="justify-content:center"><span class="ic ${ROLES[st.role].color}">${ic(ROLES[st.role].icon)}</span><b>${ROLES[st.role].name}</b></div></div><button class="btn grad block lg mt" onclick="A.enter('${st.role}')">Open my dashboard</button></div>`);
  return '';
};
A.sendCode = ph => { const acc=DEMO_ACCOUNTS.find(a=>a[0].replace(/\s/g,'')===ph.replace(/\s/g,'')); S.tabs.auth={step:'otp', ph, role: acc?acc[1]:'p', tries:0}; save(); rerender(); toast('Code sent by SMS','blue'); };
A.bindOTP = () => { const ins=$$('#otp input'); ins[0]&&ins[0].focus(); ins.forEach((el,i)=>{
  el.addEventListener('input',()=>{ el.value=el.value.replace(/\D/g,'').slice(-1); if(el.value&&ins[i+1]) ins[i+1].focus(); if(ins.every(x=>x.value)) A.verifyOTP(); });
  el.addEventListener('keydown',e=>{ if(e.key==='Backspace'&&!el.value&&ins[i-1]){ ins[i-1].focus(); ins[i-1].value=''; e.preventDefault(); } if(e.key==='ArrowLeft'&&ins[i-1]) ins[i-1].focus(); if(e.key==='ArrowRight'&&ins[i+1]) ins[i+1].focus(); });
  el.addEventListener('paste',e=>{ const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6); if(d.length){ e.preventDefault(); d.split('').forEach((c,j)=>{ if(ins[j]) ins[j].value=c; }); ins[Math.min(d.length,5)].focus(); if(d.length===6) A.verifyOTP(); } });
}); };
A.verifyOTP = () => { const code=$$('#otp input').map(x=>x.value).join(''); const st=S.tabs.auth; if(code.length<6) { $('#otperr').textContent='Enter all 6 digits'; return; }
  if(code!=='246810'){ st.tries=(st.tries||0)+1; save(); if(st.tries>=5){ audit('Failed sign-in ×5 — locked', st.ph, false); $('#otperr').textContent='Too many wrong codes. Locked for 15 minutes.'; return;} $('#otperr').textContent='Wrong code. Try again ('+(5-st.tries)+' left). Hint: 246810'; $$('#otp input').forEach(x=>x.value=''); $$('#otp input')[0].focus(); return; }
  st.step = st.role==='p' ? 'role' : '2fa'; save(); rerender(); };
A.finishLogin = () => { if(!/^\d{6}$/.test(($('#totp')||{}).value||'')){ toast('Enter a 6-digit code','red'); return; } S.tabs.auth.step='role'; save(); rerender(); };
A.enter = role => { S.role=role; S.tabs.auth={step:'phone'}; save(); audit('Signed in','session'); go('#/app/'+role+'/home'); toast('Welcome to MB Musawo','green'); };

R['auth/register'] = () => {

  const F = {p:[['Full name','Sarah Nakato'],['Phone','+256 7xx xxx xxx'],['Email (optional)',''],['Date of birth','','date'],['Sex','','sel:Female,Male,Prefer not to say'],['Address / area','Ntinda, Kampala'],['Emergency contact','Name and phone']],
    d:[['Full name','Dr. '],['Phone',''],['Email',''],['Specialty','','sel:General Practitioner,Obstetrician & Gynaecologist,Paediatrician,Cardiologist,Endocrinologist,Sexual & Reproductive Health'],['UMDPC licence number','UMDPC/'],['Qualifications','MBChB, MMed'],['Clinic location','']],
    l:[['Lab name',''],['MoH registration number',''],['Location',''],['Departments','Haematology, Clinical chemistry, Immunology, Microbiology'],['Contact person','']],
    ph:[['Pharmacy name',''],['NDA licence number','NDA/'],['Location',''],['Superintending pharmacist','']],
    hc:[['Full name',''],['Qualification','Registered nurse / midwife'],['UNMC / AHPC registration number',''],['Areas covered','Ntinda, Kiwatule, Naguru']]}[r];
  return authShell(`<a href="#/" class="small">${ic('arrow-left')} Back</a><h2 class="mt">Create your account</h2><p class="muted small">Administrator accounts are by invitation only.</p>
    <div class="role-grid mb">${[['p','Patient','Free, instant'],['d','Doctor','Needs approval'],['l','Laboratory','Needs approval'],['ph','Pharmacy','Needs approval'],['hc','Home care','Needs approval']].map(([k,l,s])=>`<button class="role-card ${r===k?'on':''}" onclick="S.tabs.reg='${k}';rerender()"><span class="ic ${ROLES[k].color}">${ic(ROLES[k].icon)}</span><span>${l}<small>${s}</small></span></button>`).join('')}</div>
    <form onsubmit="event.preventDefault();A.register('${r}', this)">${F.map(([l,ph,type])=>`<div class="field"><label>${l}</label>${type&&type.startsWith('sel:')?`<select class="inp">${type.slice(4).split(',').map(o=>`<option>${o}</option>`).join('')}</select>`:`<input class="inp" type="${type||'text'}" placeholder="${ph}" ${l.includes('optional')?'':'required'}>`}</div>`).join('')}
    ${r!=='p'?`<div class="field"><label>Licence documents (PDF or photo)</label><input class="inp" type="file" multiple accept=".pdf,image/*"></div>`:''}
    <label class="check"><input type="checkbox" required> <span class="small">I agree to the <a href="#/terms">terms</a> and consent to MB Musawo processing my health data as explained in the <a href="#/privacy">privacy policy</a>.</span></label>
    <button class="btn grad block lg mt">${r==='p'?'Create account':'Submit for approval'}</button></form>`);
};
A.register = (r, f) => {
  if(r==='p'){ S.tabs.auth={step:'otp', ph:f.querySelector('input[type=text]:nth-of-type(1)')?.value||'+256 772 418 903', role:'p', tries:0}; save(); go('#/signin'); toast('Account created. Verify your phone to continue.','green'); return; }
  const name=f.querySelector('input').value||'New provider';
  S.applications.unshift({id:uid('APP'), name, type:ROLES[r].name, country:'Uganda', docs:f.querySelector('input[type=file]')?.files.length||1, lic:'Submitted', at:new Date().toISOString(), status:'Pending'}); save();
  modal('Application submitted', `<div style="text-align:center"><div class="ic amber" style="width:64px;height:64px;border-radius:50%;margin:0 auto">${ic('hourglass')}</div><h3 class="mt">Pending approval</h3><p class="muted">An administrator will check your licence with the regulator, usually within 24–48 hours. You won’t appear in search until approved.</p></div>`, `<button class="btn ghost" onclick="closeModal();go('#/')">Back to website</button><button class="btn" onclick="closeModal();go('#/app/a/approvals')">See it as admin (demo)</button>`);
};

const HOSPITALS=[['Mulago National Referral Hospital','Kampala',4.6],['Naguru (China-Uganda Friendship) Hospital','Naguru',2.2],['Nsambya Hospital','Nsambya',7.4],['Mengo Hospital','Mengo',7.9],['Kiruddu National Referral Hospital','Makindye',9.1]];
const FIRST_AID = {'Bleeding':['Press firmly on the wound with a clean cloth.','Keep pressing for 10 minutes without lifting.','Raise the injured part if possible.','If blood soaks through, add more cloth on top — do not remove the first one.'],
 'Burns':['Cool the burn under clean running water for 20 minutes.','Remove rings or tight items near the burn.','Cover loosely with clean cling film or cloth.','Do not use butter, toothpaste or oil.'],
 'Choking':['Ask “Are you choking?” Encourage coughing.','Give up to 5 firm back blows between the shoulder blades.','Then up to 5 abdominal thrusts (for babies under 1, use chest thrusts).','Call for help if it does not clear.'],
 'Fits':['Move hard objects away; do not hold the person down.','Do not put anything in the mouth.','When the fit stops, turn them on their side.','Call an ambulance if it lasts more than 5 minutes, or if the person is pregnant.'],
 'Not breathing (CPR)':['Call for help and an ambulance.','Push hard and fast in the centre of the chest, 100–120 times a minute.','If trained, give 2 rescue breaths after every 30 pushes.','Keep going until help arrives.'],
 'Snake bite':['Keep the person calm and still.','Remove rings and tight clothing.','Keep the bitten limb still.','Do not cut, suck or tie the wound. Go to hospital at once.'],
 'Labour / birth':['Call for help and go to the nearest health facility.','If the baby is coming, the mother can lie on her side or half-sit.','Do not pull the baby. Dry the baby and keep it warm on the mother’s chest.','Do not cut the cord without clean tools — wait for a health worker.']};
A.firstAid = k => modal('First aid: '+k, '<ol class="t2">'+FIRST_AID[k].map(x=>'<li style="margin-bottom:6px">'+x+'</li>').join('')+'</ol><div class="note warn">'+ic('phone')+'<div>Always call the emergency number as well. Ambulance 0800 100 066.</div></div>', '<a class="btn red" href="tel:0800100066">'+ic('phone')+' Call ambulance</a>');

</script>
<script>
/* MB Musawo — patient portal */
const ME = 'P-10231';
const ph = (crumb,title,right='') => `<div class="page-h"><div><div class="crumb">${crumb}</div><h2>${title}</h2></div><div class="row wrap">${right}</div></div>`;

R['p/home'] = () => {
  const p = pat(ME);
  const appts = S.appointments.filter(a=>a.pid===ME && new Date(a.at)>Date.now()-3600e3 && a.status!=='Cancelled').sort((a,b)=>new Date(a.at)-new Date(b.at));
  const reqs = S.labRequests.filter(r=>r.pid===ME && ['Requested','Viewed'].includes(r.status));
  const anc = S.anc.find(a=>a.pid===ME); const wk = anc ? Math.floor((Date.now()-new Date(anc.lmp))/604800000) : null;
  const unread = S.notifications.filter(n=>n.pid===ME&&!n.read).length;
  return `
  <div class="hero-card mb">
    <div class="row between wrap" style="position:relative;z-index:1">
      <div><div class="muted small">${fdate(new Date().toISOString(),{weekday:'long',day:'numeric',month:'long'})}</div><h2 style="color:#fff;margin:4px 0">${greet()}, ${p.name.split(' ')[0]}</h2><div class="muted">${t('What do you need today?')}</div></div>
      <a class="btn red lg" href="#/app/p/sos">${ic('siren')} Emergency SOS</a>
    </div>
    <div class="hero-actions" style="max-width:none;position:relative;z-index:1">
      <button class="big-act" onclick="go('#/app/p/book')"><span class="ic">${ic('stethoscope')}</span>${t('See a doctor')}<span class="small" style="font-weight:500;opacity:.8">In person, video or home</span></button>
      <button class="big-act" onclick="go('#/app/p/labrequests')"><span class="ic">${ic('flask-conical')}</span>${t('Get a test')}<span class="small" style="font-weight:500;opacity:.8">${reqs.length?reqs.length+' request waiting':'Compare labs by price'}</span></button>
      <button class="big-act" onclick="go('#/app/p/medicine')"><span class="ic">${ic('pill')}</span>${t('Get medicine')}<span class="small" style="font-weight:500;opacity:.8">Delivered by boda</span></button>
    </div>
  </div>
  <div class="card mb" style="cursor:pointer;background:linear-gradient(135deg,rgba(25,65,186,.08),rgba(49,111,246,.08))" onclick="go('#/app/p/assistant')"><div class="row"><span class="ic purple">${ic('info')}</span><div class="grow"><b>Not sure where to start?</b><div class="small muted">Answer a few simple questions — we suggest a doctor and tests.</div></div>${ic('chevron-right')}</div></div>
  ${reqs.map(r=>`<div class="note warn mb">${ic('flask-conical')}<div class="grow"><b>${doc(r.did).name} sent you a lab request</b> — ${r.tests.map(c=>test(c).name).join(', ')}.<br><a class="btn sm warm mt" href="#/app/p/labrequests/${r.id}">Compare labs & order</a></div></div>`).join('')}
  <div class="grid g4 mb">
    ${stat('Next appointment', appts[0]?fdate(appts[0].at,{day:'numeric',month:'short'}):'None','calendar','blue', appts[0]?ftime(appts[0].at)+' · '+appts[0].type:'')}
    ${stat('Pregnancy', wk!==null?wk+' weeks':'—','baby','warm', wk!==null?'Due '+fdate(new Date(new Date(anc.lmp).getTime()+280*864e5).toISOString()):'')}
    ${stat('Unread alerts', unread,'bell','red','<a href="#/app/p/alerts">Open</a>')}
    ${stat('Plan', S.premium?'Premium':'Free','gem','purple', S.premium?'Video & priority':'<a href="#/app/p/premium">Upgrade</a>')}
  </div>
  <div class="grid g-21">
    <div class="card"><div class="card-h"><h3>Upcoming appointments</h3><a href="#/app/p/appointments" class="small">See all</a></div>
      ${appts.length?appts.slice(0,4).map(a=>apptRow(a)).join(''):'<div class="empty">No upcoming appointments</div>'}</div>
    <div class="card"><h3>Quick actions</h3><div class="grid g2" style="gap:10px">
      ${[['calendar-plus','Book doctor','#/app/p/book','blue'],['flask-conical','Book lab test','#/app/p/labrequests','purple'],['pill','Order medicine','#/app/p/medicine','green'],['house','Home visit','#/app/p/homevisit','warm'],['map-pin','Nearby map','#/app/p/map','teal'],['wallet','Payments','#/app/p/payments','blue']].map(([i,l,h,c])=>`<a class="card flat" style="padding:12px;text-align:center;color:var(--text)" href="${h}"><span class="ic ${c}">${ic(i)}</span><div class="small" style="font-weight:700;margin-top:6px">${l}</div></a>`).join('')}
    </div></div>
  </div>`;
};
function apptRow(a){ const d=doc(a.did); return `<div class="li">${av(d.name)}<div class="grow"><div class="t">${d.name}</div><div class="s">${d.spec} · ${a.reason}</div><div class="s">${fdt(a.at)} · ${a.type}</div></div><div class="col" style="align-items:flex-end;gap:6px">${badgeFor(a.status)}${a.type==='Video'&&a.status!=='Done'?`<button class="btn sm teal" onclick="A.joinVideo('${a.id}')">${ic('video')} Join</button>`:''}${a.status==='Done'&&S.role==='p'?(a.rated?`<span class="small">${'★'.repeat(a.rated)}</span>`:`<button class="btn sm ghost" onclick="A.rate('${a.id}')">${ic('star')} Rate visit</button>`):''}</div></div>`; }

/* AI assistant */
R['p/assistant'] = () => { AFTER.push(()=>{ const c=$('#chat'); if(c) c.scrollTop=c.scrollHeight; }); return ph('Care','Symptom check', `<button class="btn ghost sm" onclick="S.chat_p=null;rerender()">${ic('rotate-ccw')} New chat</button>`) + `<div class="grid g-21"><div>${chatUI('p')}</div><div class="card"><h3>${ic('shield-check')} Safety rules</h3><ul class="small t2" style="padding-left:18px"><li>Emergency signs are checked first and sent to the SOS screen.</li><li>Guidance only — never a diagnosis.</li><li>Never gives medicine doses.</li><li>Every suggestion links to a real, approved doctor or test.</li></ul><div class="note">${ic('info')}<div>In production this runs on a secure server function with a clinician-reviewed prompt.</div></div></div></div>`; };

/* booking */
R['p/book'] = (did) => {
  if(did) return bookDetail(did);
  const f = tabOf('pspec','All'); const specs=['All',...new Set(S.doctors.map(d=>d.spec))];
  return ph('Care','Book a doctor') + `<div class="chips mb">${specs.map(s=>`<button class="chip ${f===s?'on':''}" onclick="A.tab('pspec','${s}')">${s}</button>`).join('')}</div>
  <div class="grid g3">${S.doctors.filter(d=>f==='All'||d.spec===f).map(d=>`<div class="card"><div class="row">${av(d.name,'lg')}<div class="grow"><b>${d.name}</b><div class="small muted">${d.spec}</div><div class="small">${stars(d.rating)} <span class="muted">${d.rating} (${d.reviews})</span></div></div></div>
    <div class="row wrap mt small t2"><span>${ic('map-pin')} ${d.area} · ${d.km} km</span><span>${ic('clock')} replies ${d.resp}</span></div>
    <div class="row between mt"><div><div class="small muted">Fee</div><b>${ugx(d.fee)}</b></div>${badgeFor(d.status)}</div>
    <div class="row wrap mt" style="gap:6px">${d.types.map(x=>`<span class="badge">${ic(x==='Video'?'video':x==='Home'?'house':'building')} ${x}</span>`).join('')}</div>
    <a class="btn block mt" href="#/app/p/book/${d.id}">Choose time</a></div>`).join('')}</div>`;
};
function bookDetail(did){
  const d = doc(did); const b = S.tabs.booking && S.tabs.booking.did===did ? S.tabs.booking : (S.tabs.booking={did, type:d.types[0], day:null, slot:null});
  const days=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()+i);return x;});
  const taken = S.appointments.filter(a=>a.did===did).map(a=>new Date(a.at).toISOString().slice(0,16));
  const slots=[]; for(let h=8;h<17;h++) for(const m of [0,30]) slots.push(`${String(h).padStart(2,'0')}:${m?'30':'00'}`);
  const dayObj = b.day!==null ? days[b.day] : null;
  return ph(`<a href="#/app/p/book">Book a doctor</a> / ${d.name}`, d.name) + `<div class="grid g-12">
    <div class="card" style="text-align:center">${av(d.name,'lg')}<h3 class="mt">${d.name}</h3><div class="muted small">${d.spec} · ${d.lic}</div><div class="mt">${stars(d.rating)} ${d.rating} · ${d.reviews} reviews</div>
      <div class="grid g3 mt" style="gap:8px">${[['Fee',ugx(d.fee)],['Distance',d.km+' km'],['Replies',d.resp]].map(([k,v])=>`<div class="card flat" style="padding:10px"><div class="small muted">${k}</div><b class="small">${v}</b></div>`).join('')}</div>
      <div class="note green mt" style="text-align:left">${ic('badge-check')}<div>Licence verified by MB Musawo with the medical council.</div></div></div>
    <div class="card"><h3>1. Visit type</h3><div class="chips">${d.types.map(x=>`<button class="chip ${b.type===x?'on':''}" onclick="S.tabs.booking.type='${x}';rerender()">${ic(x==='Video'?'video':x==='Home'?'house':'building')} ${x==='Home'?'Home visit':x}</button>`).join('')}</div>
      ${b.type==='Video'&&!S.premium?`<div class="note warn mt">${ic('gem')}<div>Video consultations are part of Premium. You can still book and pay per visit.</div></div>`:''}
      <h3 class="mt2">2. Day</h3><div class="days">${days.map((x,i)=>`<button class="day ${b.day===i?'on':''}" ${x.getDay()===0?'disabled title="Doctor not working"':''} onclick="S.tabs.booking.day=${i};S.tabs.booking.slot=null;rerender()"><small>${x.toLocaleDateString('en-GB',{weekday:'short'})}</small>${x.getDate()}<small>${x.toLocaleDateString('en-GB',{month:'short'})}</small></button>`).join('')}</div>
      <h3 class="mt2">3. Time <span class="small muted" style="font-weight:500">— only open slots inside the doctor’s hours</span></h3>
      ${dayObj?`<div class="slots">${slots.map(s=>{ const dt=new Date(dayObj); dt.setHours(+s.slice(0,2),+s.slice(3),0,0); const iso=dt.toISOString().slice(0,16); const past=dt<Date.now(); const tk=taken.includes(iso); return `<button class="slot ${b.slot===s?'on':''}" ${past||tk?'disabled':''} onclick="S.tabs.booking.slot='${s}';rerender()" title="${tk?'Taken':past?'Past':''}">${s}</button>`; }).join('')}</div>`:'<p class="muted small">Pick a day first.</p>'}
      <div class="field mt"><label>Reason for visit (optional)</label><input class="inp" id="breason" placeholder="e.g. fever for 2 days"></div>
      <div class="row between mt"><div><div class="small muted">Total</div><b style="font-size:20px">${ugx(d.fee)}</b></div><button class="btn grad lg" ${b.day===null||!b.slot?'disabled':''} onclick="A.confirmBook()">Confirm & pay</button></div>
    </div></div>`;
}
A.confirmBook = () => {
  const b=S.tabs.booking, d=doc(b.did); const x=new Date(); x.setDate(x.getDate()+b.day); x.setHours(+b.slot.slice(0,2),+b.slot.slice(3),0,0);
  const reason=($('#breason')||{}).value||'Consultation';
  const make = (ref)=>{ const id=uid('A'); S.appointments.push({id, pid:ME, did:b.did, type:b.type, at:x.toISOString(), status:'Confirmed', reason, branch:d.branch, paid:!!ref}); notify(ME,`Appointment confirmed with ${d.name}, ${fdt(x.toISOString())}. Reminder by SMS & WhatsApp 24 h and 2 h before.`,'#/app/p/appointments','appt'); audit('Appointment booked', id); S.tabs.booking=null; save();
    modal('Booked!', `<div style="text-align:center"><div class="ic green" style="width:64px;height:64px;border-radius:50%;margin:0 auto">${ic('calendar-check')}</div><h3 class="mt">${d.name}</h3><p class="muted">${fdt(x.toISOString())} · ${b.type}</p><p class="small t2">Receipt emailed. The doctor has been notified. You’ll get SMS/WhatsApp reminders.</p></div>`, `<button class="btn" onclick="closeModal();go('#/app/p/appointments')">View appointments</button>`); };
  if(S.offline){ queueOrRun('Book '+d.name, ()=>{ make(null); }); return; }
  A.pay(d.fee, `Appointment with ${d.name} (${b.type})`, make, {insurance:true});
};
R['p/appointments'] = () => {
  const mine=S.appointments.filter(a=>a.pid===ME).sort((a,b)=>new Date(b.at)-new Date(a.at));
  return ph('Care','My appointments',`<a class="btn" href="#/app/p/book">${ic('plus')} Book</a>`) + `<div class="card">${mine.map(a=>`${apptRow(a)}${a.status==='Confirmed'?`<div class="row" style="justify-content:flex-end;margin:-6px 0 8px"><button class="btn sm ghost" onclick="A.cancelAppt('${a.id}')">Cancel</button><button class="btn sm ghost" onclick="toast('Reschedule: pick a new slot on the booking screen','blue');go('#/app/p/book/${a.did}')">Reschedule</button><button class="btn sm ghost" onclick="A.addCal('${a.id}')">${ic('calendar-plus')} Add to calendar</button></div>`:''}`).join('')}</div>`;
};
A.cancelAppt = id => { const a=S.appointments.find(x=>x.id===id); a.status='Cancelled'; audit('Appointment cancelled', id); save(); toast('Cancelled. Refund to your Mobile Money within 24 h.','green'); rerender(); };
A.addCal = id => { const a=S.appointments.find(x=>x.id===id); const d=doc(a.did); const st=new Date(a.at).toISOString().replace(/[-:]/g,'').slice(0,15)+'Z'; A.download('mb-musawo-appointment.ics', `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${st}\nSUMMARY:MB Musawo — ${d.name}\nDESCRIPTION:${a.type} consultation\nEND:VEVENT\nEND:VCALENDAR`, 'text/calendar'); };

/* video */

/* lab requests → compare labs → pay → order (Chapter 12) */
R['p/labrequests'] = (rid, codes) => {
  if(rid==='direct') return labCompare({id:'DIRECT', tests:(codes||'FBC').split(','), reason:'Ordered directly by patient', did:null});
  if(rid){ const r=S.labRequests.find(x=>x.id===rid); if(r && r.status==='Requested'){ r.status='Viewed'; audit('Patient viewed lab request', r.id); save(); } return labCompare(r); }
  const reqs=S.labRequests.filter(r=>r.pid===ME); const orders=S.labOrders.filter(o=>o.pid===ME);
  return ph('Care','Lab tests',`<button class="btn outline" onclick="A.pickTests()">${ic('plus')} Order tests myself</button>`) + `
  <div class="card mb"><h3>Requests from your doctor</h3>${reqs.length?reqs.map(r=>`<div class="li"><span class="ic purple">${ic('file-text')}</span><div class="grow"><div class="t">${r.tests.map(c=>test(c).name).join(', ')}</div><div class="s">${doc(r.did).name} · ${fdt(r.at)} · expires ${fdate(r.expires)}</div><div class="s">Reason: ${esc(r.reason)}</div></div>${badgeFor(r.status)}${['Requested','Viewed'].includes(r.status)?`<a class="btn sm" href="#/app/p/labrequests/${r.id}">Choose lab</a>`:''}</div>`).join(''):'<div class="empty">No requests</div>'}</div>
  <div class="card"><h3>My lab orders</h3>${orders.map(o=>orderTrack(o)).join('')||'<div class="empty">No orders yet</div>'}</div>`;
};
const ORDER_FLOW = ['Ordered','Paid','Sample received','In progress','Awaiting review','Released','Shared'];
function orderTrack(o){
  const idx = ORDER_FLOW.indexOf(o.status==='Released'&&o.shared&&o.shared.length?'Shared':o.status);
  return `<div style="padding:14px 0;border-bottom:1px solid var(--line)"><div class="row between wrap"><div><b>${o.id}</b> · ${lab(o.lid).name}<div class="small muted">${o.tests.map(c=>test(c).name).join(', ')} · ${ugx(o.total)}</div></div><div class="row">${badgeFor(o.status)}${o.status==='Released'?`<button class="btn sm" onclick="A.viewResult('${o.id}')">View results</button>`:''}</div></div>
  <div class="steps mt">${ORDER_FLOW.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?'now':''}"><div class="dotx">${i<idx?ic('check'):i+1}</div>${s}</div>`).join('')}</div></div>`;
}
A.pickTests = () => modal('Choose tests', `<p class="small muted">Ordering without a doctor’s request is allowed in this pilot (allowed in this service). You can forward results to a doctor later.</p>${S.tests.map(t=>`<label class="check"><input type="checkbox" value="${t.code}" class="tpick"> <span class="grow">${t.name} <span class="muted small">· ${t.dept}</span></span><b class="small">${ugx(t.price)}</b></label>`).join('')}`, `<button class="btn" onclick="const c=$$('.tpick:checked').map(x=>x.value);if(!c.length)return toast('Pick at least one test','red');closeModal();go('#/app/p/labrequests/direct/'+c.join(','))">Compare labs</button>`);
function labCompare(r){
  const sort=tabOf('labsort','price');
  const rows=S.labs.map(l=>({l, total: Math.round(r.tests.reduce((s,c)=>s+test(c).price,0)*l.mult/500)*500})).sort((a,b)=>sort==='price'?a.total-b.total:a.l.km-b.l.km);
  return ph(`<a href="#/app/p/labrequests">Lab tests</a> / ${r.id}`, 'Choose a lab') + `
  <div class="card mb"><div class="row wrap between"><div><div class="small muted">${r.did?'Requested by '+doc(r.did).name:'Your own order'}</div><b>${r.tests.map(c=>test(c).name).join(' · ')}</b><div class="small t2">${esc(r.reason)}</div></div>${tabs('labsort',[['price','Cheapest'],['km','Nearest']],sort)}</div></div>
  <div class="grid g2">${rows.map(({l,total})=>`<div class="card"><div class="row"><span class="ic purple">${ic('flask-conical')}</span><div class="grow"><b>${l.name}</b><div class="small muted">${l.km} km · ${l.hours} · ★ ${l.rating}</div></div></div>
    <div class="mt">${r.tests.map(c=>`<div class="row between small" style="padding:3px 0"><span>${test(c).name}</span><span>${ugx(Math.round(test(c).price*l.mult/500)*500)}</span></div>`).join('')}</div>
    <div class="divider"></div><div class="row between"><div><div class="small muted">Total</div><b style="font-size:20px">${ugx(total)}</b></div><div class="col" style="align-items:flex-end">${l.home?'<span class="badge teal">Home collection</span>':'<span class="badge">Walk-in only</span>'}</div></div>
    ${l.home?`<label class="check small"><input type="checkbox" id="home-${l.id}"> Collect sample at my home (+UGX 10,000)</label>`:''}
    <button class="btn block mt" onclick="A.orderLab('${r.id}','${l.id}',${total},'${r.tests.join(',')}')">Order & pay</button></div>`).join('')}</div>
  <div class="note mt">${ic('lock')}<div>When you order, <b>only this lab</b> can see the details it needs (bio-data, allergies, current medicines and the reason) — and only for this order. Access ends 30 days after the order closes. Every view is logged.</div></div>`;
}
A.orderLab = (rid, lid, total, codes) => {
  const home = $('#home-'+lid)?.checked; const amt = total + (home?10000:0);
  A.pay(amt, `Lab order at ${lab(lid).name}`, (ref)=>{
    const id=uid('LO'); S.labOrders.unshift({id, rid:rid==='DIRECT'?null:rid, pid:ME, lid, tests:codes.split(','), status:'Paid', at:new Date().toISOString(), paid:true, total:amt, home, sample:null, values:{}, enteredBy:null, qa:{}, review:null, released:null});
    const r=S.labRequests.find(x=>x.id===rid); if(r) r.status='Paid';
    if(home) S.homeVisits.push({id:uid('HV'), pid:ME, type:'Sample collection', at:new Date(Date.now()+3*3600e3).toISOString(), status:'Requested', addr:'Ntinda, Kampala', urgent:false, lat:0.354,lng:32.615, labOrder:id});
    audit('Lab order created after verified payment', id); notify(ME,`Order ${id} sent to ${lab(lid).name}.`,'#/app/p/labrequests','lab'); save();
    toast('Order sent to the lab. You can follow each step here.','green'); go('#/app/p/labrequests');
  });
};
A.viewResult = oid => {
  const o=S.labOrders.find(x=>x.id===oid); audit('Patient viewed result', oid);
  modal(`Results · ${o.id}`, `<div class="small muted mb">${lab(o.lid).name} · released ${o.released?fdt(o.released):''} · signed off by ${o.review?.by||''}</div>${resultTable(o)}
    ${o.corrected?`<div class="note warn mt">${ic('file-warning')}<div><b>Corrected report.</b> ${esc(o.corrected)} The original remains visible in your history.</div></div>`:''}
    <div class="note mt">${ic('info')}<div>Values outside the normal range are marked <span class="flag-H">H</span> (high) or <span class="flag-L">L</span> (low). Ask your doctor what they mean for you.</div></div>`,
    `<button class="btn ghost" onclick="window.print()">${ic('download')} Download PDF</button><button class="btn teal" onclick="A.forward('${o.id}')">${ic('send')} Forward to my doctor</button>`, true);
};
function flagOf(v, it){ const n=parseFloat(v); if(isNaN(n)) return ''; if((it.clo!=null&&n<it.clo)||(it.chi!=null&&n>it.chi)) return 'C'; if(it.hi!=null&&n>it.hi) return 'H'; if(it.lo!=null&&n<it.lo) return 'L'; return ''; }
function rangeTxt(it){ return it.lo==null&&it.hi!=null ? '< '+it.hi : it.lo!=null&&it.hi!=null ? it.lo+' – '+it.hi : ''; }
function resultItems(o){ const out=[]; o.tests.forEach(c=>{ const t=test(c); if(t.type==='panel') t.items.forEach(it=>out.push({key:c+':'+it.k, name:t.name+' — '+it.k, it, unit:it.u})); else if(t.type==='qual') out.push({key:c, name:t.name, it:{qual:true, normal:t.range}, unit:''}); else out.push({key:c, name:t.name, it:t, unit:t.unit}); }); return out; }
function resultTable(o){ return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Test</th><th>Result</th><th>Normal range</th><th>Flag</th></tr></thead><tbody>${resultItems(o).map(r=>{ const v=o.values[r.key]; const f=r.it.qual? (v&&v!==r.it.normal&&!/^(neg|non)/i.test(v)?'!':'') : flagOf(v,r.it); return `<tr><td>${r.name}</td><td><b>${esc(v??'—')}</b> ${r.unit}</td><td class="muted">${r.it.qual?r.it.normal:rangeTxt(r.it)+' '+r.unit}</td><td>${f==='C'?'<span class="flag-C">CRITICAL</span>':f==='!'?'<span class="flag-H">Abnormal</span>':f?`<span class="flag-${f}">${f}</span>`:'<span class="up">✓</span>'}</td></tr>`; }).join('')}</tbody></table></div>`; }
A.forward = oid => { const o=S.labOrders.find(x=>x.id===oid);
  modal('Forward results', `<p class="small t2">Choose which results and which doctor. They’ll see them next to the original request. You can withdraw access later.</p>${resultItems(o).map(r=>`<label class="check"><input type="checkbox" checked class="fwd" value="${r.key}"> ${r.name}</label>`).join('')}<div class="field mt"><label>Doctor</label><select class="inp" id="fwdto">${S.doctors.map(d=>`<option value="${d.id}">${d.name} — ${d.spec}</option>`).join('')}</select></div><div class="field"><label>Message (optional)</label><input class="inp" placeholder="e.g. Please review before my follow-up"></div>`,
  `<button class="btn" onclick="A.doForward('${oid}')">${ic('send')} Forward</button>`); };
A.doForward = oid => { const o=S.labOrders.find(x=>x.id===oid); const d=$('#fwdto').value; o.shared=[...new Set([...(o.shared||[]),d])]; S.shares.unshift({id:uid('S'), what:'Lab result '+oid, to:doc(d).name+' (Doctor)', at:new Date().toISOString(), revoked:null}); const r=S.labRequests.find(x=>x.id===o.rid); if(r) r.status='Shared'; audit('Results forwarded to doctor', oid); save(); closeModal(); toast('Shared with '+doc(d).name+'. You can withdraw access in Records.','green'); rerender(); };

  ${orders.length?`<div class="card mb"><h3>My orders</h3>${orders.map(o=>`<div class="li"><span class="ic green">${ic('package')}</span><div class="grow"><div class="t">${o.id} · ${o.items.map(([id,n])=>med(id).name.split(' ')[0]+' ×'+n).join(', ')}</div><div class="s">${o.delivery} · ${o.pay} · ${fdt(o.at)}</div></div>${badgeFor(o.status)}</div>`).join('')}</div>`:''}
  <div class="grid g-21"><div class="grid g2">${items.map(m=>{ const exp=new Date(m.expiry)<Date.now(); return `<div class="card"><div class="row between"><span class="badge ${m.rx?'red':'green'}">${m.rx?'Prescription only':'Over the counter'}</span><span class="small muted">${m.cat}</span></div><h4 class="mt">${m.name}</h4><div class="small muted">Expiry ${fdate(m.expiry)} · ${m.stock>0?m.stock+' in stock':'Out of stock'}</div><div class="row between mt"><b>${ugx(m.price)}</b>${exp?'<span class="badge red">Expired — not for sale</span>':`<div class="row"><button class="icon-btn" style="width:34px;height:34px" onclick="A.cart('${m.id}',-1)">${ic('minus')}</button><b>${cart[m.id]||0}</b><button class="icon-btn" style="width:34px;height:34px" onclick="A.cart('${m.id}',1)">${ic('plus')}</button></div>`}</div></div>`; }).join('')}</div>
  <div class="card" style="align-self:start;position:sticky;top:80px"><h3>${ic('shopping-cart')} Your order</h3>${Object.keys(cart).length?Object.entries(cart).map(([id,n])=>`<div class="row between small" style="padding:4px 0"><span>${med(id).name} ×${n}</span><b>${ugx(med(id).price*n)}</b></div>`).join(''):'<p class="muted small">Empty</p>'}
    <div class="divider"></div>
    <div class="field"><label>Pharmacy</label><select class="inp">${S.pharmacies.filter(p=>p.nda).map(p=>`<option>${p.name} · ${p.km} km</option>`).join('')}</select></div>

    ${Object.keys(cart).some(id=>med(id).rx)?`<div class="field"><label>Prescription</label><select class="inp" id="rxsel">${myRx.map(r=>`<option value="${r.id}">${r.id} — ${doc(r.did).name}</option>`).join('')}<option value="upload">Upload a photo of my prescription</option></select><div class="small muted">Prescription-only items need a valid prescription. Each can be filled once.</div></div>`:''}
    <div class="row between"><b>Total</b><b>${ugx(total+(total?5000:0))}</b></div>
    <button class="btn green block mt" ${total?'':'disabled'} onclick="A.orderMeds(${total+5000})">Order & pay</button></div></div>`;
};

A.viewNote = id => { const c=S.consultations.find(x=>x.id===id); modal('Consultation note', `<div class="small muted mb">${esc(c.by)} · ${fdt(c.at)}</div><dl class="kv"><dt>Complaint</dt><dd>${esc(c.complaint)}</dd><dt>Findings</dt><dd>${esc(c.findings)}</dd><dt>Diagnosis</dt><dd>${esc(c.dx)}</dd><dt>Plan</dt><dd>${esc(c.plan)}</dd></dl>${c.corrects?`<div class="note warn mt">${ic('file-warning')}<div>This is a correction of ${c.corrects}. The original stays visible.</div></div>`:''}`); };
A.revoke = id => { const s=S.shares.find(x=>x.id===id); s.revoked=new Date().toISOString(); audit('Consent withdrawn', s.what); save(); toast('Access withdrawn','green'); rerender(); };
A.shareRecord = () => modal('Share a record', `<div class="field"><label>What</label><select class="inp" id="shw"><option>Full medical profile</option><option>Antenatal record</option>${S.labOrders.filter(o=>o.pid===ME&&o.status==='Released').map(o=>`<option>Lab result ${o.id}</option>`).join('')}</select></div><div class="field"><label>Recipient type</label><select class="inp" id="sht"><option>Doctor</option><option>Pharmacy</option><option>Laboratory</option><option>Insurer</option><option>Research centre</option><option>Health authority</option></select></div><div class="field"><label>Recipient</label><input class="inp" id="shr" value="Dr. Agnes Auma"></div><div class="field"><label>Access until</label><input class="inp" type="date" id="shd"></div><div class="field"><label>Message</label><input class="inp"></div>`, `<button class="btn" onclick="S.shares.unshift({id:uid('S'),what:$('#shw').value,to:$('#shr').value+' ('+$('#sht').value+')',at:new Date().toISOString(),revoked:null});audit('Record shared',$('#shw').value);save();closeModal();toast('Shared. Recorded in your consent log.','green');rerender()">${ic('share-2')} Share</button>`);

/* medical profile */
R['p/profile'] = () => { const p=pat(ME); return ph('My health','Medical profile',`<button class="btn" onclick="A.saveProfile()">${ic('save')} Save</button>`) + `
  <div class="grid g3 mb">${stat('BMI', `<span id="bmiv">${bmi(p.height,p.weight)}</span>`,'scale','teal','Worked out from height & weight')}${stat('Blood group',p.blood,'droplet','red')}${stat('Allergies',p.allergies.join(', '),'alert-triangle','amber')}</div>
  <div class="grid g2"><div class="card"><h3>Bio-data</h3>${[['Full name',p.name],['Date of birth',p.dob,'date'],['Sex',p.sex==='F'?'Female':'Male'],['Phone',p.phone],['Address',p.area],['Occupation',p.occ],['Marital status',p.marital],['Next of kin',p.nok]].map(([l,v,ty])=>`<div class="field"><label>${l}</label><input class="inp" type="${ty||'text'}" value="${esc(v)}"></div>`).join('')}</div>
  <div class="card"><h3>Health details</h3><div class="grid g2" style="gap:10px"><div class="field"><label>Height (cm)</label><input class="inp" id="hh" type="number" value="${p.height}" oninput="$('#bmiv').textContent=bmi(this.value,$('#ww').value)"></div><div class="field"><label>Weight (kg)</label><input class="inp" id="ww" type="number" value="${p.weight}" oninput="$('#bmiv').textContent=bmi($('#hh').value,this.value)"></div></div>
  ${[['Allergies',p.allergies.join(', ')],['Past illnesses / conditions',p.conditions.join(', ')],['Current medicines',p.meds.join(', ')],['Family history',p.fam],['Emergency contact',p.nok],['Insurance',p.insurer]].map(([l,v])=>`<div class="field"><label>${l}</label><input class="inp" value="${esc(v)}"></div>`).join('')}
  <div class="note">${ic('info')}<div>Vital signs (temperature, pulse, BP, breathing, oxygen) are recorded by a clinician at each visit.</div></div></div></div>`; };
A.saveProfile = () => { const p=pat(ME); p.height=+$('#hh').value; p.weight=+$('#ww').value; queueOrRun('Profile update',()=>{ audit('Medical profile updated', ME); save(); toast('Profile saved','green'); }); };

/* pregnancy & family planning (patient side) */
R['p/maternal'] = () => {
  const a=S.anc.find(x=>x.pid===ME); const wk=a?Math.floor((Date.now()-new Date(a.lmp))/604800000):0; const edd=a?new Date(new Date(a.lmp).getTime()+280*864e5):null;
  const sizes={20:'a banana',22:'a papaya',24:'an ear of maize',26:'a cabbage',28:'an aubergine',30:'a large cucumber',32:'a jackfruit (small)',34:'a pineapple'};
  const sz = sizes[Object.keys(sizes).reverse().find(k=>wk>=+k)]||'a mango';
  const ancPlan=[12,20,26,30,34,36,38,40];
  return ph('My health','Pregnancy & family planning') + `
  ${a?`<div class="grid g-12 mb"><div class="card" style="text-align:center"><div style="position:relative;width:160px;height:160px;margin:0 auto"><canvas id="pregring"></canvas><div style="position:absolute;inset:0;display:grid;place-items:center"><div><div style="font-size:34px;font-weight:800">${wk}</div><div class="small muted">weeks</div></div></div></div><h3 class="mt">Baby is about the size of ${sz}</h3><p class="muted small">Due date: <b>${fdate(edd.toISOString())}</b> · ${Math.max(0,40-wk)} weeks to go</p></div>
    <div class="card"><h3>Antenatal contacts (WHO 8-contact model)</h3><div class="steps mt">${ancPlan.map((w,i)=>`<div class="step ${i<a.visits?'done':i===a.visits?'now':''}"><div class="dotx">${i<a.visits?ic('check'):i+1}</div>${w} wk</div>`).join('')}</div>
      <div class="li mt"><span class="ic warm">${ic('calendar')}</span><div class="grow"><div class="t">Next ANC visit</div><div class="s">${fdt(a.next)} · Dr. Agnes Auma</div></div><button class="btn sm" onclick="toast('WhatsApp reminder set for the day before','green')">${ic('bell')} Remind me</button></div>
      <h4 class="mt">This week</h4><ul class="small t2" style="padding-left:18px"><li>Take iron + folic acid daily.</li><li>Sleep under a treated mosquito net; ask about IPTp (malaria prevention).</li><li>Count baby’s movements each day.</li></ul>
      <div class="note red">${ic('siren')}<div><b>Go to hospital now if:</b> bleeding, severe headache or blurred vision, fits, fever, baby stops moving, or water breaks.</div></div></div></div>`:''}
  <div class="grid g2"><div class="card"><h3>${ic('heart-handshake')} Family planning</h3><p class="small t2">Private advice on all methods. Discreet reminders say only “You have an update”.</p>
    ${S.fpMethods.slice(0,6).map(m=>`<div class="li"><span class="ic" style="background:${m.color}22;color:${m.color}">${ic('shield-plus')}</span><div class="grow"><div class="t small">${m.k}</div></div><button class="btn sm ghost" onclick="go('#/app/p/book/d6')">Ask</button></div>`).join('')}</div>
  <div class="card"><h3>${ic('calendar-heart')} Cycle & method reminders</h3><div class="field"><label>Method</label><select class="inp"><option>Pills — daily reminder at 8:00 PM</option><option>Injectable — every 13 weeks</option><option>Implant — removal/replacement date</option></select></div><div class="field"><label>Reminder by</label><div class="chips"><button class="chip on">SMS</button><button class="chip on">WhatsApp</button><button class="chip">Push</button></div></div><button class="btn teal" onclick="toast('Reminder saved. Messages are discreet.','green')">Save reminder</button>
    <h4 class="mt">After baby: postpartum family planning</h4><p class="small t2">Ask at your 36-week visit about methods you can start right after birth (IUD, implant).</p></div></div>`;
};
AFTER; // placeholder
(function(){ const orig=R['p/maternal']; R['p/maternal']=()=>{ const h=orig(); const a=S.anc.find(x=>x.pid===ME); if(a){ const wk=Math.floor((Date.now()-new Date(a.lmp))/604800000); chart('pregring',{type:'doughnut',data:{datasets:[{data:[wk,40-wk],backgroundColor:['#316FF6',css('--bg-2')],borderWidth:0}]},options:{cutout:'80%',plugins:{legend:{display:false},tooltip:{enabled:false}}}}); } return h; }; })();

/* family */
R['p/family'] = () => ph('My health','Family accounts',`<button class="btn" onclick="A.addFam()">${ic('user-plus')} Add family member</button>`) + `${!S.premium?`<div class="note warn mb">${ic('gem')}<div>Family accounts are part of Premium. <a href="#/app/p/premium">Upgrade</a></div></div>`:''}<div class="grid g3">${S.family.map(f=>`<div class="card" style="text-align:center">${av(f.name,'lg')}<h3 class="mt">${f.name}</h3><div class="muted small">${f.rel}${f.age?' · '+f.age+' yrs':''}</div><div class="row mt" style="justify-content:center"><button class="btn sm outline" onclick="toast('Switched to ${esc(f.name)}. Records, appointments and payments are kept separate.','blue')">Switch to</button></div></div>`).join('')}</div>`;
A.addFam = () => modal('Add family member', `<div class="field"><label>Name</label><input class="inp" id="fn"></div><div class="field"><label>Relationship</label><select class="inp" id="fr"><option>Child</option><option>Parent</option><option>Spouse</option></select></div><div class="field"><label>Date of birth</label><input class="inp" type="date"></div>`, `<button class="btn" onclick="S.family.push({name:$('#fn').value||'New member',rel:$('#fr').value,age:null});save();closeModal();rerender()">Add</button>`);

/* alerts */
R['p/alerts'] = () => { const ns=S.notifications.filter(n=>n.pid===ME); const icm={lab:'flask-conical',appt:'calendar',pay:'wallet',result:'file-check-2',rx:'pill',info:'bell'};
  return ph('Account','Alerts',`<button class="btn ghost sm" onclick="S.notifications.forEach(n=>n.read=true);save();rerender()">Mark all read</button>`) + `<div class="card">${ns.map(n=>`<a class="li" style="color:var(--text)" href="${n.go||'#'}" onclick="S.notifications.find(x=>x.id==='${n.id}').read=true;save()"><span class="ic ${n.read?'':'blue'}">${ic(icm[n.type]||'bell')}</span><div class="grow"><div class="t" style="${n.read?'font-weight:500':''}">${esc(n.msg)}</div><div class="s">${ago(n.at)}</div></div>${n.read?'':'<span class="pill" style="min-width:10px;height:10px;padding:0"></span>'}</a>`).join('')}</div><p class="small muted mt">Push and SMS never include health details — they say only that something is ready.</p>`; };

/* payments */
R['p/payments'] = () => { const ps=S.payments.filter(p=>p.who===ME);
  return ph('Account','Payments') + `<div class="grid g3 mb">${stat('Paid this month', ugx(ps.filter(p=>p.status==='Paid').reduce((s,p)=>s+p.amount,0)),'wallet','green')}${stat('Saved methods','MTN MoMo · Airtel','smartphone','amber')}${stat('Insurance','Pearl Health','shield-check','purple','Member no. PH-0042-118')}</div>
  <div class="card"><h3>Transactions</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Reference</th><th>For</th><th>Method</th><th>Amount</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td class="mono">${p.ref}</td><td>${esc(p.for)}</td><td>${p.method}</td><td><b>${ugx(p.amount)}</b></td><td>${badgeFor(p.status)}</td><td>${fdt(p.at)}</td><td>${p.status==='Paid'&&p.method!=='Cash'?`<button class="btn sm ghost" onclick="A.refund('${p.ref}')">Request refund</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7 class="empty">No payments yet</td></tr>'}</tbody></table></div></div>`; };

/* premium */
R['p/premium'] = () => ph('Account','Plans') + `<div class="grid g2" style="max-width:860px">${planCard('Free','UGX 0','per month',['Unlimited symptom checks','Basic doctor booking','Vitals tracking','Medical records storage'],false).replace('href="#/register"','href="#/app/p/home"')}${planCard('Premium','UGX 50,000','per month',['Everything in Free','Video consultations','Priority doctors','Health reports & reminders','Family accounts','Priority support'],true).replace('href="#/register"',`href="javascript:${S.premium?"toast('You are already Premium','blue')":"A.pay(50000,'MB Musawo Premium — 1 month',()=>{S.premium=true;save();rerender();toast('Welcome to Premium!','green')})"}"`)}</div>`;

A.rate = id => { window.__st=5; modal('Rate your visit', '<div class="chips mb" id="stars">'+[1,2,3,4,5].map(n=>'<button class="chip '+(n<=5?'on':'')+'" onclick="A.star('+n+')">'+n+' ★</button>').join('')+'</div><div class="field"><label>Comment (optional)</label><textarea class="inp" id="rc"></textarea></div><label class="check"><input type="checkbox" checked> Post anonymously</label>', '<button class="btn" onclick="A.saveRate(\''+id+'\')">Submit</button>'); };
A.star = n => { window.__st=n; $$('#stars .chip').forEach((c,i)=>c.classList.toggle('on', i<n)); };
A.saveRate = id => { const a=S.appointments.find(x=>x.id===id); a.rated=window.__st||5; S.reviews.unshift({by:'Anonymous', stars:a.rated, text:$('#rc').value||'Good visit', at:new Date().toISOString()}); save(); closeModal(); toast('Thank you for your feedback','green'); rerender(); };
A.refund = ref => modal('Request a refund', '<p class="small t2">Refunds are given when a provider cancels, a sample is rejected and cannot be recollected, or an order cannot be filled.</p><div class="field"><label>Reason</label><select class="inp"><option>Doctor cancelled</option><option>Order not delivered</option><option>Charged twice</option><option>Other</option></select></div><div class="field"><label>Details</label><textarea class="inp"></textarea></div>', '<button class="btn" onclick="A.doRefund(\''+ref+'\')">Send request</button>');
A.doRefund = ref => { S.payments.find(p=>p.ref===ref).status='Refund requested'; audit('Refund requested', ref); save(); closeModal(); toast('Refund request sent. If approved, money returns to your Mobile Money in 24–72 hours.','green'); rerender(); };

</script>
<script>
/* MB Musawo — doctor workspace */
Object.defineProperty(window,'DID',{get:()=>S.meDoc||'d1',configurable:true});
const myAppts = () => S.appointments.filter(a=>a.did===DID);
const hasAccess = pid => myAppts().some(a=>a.pid===pid && a.status!=='Cancelled') || S.labOrders.some(o=>o.pid===pid && (o.shared||[]).includes(DID)) || S.shares.some(s=>!s.revoked && s.to.includes(doc(DID).name) && s.pidx===pid);
const APPT_FLOW = ['Requested','Confirmed','Arrived','In consultation','Done'];

R['d/home'] = () => {
  const today = myAppts().filter(a=>isToday(a.at)).sort((a,b)=>new Date(a.at)-new Date(b.at));
  const pts = [...new Set(myAppts().map(a=>a.pid))];
  const waiting = S.queue.filter(q=>q.stage==='Waiting doctor');
  return ph(doc(DID).name+' · '+doc(DID).spec+' · '+doc(DID).area, `${greet()}, ${doc(DID).name.split(' ').slice(0,2).join(' ')}`, `<a class="btn" href="#/app/d/consult">${ic('notebook-pen')} Start consultation</a>`) + `
  <div class="grid g4 mb">${stat('Today', today.length+' appointments','calendar','blue', today.filter(a=>a.status==='Done').length+' done')}${stat('My patients', pts.length,'users','teal')}${stat('Rating','4.9 ★','star','warm','312 reviews')}${stat('This month', ugx(4850000),'banknote','green','<span class="up">+12%</span> vs Oct')}</div>
  <div class="grid g4 mb">${[['file-signature','Send prescription','#/app/d/rx','green'],['clock','Set availability','#/app/d/availability','blue'],['video','Video consult','#/app/d/video','teal'],['stethoscope','Symptom check','#/app/d/assistant','purple']].map(([i,l,h,c])=>`<a class="card" style="color:var(--text)" href="${h}"><div class="row"><span class="ic ${c}">${ic(i)}</span><b>${l}</b></div></a>`).join('')}</div>
  <div class="grid g-21">
    <div class="card"><div class="card-h"><h3>Today’s schedule</h3><a class="small" href="#/app/d/appointments">Manage</a></div>${today.map(a=>docApptRow(a)).join('')||'<div class="empty">No appointments today</div>'}</div>
    <div class="col">
      <div class="card"><h3>${ic('activity')} Triage alerts</h3>${waiting.map(q=>{const p=pat(q.pid);return `<div class="li"><span class="ic ${q.tri<=2?'red':'amber'}">${ic('activity')}</span><div class="grow"><div class="t small">${p.name}, ${age(p.dob)} y</div><div class="s">${q.vitals&&q.vitals.spo2<95?'SpO₂ '+q.vitals.spo2+'% — see first':q.vitals&&parseInt(q.vitals.bp)>135?'BP '+q.vitals.bp+' — check urine protein':'Stable'}</div></div></div>`;}).join('')}<p class="small muted mt mb0">Guidance only — you decide.</p></div>
      <div class="card"><h3>Lab requests</h3>${S.labRequests.filter(r=>r.did===DID).map(r=>`<div class="li"><div class="grow"><div class="t small">${pat(r.pid).name}</div><div class="s">${r.tests.join(', ')}</div></div>${badgeFor(r.status==='Requested'?'Requested':r.status)}</div>`).join('')}<p class="small muted mt mb0">“Requested” for 3+ days = patient hasn’t ordered yet. Follow up.</p></div>
    </div></div>`;
};
function docApptRow(a){ const p=pat(a.pid); const i=APPT_FLOW.indexOf(a.status); const next=APPT_FLOW[i+1];
  return `<div class="li">${av(p.name)}<div class="grow"><div class="t">${p.name} <span class="muted small">· ${age(p.dob)} y · ${p.sex}</span></div><div class="s">${ftime(a.at)} · ${a.type} · ${esc(a.reason)}</div></div>
  <div class="row wrap" style="justify-content:flex-end;gap:6px">${badgeFor(a.status)}
   ${a.status==='Requested'?`<button class="btn sm green" onclick="A.apptSet('${a.id}','Confirmed')">Accept</button><button class="btn sm ghost" onclick="A.resched('${a.id}')">Reschedule</button><button class="btn sm ghost" onclick="A.apptSet('${a.id}','Cancelled')">Decline</button>`:''}
   ${['Confirmed','Arrived'].includes(a.status)?`<button class="btn sm" onclick="A.apptSet('${a.id}','${next}')">${next==='Arrived'?'Mark arrived':'Start'}</button>`:''}
   ${a.status==='In consultation'?`<button class="btn sm purple" onclick="go('#/app/d/consult/${a.id}')">Open notes</button>`:''}
   ${a.type==='Video'&&!['Done','Cancelled'].includes(a.status)?`<button class="btn sm teal" onclick="A.joinVideo('${a.id}')">${ic('video')}</button>`:''}
   <button class="btn sm ghost" onclick="A.openFile('${a.pid}')">File</button></div></div>`; }
A.apptSet = (id, st) => { const a=S.appointments.find(x=>x.id===id); a.status=st; audit('Appointment '+st.toLowerCase(), id); notify(a.pid, `Your appointment ${id} is now: ${st}.`, '#/app/p/appointments','appt'); save(); toast(`${pat(a.pid).name}: ${st}. Patient notified.`,'green'); rerender(); };
A.resched = id => modal('Reschedule', `<div class="field"><label>New date & time</label><input class="inp" type="datetime-local" id="rs"></div><div class="field"><label>Message to patient</label><input class="inp" value="Sorry, I have an emergency. Is this time OK?"></div>`, `<button class="btn" onclick="const a=S.appointments.find(x=>x.id==='${id}');if($('#rs').value)a.at=new Date($('#rs').value).toISOString();a.status='Confirmed';audit('Rescheduled','${id}');save();closeModal();toast('Rescheduled. Patient notified by SMS.','green');rerender()">Send</button>`);

R['d/appointments'] = () => { const f=tabOf('dap','today'); const list=myAppts().filter(a=>f==='all'||(f==='today'?isToday(a.at):f==='requests'?a.status==='Requested':new Date(a.at)>Date.now())).sort((a,b)=>new Date(a.at)-new Date(b.at));
  return ph('Clinic','Appointments', tabs('dap',[['today','Today'],['requests','New requests'],['upcoming','Upcoming'],['all','All']],f)) + `<div class="card">${list.map(docApptRow).join('')||'<div class="empty">Nothing here</div>'}</div><p class="small muted mt">Flow: Requested → Confirmed → Arrived → In consultation → Done. Reminders go to you before each next patient.</p>`; };

/* patients & patient file */
R['d/patients'] = (pid) => {
  if(pid) return patientFile(pid);
  const ids=[...new Set(myAppts().map(a=>a.pid))]; const q=(S.tabs.dpq||'').toLowerCase();
  return ph('Clinic','My patients',`<input class="inp" style="width:240px" placeholder="Search my patients" value="${esc(S.tabs.dpq||'')}" onchange="S.tabs.dpq=this.value;rerender()">`) + `<div class="note mb">${ic('lock')}<div>You only see patients who booked with you or shared their records. There is no list of all patients.</div></div>
  <div class="grid g3">${ids.map(pat).filter(p=>!q||p.name.toLowerCase().includes(q)).map(p=>`<a class="card" style="color:var(--text)" href="#/app/d/patients/${p.id}"><div class="row">${av(p.name)}<div class="grow"><b>${p.name}</b><div class="small muted">${p.id} · ${age(p.dob)} y · ${p.sex}</div></div></div><div class="row wrap mt" style="gap:6px">${p.conditions.filter(c=>c!=='None').map(c=>`<span class="badge blue">${c}</span>`).join('')}${p.allergies.filter(a=>!/none/i.test(a)).map(a=>`<span class="badge red">⚠ ${a}</span>`).join('')}</div></a>`).join('')}</div>`;
};
function patientFile(pid){
  const p=pat(pid);
  if(S.role==='d' && !hasAccess(pid)) { audit('Denied: open file without consent', pid, false); return ph('Patients','Access denied') + `<div class="card empty"><div class="ic red" style="width:64px;height:64px;border-radius:50%;margin:0 auto">${ic('shield-x')}</div><h3 class="mt">No booking or consent</h3><p>You can open a file only when the patient has booked with you or shared their records. This attempt was logged.</p><button class="btn red" onclick="A.breakGlass('${pid}')">${ic('alarm-clock')} Emergency break-glass access</button></div>`; }
  audit('Viewed patient file', pid);
  const vit=[{d:-180,bp:[152,96],g:8.9},{d:-120,bp:[146,94],g:8.1},{d:-90,bp:[148,94],g:7.8},{d:-45,bp:[140,90],g:7.4},{d:-10,bp:[136,86],g:7.1}];
  chart('trend',{type:'line',data:{labels:vit.map(v=>fdate(new Date(Date.now()+v.d*864e5).toISOString(),{month:'short',day:'numeric'})),datasets:[{label:'Systolic BP',data:vit.map(v=>v.bp[0]),borderColor:'#E5484D',backgroundColor:'#E5484D',tension:.35},{label:'Diastolic BP',data:vit.map(v=>v.bp[1]),borderColor:'#1941BA',backgroundColor:'#1941BA',tension:.35},{label:'Fasting glucose ×10',data:vit.map(v=>v.g*10),borderColor:'#316FF6',backgroundColor:'#316FF6',borderDash:[5,4],tension:.35}]}});
  const results=S.labOrders.filter(o=>o.pid===pid && o.status==='Released' && (S.role!=='d' || (o.shared||[]).includes(DID)));
  const pending=S.labRequests.filter(r=>r.pid===pid);
  const notes=S.consultations.filter(c=>c.pid===pid).sort((a,b)=>new Date(b.at)-new Date(a.at));
  return ph(`<a href="#/app/${S.role}/patients">Patients</a> / ${p.id}`, p.name, `<a class="btn ghost" href="#/app/d/labreq/${pid}">${ic('flask-conical')} Lab request</a><a class="btn ghost" href="#/app/d/rx/${pid}">${ic('file-signature')} Prescribe</a><a class="btn" href="#/app/d/consult/new-${pid}">${ic('notebook-pen')} New note</a>`) + `
  <div class="grid g-12">
    <div class="col"><div class="card" style="text-align:center">${av(p.name,'lg')}<h3 class="mt">${p.name}</h3><div class="muted small">${p.id} · ${age(p.dob)} y · ${p.sex==='F'?'Female':'Male'} · ${p.blood}</div>
      <div class="row wrap mt" style="justify-content:center;gap:6px">${p.allergies.map(a=>`<span class="badge ${/none/i.test(a)?'':'red'}">${/none/i.test(a)?'No known allergies':'⚠ Allergy: '+a}</span>`).join('')}</div></div>

    <div class="col">
