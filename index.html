/* ---------- wards & beds ---------- */
function bedsFor(w){ return [...Array(w.beds)].map((_,i)=>{ const n=i+1; const adm=S.admissions.find(a=>a.ward===w.id&&a.bed===n&&a.status==='Admitted'); return {n, adm, state:adm?'Occupied':(S.bedState[w.id+'-'+n]||'Free')}; }); }
R['common/wards'] = () => { const all=WARDS.flatMap(w=>bedsFor(w)); const occ=all.filter(b=>b.state==='Occupied').length; const mine=S.role==='d'?S.admissions.filter(a=>a.did===DID&&a.status==='Admitted'):null; const f=tabOf('wardf','ALL');
  return ph('Hospital', S.role==='d'?'My inpatients & wards':'Wards & beds', `<button class="btn" onclick="A.admit()">${ic('log-in')} Admit patient</button>`) + `
  <div class="grid g4 mb">${stat('Bed occupancy',Math.round(occ/all.length*100)+'%','bed-double','blue',occ+' of '+all.length+' beds')}${stat('Admitted today',S.admissions.filter(a=>isToday(a.at)).length,'log-in','teal')}${stat('Discharged today',S.admissions.filter(a=>a.status==='Discharged'&&a.out&&isToday(a.out)).length,'log-out','green')}${stat('Average stay','3.2 days','clock','warm')}</div>
  ${mine?`<div class="card mb"><h3>My inpatients</h3>${mine.map(a=>admRow(a)).join('')||'<div class="empty">None</div>'}</div>`:''}
  <div class="chips mb">${[['ALL','All wards'],...WARDS.map(w=>[w.id,w.name])].map(([k,l])=>`<button class="chip ${f===k?'on':''}" onclick="A.tab('wardf','${k}')">${l}</button>`).join('')}</div>
  ${WARDS.filter(w=>f==='ALL'||w.id===f).map(w=>{ const b=bedsFor(w); return `<div class="card mb"><div class="card-h"><h3>${w.name}</h3><span class="small muted">${b.filter(x=>x.state==='Occupied').length}/${w.beds} occupied</span></div><div class="beds">${b.map(x=>`<button class="bed ${x.state.toLowerCase()}" onclick="${x.adm?`A.admView('${x.adm.id}')`:x.state==='Free'?`A.admit('${w.id}',${x.n})`:`A.bedReady('${w.id}',${x.n})`}"><span class="bn">${w.id}-${x.n}</span>${x.adm?`<b>${esc(pat(x.adm.pid).name)}</b><small>${esc(x.adm.dx.split('—')[0])}</small><small>Day ${Math.max(1,Math.ceil((Date.now()-new Date(x.adm.at))/864e5))}</small>`:`<small>${x.state}</small>`}</button>`).join('')}</div></div>`; }).join('')}
  <div class="row wrap small muted">${[['occupied','Occupied'],['free','Free'],['cleaning','Cleaning'],['reserved','Reserved']].map(([c,l])=>`<span class="row" style="gap:6px"><i class="bed-key ${c}"></i>${l}</span>`).join('')}</div>`; };
function admRow(a){ const p=pat(a.pid), w=WARDS.find(x=>x.id===a.ward); return `<div class="li">${av(p.name,'sm')}<div class="grow"><div class="t small">${esc(p.name)} · ${w.name}, bed ${a.bed}</div><div class="s">${esc(a.dx)} · ${doc(a.did).name}</div></div><button class="btn sm ghost" onclick="A.admView('${a.id}')">Open</button></div>`; }
['c','n','d'].forEach(r=>{ R[r+'/wards']=R['common/wards']; R[r+'/register']=R['common/register']; });
A.bedReady = (w,n) => { delete S.bedState[w+'-'+n]; save(); toast('Bed '+w+'-'+n+' marked clean and free','green'); rerender(); };
A.admit = (w,n) => { const free=WARDS.flatMap(x=>bedsFor(x).filter(b=>b.state==='Free').map(b=>[x.id,b.n,x.name]));
  modal('Admit patient', `<div class="field"><label>Patient</label><select class="inp" id="ap">${S.patients.filter(p=>!S.admissions.some(a=>a.pid===p.id&&a.status==='Admitted')).map(p=>`<option value="${p.id}">${esc(p.name)} · ${mrn(p.id)}</option>`).join('')}</select></div><div class="field"><label>Bed</label><select class="inp" id="ab">${free.map(([id,b,name])=>`<option value="${id}|${b}" ${id===w&&b===n?'selected':''}>${name} — bed ${b}</option>`).join('')}</select></div><div class="field"><label>Admitting diagnosis</label><input class="inp" id="ad" placeholder="e.g. Severe malaria"></div><div class="field"><label>Consultant</label><select class="inp" id="ac">${S.doctors.map(d=>`<option value="${d.id}" ${d.id===DID?'selected':''}>${d.name} — ${d.spec}</option>`).join('')}</select></div><div class="field"><label>Deposit / payer</label><select class="inp"><option>Insurance (pre-authorisation requested)</option><option>Cash deposit UGX 200,000</option><option>Mobile Money deposit</option></select></div>`,
  `<button class="btn" onclick="const [w,b]=$('#ab').value.split('|');const a={id:uid('ADM'),pid:$('#ap').value,ward:w,bed:+b,at:new Date().toISOString(),dx:$('#ad').value||'Under observation',did:$('#ac').value,status:'Admitted'};S.admissions.push(a);audit('Patient admitted '+w+'-'+b,a.pid);save();closeModal();toast('Admitted to '+w+' bed '+b+'. Wristband ready to print.','green');rerender()">Admit</button>`); };
A.admView = id => { const a=S.admissions.find(x=>x.id===id); const p=pat(a.pid), w=WARDS.find(x=>x.id===a.ward);
  modal(`${esc(p.name)} · ${w.name}, bed ${a.bed}`, patientBanner(a.pid)+`<dl class="kv mt"><dt>Admitted</dt><dd>${fdt(a.at)}</dd><dt>Diagnosis</dt><dd>${esc(a.dx)}</dd><dt>Consultant</dt><dd>${doc(a.did).name}</dd></dl>
    <h4 class="mt">Today’s observations</h4><div class="tbl-wrap"><table class="tbl" style="min-width:0"><thead><tr><th>Time</th><th>Temp</th><th>Pulse</th><th>BP</th><th>SpO₂</th><th>By</th></tr></thead><tbody>${[['06:00','37.2','88','128/82','97'],['10:00','37.0','84','124/80','98'],['14:00','36.9','82','122/78','98']].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}<td class="small">Sr. Grace Atim</td></tr>`).join('')}</tbody></table></div>`,
    `<button class="btn ghost" onclick="A.patientCard('${a.pid}')">${ic('id-card')} Wristband</button><button class="btn ghost" onclick="A.transfer2('${id}')">${ic('arrow-left-right')} Transfer</button><button class="btn" onclick="A.discharge('${id}')">${ic('log-out')} Discharge</button>`, true); };
A.transfer2 = id => { const a=S.admissions.find(x=>x.id===id); const free=WARDS.flatMap(x=>bedsFor(x).filter(b=>b.state==='Free').map(b=>[x.id,b.n,x.name])); modal('Transfer patient', `<div class="field"><label>New bed</label><select class="inp" id="tb">${free.map(([w,b,n])=>`<option value="${w}|${b}">${n} — bed ${b}</option>`).join('')}</select></div><div class="field"><label>Reason</label><input class="inp" id="tr" value="Clinical need"></div>`, `<button class="btn" onclick="const a=S.admissions.find(x=>x.id==='${id}');S.bedState[a.ward+'-'+a.bed]='Cleaning';const [w,b]=$('#tb').value.split('|');a.ward=w;a.bed=+b;audit('Patient transferred to '+w+'-'+b,a.pid);save();closeModal();toast('Transferred','green');rerender()">Transfer</button>`); };
A.discharge = id => { const a=S.admissions.find(x=>x.id===id); const p=pat(a.pid);
  modal('Discharge summary', `<div class="field"><label>Final diagnosis</label><input class="inp" id="dd" value="${esc(a.dx.split('—')[0].trim())}"></div><div class="field"><label>Treatment given</label><textarea class="inp" id="dt">Treated as per protocol. Observations stable for 24 hours.</textarea></div><div class="field"><label>Medicines to take home</label><textarea class="inp" id="dm">As on the e-prescription.</textarea></div><div class="field"><label>Follow-up</label><input class="inp" id="df" value="Review in OPD in 1 week"></div><div class="field"><label>Condition at discharge</label><select class="inp" id="dc"><option>Improved</option><option>Stable</option><option>Referred</option><option>Discharged against medical advice</option></select></div>`,
  `<button class="btn" onclick="A.doDischarge('${id}')">${ic('log-out')} Discharge & print summary</button>`); };
A.doDischarge = id => { const a=S.admissions.find(x=>x.id===id); const p=pat(a.pid); const days=Math.max(1,Math.ceil((Date.now()-new Date(a.at))/864e5));
  const html=`<div style="font-family:sans-serif;color:#111;max-width:700px">${docHead('Discharge summary')}<table style="width:100%;font-size:13.5px;border-collapse:collapse">${[['Patient',p.name+' ('+mrn(p.id)+')'],['Age / sex',age(p.dob)+' y · '+(p.sex==='F'?'Female':'Male')],['Ward / bed',WARDS.find(w=>w.id===a.ward).name+' · bed '+a.bed],['Admitted',fdt(a.at)],['Discharged',fdt(new Date().toISOString())+' ('+days+' day'+(days>1?'s':'')+')'],['Consultant',doc(a.did).name],['Final diagnosis',$('#dd').value],['Treatment',$('#dt').value],['Take-home medicines',$('#dm').value],['Follow-up',$('#df').value],['Condition',$('#dc').value],['Allergies',p.allergies.join(', ')]].map(([k,v])=>`<tr><td style="padding:6px;border-bottom:1px solid #ddd;color:#555;width:30%">${k}</td><td style="padding:6px;border-bottom:1px solid #ddd">${esc(v)}</td></tr>`).join('')}</table><p style="margin-top:30px;font-size:13px">Signed: ______________________ ${doc(a.did).name} (${doc(a.did).lic})</p></div>`;
  a.status='Discharged'; a.out=new Date().toISOString(); S.bedState[a.ward+'-'+a.bed]='Cleaning'; S.consultations.push({id:uid('C'), pid:a.pid, by:doc(a.did).name, at:a.out, complaint:'Inpatient stay '+days+' days', findings:$('#dt').value, dx:$('#dd').value, plan:$('#df').value}); notify(a.pid,'You have been discharged. Your discharge summary is in your records.','#/app/p/records','info'); audit('Patient discharged', a.pid); save(); closeModal(); A.printDoc(html,'discharge summary'); toast('Discharged. Bed sent for cleaning. Summary saved to the record.','green'); rerender(); };

/* ---------- operating theatre ---------- */
const OT_FLOW=['Scheduled','Sign in','In theatre','Recovery','Done'];
R['common/theatre'] = () => ph('Hospital','Operating theatre', `<button class="btn" onclick="A.bookOT()">${ic('plus')} Book operation</button>`) + `<div class="grid g4 mb">${stat('Operations today',S.theatre.filter(o=>isToday(o.at)).length,'scissors','blue')}${stat('In theatre now',S.theatre.filter(o=>o.status==='In theatre').length,'activity','red')}${stat('In recovery',S.theatre.filter(o=>o.status==='Recovery').length,'bed','teal')}${stat('Safety checklist','100%','shield-check','green','completed before incision')}</div>
  <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Time</th><th>Theatre</th><th>Patient</th><th>Operation</th><th>Surgeon</th><th>Anaesthesia</th><th>WHO checklist</th><th>Status</th><th></th></tr></thead><tbody>${S.theatre.sort((a,b)=>new Date(a.at)-new Date(b.at)).map(o=>{ const done=['in','time','out'].filter(k=>o.check[k]).length; const nx=OT_FLOW[OT_FLOW.indexOf(o.status)+1]; return `<tr><td>${fdt(o.at)}</td><td>${o.room}</td><td><b>${esc(pat(o.pid).name)}</b><div class="small muted">${mrn(o.pid)}</div></td><td>${esc(o.proc)}</td><td>${o.surgeon}</td><td>${o.anaes}</td><td><button class="btn sm ghost" onclick="A.whoCheck('${o.id}')">${done}/3</button></td><td>${badgeFor(o.status==='Done'?'Done':o.status==='Scheduled'?'Confirmed':'In progress')} <span class="small">${o.status}</span></td><td>${nx?`<button class="btn sm" onclick="A.otNext('${o.id}')">→ ${nx}</button>`:''}</td></tr>`; }).join('')}</tbody></table></div></div>
  <p class="small muted mt">The WHO Surgical Safety Checklist must be complete before the operation moves forward.</p>`;
['c','n','d'].forEach(r=>R[r+'/theatre']=R['common/theatre']);
const WHO_CK = {in:['Sign in (before anaesthesia)',['Patient identity, site, procedure and consent confirmed','Site marked','Anaesthesia safety check done','Pulse oximeter working','Known allergy checked','Airway / aspiration risk assessed','Blood loss risk >500 ml planned for']],time:['Time out (before incision)',['Team introduced by name and role','Patient, site and procedure confirmed','Antibiotic given within 60 minutes','Critical events reviewed','Imaging displayed']],out:['Sign out (before leaving theatre)',['Procedure recorded','Instrument, swab and needle counts correct','Specimens labelled','Equipment problems noted','Recovery plan agreed']]};
A.whoCheck = id => { const o=S.theatre.find(x=>x.id===id); modal('WHO Surgical Safety Checklist · '+esc(pat(o.pid).name), Object.entries(WHO_CK).map(([k,[t,items]])=>`<div class="card flat mb" style="padding:12px"><div class="row between"><h4 class="mb0">${t}</h4>${o.check[k]?'<span class="badge green">Complete</span>':''}</div>${items.map(it=>`<label class="check small"><input type="checkbox" class="ck-${k}" ${o.check[k]?'checked':''}> ${it}</label>`).join('')}<button class="btn sm mt" onclick="if($$('.ck-${k}').some(x=>!x.checked))return toast('Tick every item first','red');S.theatre.find(x=>x.id==='${id}').check['${k}']=1;audit('WHO checklist: ${t}','${id}');save();A.whoCheck('${id}')">Confirm ${t.split(' (')[0]}</button></div>`).join(''), '', true); };
A.otNext = id => { const o=S.theatre.find(x=>x.id===id); const nx=OT_FLOW[OT_FLOW.indexOf(o.status)+1]; const need={'In theatre':['in','time'],'Recovery':['in','time'],'Done':['in','time','out']}[nx]||[]; if(need.some(k=>!o.check[k])) return toast('Complete the WHO checklist first ('+need.filter(k=>!o.check[k]).map(k=>WHO_CK[k][0].split(' (')[0]).join(', ')+')','red'); o.status=nx; audit('Theatre: '+nx, id); save(); rerender(); };
A.bookOT = () => modal('Book operation', `<div class="field"><label>Patient</label><select class="inp" id="op">${S.patients.map(p=>`<option value="${p.id}">${esc(p.name)} · ${mrn(p.id)}</option>`).join('')}</select></div><div class="field"><label>Operation</label><input class="inp" id="oo" list="ops"><datalist id="ops"><option>Caesarean section</option><option>Appendicectomy</option><option>Hernia repair</option><option>Tubal ligation</option><option>Incision and drainage</option><option>Evacuation of retained products</option></datalist></div><div class="grid g2" style="gap:10px"><div class="field"><label>Date & time</label><input class="inp" type="datetime-local" id="ot"></div><div class="field"><label>Theatre</label><select class="inp" id="or"><option>Theatre 1</option><option>Theatre 2</option><option>Minor theatre</option></select></div></div><div class="field"><label>Surgeon</label><select class="inp" id="os">${S.doctors.map(d=>`<option>${d.name}</option>`).join('')}</select></div>`, `<button class="btn" onclick="S.theatre.push({id:uid('OT'),pid:$('#op').value,proc:$('#oo').value||'Procedure',room:$('#or').value,at:$('#ot').value?new Date($('#ot').value).toISOString():new Date(Date.now()+864e5).toISOString(),surgeon:$('#os').value,anaes:'Dr. Paul Wandera',status:'Scheduled',check:{}});audit('Operation booked',$('#op').value);save();closeModal();rerender()">Book</button>`);

/* ---------- radiology ---------- */
R['common/radiology'] = () => ph('Hospital','Radiology & imaging', `<button class="btn" onclick="A.orderImg()">${ic('plus')} New imaging request</button>`) + `<div class="grid g4 mb">${stat('Requests today',S.imaging.filter(i=>isToday(i.at)).length,'scan','blue')}${stat('Awaiting report',S.imaging.filter(i=>i.status!=='Reported').length,'hourglass','warm')}${stat('Report turnaround','2.4 h','timer','teal')}${stat('Equipment','X-ray · Ultrasound · ECG','monitor','green')}</div>
  <div class="card">${S.imaging.sort((a,b)=>new Date(b.at)-new Date(a.at)).map(i=>`<div class="li"><span class="ic blue">${ic('scan')}</span><div class="grow"><div class="t">${esc(i.test)} · ${esc(pat(i.pid).name)} <span class="small muted">${mrn(i.pid)}</span></div><div class="s">${esc(i.reason)} · requested by ${doc(i.did).name} · ${fdt(i.at)}</div></div>${badgeFor(i.status==='Reported'?'Released':i.status==='Requested'?'Requested':'Awaiting review')}<button class="btn sm ${i.status==='Reported'?'ghost':''}" onclick="A.imgReport('${i.id}')">${i.status==='Reported'?'View report':'Write report'}</button></div>`).join('')}</div>`;
['c','d'].forEach(r=>R[r+'/radiology']=R['common/radiology']); R['d/imaging']=R['common/radiology'];
A.orderImg = () => modal('Imaging request', `<div class="field"><label>Patient</label><select class="inp" id="ip">${S.patients.map(p=>`<option value="${p.id}">${esc(p.name)} · ${mrn(p.id)}</option>`).join('')}</select></div><div class="field"><label>Examination</label><select class="inp" id="it"><option>Chest X-ray (PA)</option><option>Obstetric ultrasound</option><option>Abdominal ultrasound</option><option>Pelvic ultrasound</option><option>X-ray limb</option><option>ECG & echocardiogram</option></select></div><div class="field"><label>Clinical reason</label><input class="inp" id="ir"></div><label class="check"><input type="checkbox" id="ipreg"> Patient may be pregnant (radiographer will check before X-ray)</label>`, `<button class="btn" onclick="S.imaging.unshift({id:uid('IMG'),pid:$('#ip').value,test:$('#it').value,reason:$('#ir').value||'Clinical review',did:DID,at:new Date().toISOString(),status:'Requested',report:'',by:''});audit('Imaging requested',$('#ip').value);save();closeModal();toast('Request sent to radiology','green');rerender()">Send request</button>`);
A.imgReport = id => { const i=S.imaging.find(x=>x.id===id);
  if(i.status==='Reported'){ window.__printHTML = `<div style="font-family:sans-serif;color:#111;max-width:700px">${docHead('Imaging report — '+esc(i.test))}<p><b>${esc(pat(i.pid).name)}</b> (${mrn(i.pid)}) · requested by ${doc(i.did).name} · ${fdt(i.at)}</p><p>${esc(i.report)}</p><p style="margin-top:24px">Reported by ${esc(i.by)}</p></div>`;
    return modal('Report · '+esc(i.test), patientBanner(i.pid)+`<p class="mt">${esc(i.report)}</p><p class="small muted">Reported by ${esc(i.by)}</p>`, `<button class="btn" onclick="A.printDoc(window.__printHTML,'imaging report')">${ic('printer')} Print</button>`); }
  modal('Write report · '+esc(i.test), patientBanner(i.pid)+`<div class="field mt"><label>Findings & impression</label><textarea class="inp" id="rp" style="min-height:140px"></textarea></div>`, `<button class="btn" onclick="const i=S.imaging.find(x=>x.id==='${id}');i.report=$('#rp').value||'No abnormality detected.';i.status='Reported';i.by='Dr. Grace Nabwire (Radiologist)';notify(i.pid,'Your imaging report is ready.','#/app/p/records','result');audit('Imaging reported','${id}');save();closeModal();rerender()">Sign & release</button>`); };

/* ---------- blood bank ---------- */
R['c/bloodbank'] = () => ph('Hospital','Blood bank', `<button class="btn" onclick="A.bloodReq()">${ic('plus')} Request blood</button>`) + `<div class="grid g4 mb">${Object.entries(S.blood).map(([g,n])=>`<div class="card stat"><div class="k">Group ${g}</div><div class="v" style="color:${n<3?'var(--red)':'inherit'}">${n}</div><div class="d">${n<3?'<span class="down">Low — order from Uganda Blood Transfusion Service</span>':'units in stock'}</div></div>`).join('')}</div>
  <div class="card"><h3>Before every transfusion</h3>${['Group and cross-match done','Unit within expiry and bag intact','Two staff check patient ID against the unit at the bedside','Baseline observations recorded; observe 15 minutes after starting'].map(x=>`<div class="li"><span class="ic green">${ic('check')}</span><div class="grow small">${x}</div></div>`).join('')}</div>`;
A.bloodReq = () => modal('Request blood', `<div class="field"><label>Patient</label><select class="inp" id="bp">${S.patients.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.blood}</option>`).join('')}</select></div><div class="field"><label>Units</label><input class="inp" type="number" id="bu" value="1" min="1"></div><div class="field"><label>Urgency</label><select class="inp"><option>Routine</option><option>Urgent (1 hour)</option><option>Emergency (uncross-matched O−)</option></select></div>`, `<button class="btn" onclick="const p=pat($('#bp').value);const g=p.blood in S.blood?p.blood:'O-';const u=+$('#bu').value;if(S.blood[g]<u)return toast('Not enough '+g+' in stock','red');S.blood[g]-=u;audit('Blood issued '+u+' × '+g,p.id);save();closeModal();toast(u+' unit(s) '+g+' issued for '+p.name,'green');rerender()">Issue</button>`);

/* ---------- duty roster ---------- */
R['c/roster'] = () => { const days=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()+i);return x;}); const L={D:['Day','green'],N:['Night','purple'],O:['Off','']};
  return ph('Hospital','Duty roster — this week', `<button class="btn ghost" onclick="window.print()">${ic('printer')} Print</button>`) + `<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Staff</th><th>Role</th>${days.map(d=>`<th>${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric'})}</th>`).join('')}</tr></thead><tbody>${S.roster.map(([n,r,s],ri)=>`<tr><td><b>${n}</b></td><td class="small muted">${r}</td>${[...s].map((c,ci)=>`<td><button class="badge ${L[c][1]}" style="cursor:pointer" onclick="const r=S.roster[${ri}];const a=[...r[2]];a[${ci}]=({D:'N',N:'O',O:'D'})[a[${ci}]];r[2]=a.join('');save();rerender()">${L[c][0]}</button></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted mt mb0">Tap a shift to change it. Day 08:00–20:00 · Night 20:00–08:00. Staff get their roster by SMS.</p></div>`; };

</script>
<script>
/* MB Musawo — hospital management sections for the hospital admin:
   Dashboard · Patients · Doctors · Appointments · Laboratory · Pharmacy · Billing · Inpatients · Emergency · Reports · Settings
   plus the welcome banner with quick actions on every staff dashboard. */

const hDate = iso => { const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); };
const ageOf = dob => dob ? Math.floor((Date.now()-new Date(dob))/3.15576e10) : '—';
const H_STATUS = s => `<span class="badge ${badgeFor(s)}">${s}</span>`;

/* ---------- menu: the 11 main sections first, everything else kept below ---------- */
(function(){
  const all={}; NAV.c.forEach(([,items])=>items.forEach(i=>{ all[i[0]]=i; }));
  const MAIN=[['home','Dashboard','layout-dashboard'],['patients','Patients','users'],['doctors','Doctors','stethoscope'],['schedule','Appointments','calendar-days'],['lab','Laboratory','flask-conical'],['pharmacy','Pharmacy','pill'],['billing','Billing','receipt'],['wards','Inpatients','bed-double'],['emergency','Emergency','siren'],['analytics','Reports','bar-chart-3'],['staff','Settings','sliders-horizontal']];
  const CLIN=['register','queue','theatre','radiology','bloodbank','ambulance','fp','maternal','telemed'];
  const OPS=['roster','inbox','claims','reminders','stock','branches','outreach','feedback','notes'];
  const used=new Set([...MAIN.map(m=>m[0]),...CLIN,...OPS,'help','notifications','settings']);
  const pick=ks=>ks.filter(k=>all[k]).map(k=>all[k]);
  const extra=Object.keys(all).filter(k=>!used.has(k)).map(k=>all[k]);
  NAV.c.length=0;
  NAV.c.push(['Hospital',MAIN],['Clinical services',pick(CLIN)],['Operations',[...pick(OPS),...extra]],['Account',[['help','Help & support','life-buoy'],['notifications','Notifications','bell'],['settings','My preferences','user-cog']].filter(i=>all[i[0]]||i[0]!=='x')]);
  BNAV.c=[['home','Home','layout-dashboard'],['patients','Patients','users'],['schedule','Appts','calendar-days'],['emergency','Emergency','siren'],['billing','Billing','receipt']];
})();

/* ---------- sample data for the emergency department ---------- */
function seedED(){
  if(S.ed) return;
  const m=n=>new Date(Date.now()-n*60000).toISOString();
  S.ed=[
    {id:'ED-4410',name:'Unknown male (~30 y)',pid:null,complaint:'Road accident — head injury, GCS 11',tri:'Red',at:m(12),by:'Ambulance AMB-02',did:'d1',status:'Resuscitation'},
    {id:'ED-4409',name:'Grace Atim',pid:'P-10236',complaint:'Severe abdominal pain, 28 weeks pregnant',tri:'Orange',at:m(26),by:'Walk-in',did:'d2',status:'Being seen'},
    {id:'ED-4408',name:'Brian Okello (child, 4 y)',pid:null,complaint:'High fever and convulsion at home',tri:'Orange',at:m(41),by:'Brought by mother',did:'d4',status:'Being seen'},
    {id:'ED-4407',name:'Peter Ssemwogerere',pid:null,complaint:'Deep cut on left hand',tri:'Yellow',at:m(55),by:'Walk-in',did:null,status:'Waiting'},
    {id:'ED-4406',name:'Aisha Nambi',pid:null,complaint:'Asthma attack — improving after nebuliser',tri:'Yellow',at:m(80),by:'Walk-in',did:'d1',status:'Observation'},
    {id:'ED-4405',name:'Joseph Kato',pid:null,complaint:'Sprained ankle',tri:'Green',at:m(95),by:'Walk-in',did:null,status:'Waiting'}];
  save();
}
seedED();
{ const rd=A.resetDemo; A.resetDemo=()=>{ rd(); seedED(); }; }

const ED_TRI={Red:['red','Immediately'],Orange:['amber','Within 10 min'],Yellow:['blue','Within 60 min'],Green:['green','Within 4 h']};
const ED_ORDER={Red:0,Orange:1,Yellow:2,Green:3};

/* ---------- Patients: registration and records ---------- */
R['c/patients'] = pid => {
  if(pid && pid.length) return patientFile(Array.isArray(pid)?pid[0]:pid);
  const q=(S.tabs.pq||'').toLowerCase();
  const adm=new Set((S.admissions||[]).filter(a=>a.status==='Admitted').map(a=>a.pid));
  const list=S.patients.filter(p=>!q || (p.name+' '+p.id+' '+(p.phone||'')).toLowerCase().includes(q));
  const wk=S.patients.filter(p=>p.id>='P-10300').length;
  return ph(bname(),'Patients',`<a class="btn" href="#/app/c/register">${ic('user-plus')} Register patient</a>`)+
  `<div class="grid g4 mb">${stat('Registered patients',S.patients.length.toLocaleString(),'users','blue')}${stat('Admitted now',adm.size,'bed-double','teal')}${stat('Registered this week',wk,'user-plus','purple')}${stat('With allergies',S.patients.filter(p=>p.allergies&&p.allergies.length).length,'triangle-alert','red')}</div>
  <div class="card"><div class="row between wrap mb"><h3 style="margin:0">Patient records</h3><input class="inp" id="pq" style="max-width:320px" placeholder="Search name, hospital number or phone" value="${(S.tabs.pq||'').replace(/"/g,'&quot;')}" oninput="S.tabs.pq=this.value;clearTimeout(window.__pq);window.__pq=setTimeout(()=>{render();const e=document.getElementById('pq');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},250)"></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Patient</th><th>Number</th><th>Sex / age</th><th>Phone</th><th>Blood</th><th>Status</th><th></th></tr></thead><tbody>${list.slice(0,40).map(p=>`<tr><td>${av(p.name,'sm')} ${p.name}</td><td class="mono">${p.id}</td><td>${p.sex||'—'} · ${ageOf(p.dob)}</td><td>${p.phone||'—'}</td><td>${p.blood||'—'}</td><td>${adm.has(p.id)?'<span class="badge teal">Admitted</span>':'<span class="badge">Outpatient</span>'}</td><td><a class="btn sm ghost" href="#/app/c/patients/${p.id}">Open record</a></td></tr>`).join('')||'<tr><td colspan="7" class="muted">No patient matches that search.</td></tr>'}</tbody></table></div>
  <p class="small muted mt">Showing ${Math.min(40,list.length)} of ${list.length}. Opening a record is written to the audit log.</p></div>`;
};

/* ---------- Doctors: profiles and schedules ---------- */
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const docHours=(d,i)=>DAYS.map((_,k)=>{ const s=(d.id.charCodeAt(1)+i+k)%7; return k===6 ? (s<2?'09–13':'Off') : s===0?'Off': s<3?'08–14': s<5?'14–20':'08–17'; });
R['c/doctors'] = () => {
  const on=S.doctors.filter(d=>d.status==='Available').length;
  return ph(bname(),'Doctors',`<button class="btn" onclick="A.addDoctor()">${ic('user-plus')} Add doctor</button>`)+
  `<div class="grid g4 mb">${stat('Doctors',S.doctors.length,'stethoscope','blue')}${stat('On duty now',on,'circle-check','green')}${stat('Specialities',new Set(S.doctors.map(d=>d.spec)).size,'layers','purple')}${stat('Consultation fee',ugx(35000),'banknote','teal','Same for every doctor')}</div>
  <div class="card mb"><h3>Weekly schedule</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Doctor</th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${S.doctors.map((d,i)=>`<tr><td>${d.name}<div class="small muted">${d.spec}</div></td>${docHours(d,i).map(h=>`<td class="mono small" style="${h==='Off'?'color:var(--muted)':''}">${h}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
  <div class="grid g3">${S.doctors.map(d=>`<div class="card"><div class="row" style="gap:12px">${av(d.name)}<div style="min-width:0"><b>${d.name}</b><div class="small muted">${d.spec} · ${(S.branches.find(b=>b.id===d.branch)||{}).name||d.area}</div></div></div>
    <div class="small mt" style="display:grid;grid-template-columns:auto 1fr;gap:4px 12px"><span class="muted">Licence</span><span class="mono">${d.lic||'—'}</span><span class="muted">Rating</span><span>${d.rating} (${d.reviews} reviews)</span><span class="muted">Consults by</span><span>${(d.types||[]).join(', ')}</span></div>
    <div class="row between mt"><span class="badge ${d.status==='Available'?'green':'amber'}">${d.status==='Available'?'On duty':d.status}</span><button class="btn sm ghost" onclick="A.docSchedule('${d.id}')">Schedule</button></div></div>`).join('')}</div>`;
};
A.docSchedule = id => { const i=S.doctors.findIndex(d=>d.id===id), d=S.doctors[i]; const appts=(S.appointments||[]).filter(a=>a.did===id);
  modal(d.name+' — schedule', `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Day</th><th>Hours</th></tr></thead><tbody>${docHours(d,i).map((h,k)=>`<tr><td>${DAYS[k]}</td><td>${h==='Off'?'<span class="muted">Off duty</span>':h}</td></tr>`).join('')}</tbody></table></div><h4 class="mt">Booked appointments</h4>${appts.length?appts.map(a=>`<div class="row between small" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${hDate(a.at)} · ${pat(a.pid).name}</span>${H_STATUS(a.status)}</div>`).join(''):'<p class="muted small">No appointments booked.</p>'}`,
  `<button class="btn" onclick="closeModal();audit('Doctor schedule changed','${id}');toast('Schedule saved and shared with the doctor','green')">Save hours</button>`); };
A.addDoctor = () => modal('Add doctor', `<div class="field"><label for="nd-n">Full name</label><input class="inp" id="nd-n" placeholder="Dr. "></div><div class="field"><label for="nd-s">Speciality</label><select class="inp" id="nd-s">${['General Practitioner','Paediatrician','Obstetrician & Gynaecologist','Physician','Surgeon','Dentist'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label for="nd-l">UMDPC licence number</label><input class="inp" id="nd-l" placeholder="UMDPC/2020/0000"></div><div class="field"><label for="nd-b">Branch</label><select class="inp" id="nd-b">${S.branches.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</select></div>`,
  `<button class="btn" onclick="A.saveDoctor()">Add doctor</button>`);
A.saveDoctor = () => { const n=document.getElementById('nd-n').value.trim(); if(n.length<5){ toast('Enter the doctor’s full name','red'); return; }
  const b=document.getElementById('nd-b').value; S.doctors.push({id:'d'+(S.doctors.length+1)+'x',name:n.startsWith('Dr')?n:'Dr. '+n,spec:document.getElementById('nd-s').value,area:(S.branches.find(x=>x.id===b)||{}).name,branch:b,rating:5,reviews:0,fee:35000,types:['In person','Video'],status:'Available',lic:document.getElementById('nd-l').value||'Pending check'});
  save(); closeModal(); audit('Doctor added',n); toast('Doctor added. Licence check sent to the medical council register.','green'); render(); };

/* ---------- Laboratory: test requests and results ---------- */
R['c/lab'] = () => {
  const lo=S.labOrders||[], lr=S.labRequests||[];
  const rows=[...lo.map(o=>({id:o.id,pid:o.pid,tests:o.tests,status:o.status,at:o.at,lab:(S.labs.find(l=>l.id===o.lid)||{}).name,total:o.total,paid:o.paid})),
              ...lr.filter(r=>!lo.some(o=>o.rid===r.id)).map(r=>({id:r.id,pid:r.pid,tests:r.tests||[],status:r.status||'Requested',at:r.at,lab:'Not yet chosen',total:r.total,paid:r.paid}))];
  const tn=c=>(S.tests.find(t=>t.code===c||t.id===c)||{}).name||c;
  const done=rows.filter(r=>/Result|Done|Released|Complete/i.test(r.status)).length;
  return ph(bname(),'Laboratory',`<a class="btn ghost" href="#/app/c/radiology">${ic('scan-line')} Imaging</a>`)+
  `<div class="grid g4 mb">${stat('Requests',rows.length,'clipboard-list','blue')}${stat('In progress',rows.filter(r=>/progress|Collected|Sample/i.test(r.status)).length,'loader','amber')}${stat('Results ready',done,'file-check','green')}${stat('Average turnaround','3 h 40 min','timer','teal','Target 4 h')}</div>
  <div class="card mb"><h3>Test requests and results</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Request</th><th>Patient</th><th>Tests</th><th>Laboratory</th><th>Requested</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono">${r.id}</td><td>${pat(r.pid).name}</td><td class="small">${r.tests.map(tn).join(', ')}</td><td class="small">${r.lab||'—'}</td><td class="small">${r.at?hDate(r.at):'—'}</td><td>${H_STATUS(r.status)}</td><td><button class="btn sm ghost" onclick="A.labView('${r.id}')">View</button></td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><h3>Test menu and prices</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Test</th><th>Sample</th><th>Price</th><th>Turnaround</th></tr></thead><tbody>${S.tests.slice(0,14).map(t=>`<tr><td>${t.name}</td><td class="small">${t.sample||'Blood'}</td><td>${ugx(t.price||0)}</td><td class="small">${t.tat||'Same day'}</td></tr>`).join('')}</tbody></table></div></div>`;
};
A.labView = id => { const o=(S.labOrders||[]).find(x=>x.id===id)||(S.labRequests||[]).find(x=>x.id===id)||{}; const ready=/Result|Done|Released|Complete/i.test(o.status||'');
  modal('Request '+id, `${patientBanner?patientBanner(o.pid):''}<p class="mt"><b>Status:</b> ${o.status||'—'}</p><p><b>Tests:</b> ${(o.tests||[]).join(', ')}</p>${o.sample?`<p><b>Sample:</b> ${o.sample.code} · collected by ${o.sample.by}</p>`:''}<p class="small muted">${ready?'Results were signed off by the laboratory scientist and sent to the patient and doctor.':'Results appear here as soon as the laboratory signs them off. The doctor and patient are notified by SMS.'}</p>`,
  ready?`<a class="btn" href="#/app/d/results" onclick="closeModal()">Open result</a>`:`<button class="btn ghost" onclick="closeModal();toast('Laboratory reminded about this request','green')">Remind laboratory</button>`); };

/* ---------- Pharmacy: medicines and prescriptions ---------- */
R['c/pharmacy'] = () => {
  const rx=S.prescriptions||[], low=S.meds.filter(m=>m.stock<=m.min), soon=S.meds.filter(m=>new Date(m.expiry)-Date.now()<1.6e10);
  return ph(bname(),'Pharmacy',`<a class="btn ghost" href="#/app/c/stock">${ic('boxes')} Stock and orders</a>`)+
  `<div class="grid g4 mb">${stat('Prescriptions',rx.length,'file-signature','blue')}${stat('Waiting to dispense',rx.filter(r=>!r.dispensed).length,'hourglass','amber')}${stat('Low stock',low.length,'package-x','red')}${stat('Expiring in 6 months',soon.length,'calendar-x','purple')}</div>
  <div class="card mb"><h3>Prescriptions</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Prescription</th><th>Patient</th><th>Doctor</th><th>Medicines</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>${rx.map(r=>`<tr><td class="mono">${r.id}</td><td>${pat(r.pid).name}</td><td class="small">${doc(r.did).name}</td><td class="small">${(r.items||[]).map(i=>i.drug+' × '+i.qty).join('<br>')}</td><td class="small">${hDate(r.at)}</td><td>${r.dispensed?'<span class="badge green">Dispensed</span>':'<span class="badge amber">Waiting</span>'}</td><td>${r.dispensed?'':`<button class="btn sm" onclick="A.dispense('${r.id}')">Dispense</button>`}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><h3>Medicine stock</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Medicine</th><th>Type</th><th>Batch</th><th>Expiry</th><th>In stock</th><th>Price</th></tr></thead><tbody>${S.meds.map(m=>`<tr><td>${m.name}${m.rx?' <span class="badge">Rx</span>':''}</td><td class="small">${m.cat||'—'}</td><td class="mono small">${m.batch||'—'}</td><td class="small">${m.expiry||'—'}</td><td>${m.stock<=m.min?`<span class="badge red">${m.stock} · low</span>`:m.stock}</td><td>${ugx(m.price)}</td></tr>`).join('')}</tbody></table></div></div>`;
};
A.dispense = id => { const r=S.prescriptions.find(x=>x.id===id); if(!r) return; const p=pat(r.pid);
  const al=(p.allergies||[]).filter(a=>(r.items||[]).some(i=>i.drug.toLowerCase().includes(a.toLowerCase().slice(0,5))));
  if(al.length){ toast('Stop: '+p.name+' is allergic to '+al.join(', ')+'. Call the doctor.','red'); return; }
  r.dispensed=true; r.dispensedAt=new Date().toISOString(); save(); audit('Prescription dispensed',id); toast('Dispensed. Patient gets an SMS with dosing instructions.','green'); render(); };

/* ---------- Emergency department ---------- */
R['c/emergency'] = () => {
  const ed=[...S.ed].filter(e=>e.status!=='Discharged'&&e.status!=='Admitted').sort((a,b)=>ED_ORDER[a.tri]-ED_ORDER[b.tri]||a.at.localeCompare(b.at));
  const mins=iso=>Math.round((Date.now()-new Date(iso))/60000);
  const inbound=(S.ambRequests||[]).filter(r=>!/Arrived|Closed|Cancelled|Completed/i.test(r.status||''));
  return ph(bname(),'Emergency department',`<button class="btn red" onclick="A.edArrive()">${ic('plus')} New emergency arrival</button>`)+
  `<div class="grid g4 mb">${stat('Patients in emergency',ed.length,'siren','red')}${stat('Critical (red)',ed.filter(e=>e.tri==='Red').length,'heart-pulse','red')}${stat('Waiting for a doctor',ed.filter(e=>e.status==='Waiting').length,'hourglass','amber')}${stat('Ambulances coming in',inbound.length,'ambulance','blue')}</div>
  <div class="card mb"><div class="row between wrap"><h3 style="margin:0">Triage board</h3><div class="row wrap small">${Object.entries(ED_TRI).map(([k,[c,t]])=>`<span class="badge ${c}">${k} · ${t}</span>`).join('')}</div></div>
  <div class="tbl-wrap mt"><table class="tbl"><thead><tr><th>Triage</th><th>Patient</th><th>Problem</th><th>Arrived</th><th>Doctor</th><th>Status</th><th></th></tr></thead><tbody>${ed.map(e=>`<tr><td><span class="badge ${ED_TRI[e.tri][0]}">${e.tri}</span></td><td>${e.name}<div class="small muted">${e.id} · ${e.by}</div></td><td class="small">${e.complaint}</td><td class="small">${mins(e.at)} min ago</td><td class="small">${e.did?doc(e.did).name:`<button class="btn sm ghost" onclick="A.edAssign('${e.id}')">Assign</button>`}</td><td>${e.status==='Waiting'&&mins(e.at)>({Red:0,Orange:10,Yellow:60,Green:240})[e.tri]?'<span class="badge red">Overdue</span>':`<span class="badge">${e.status}</span>`}</td><td class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" onclick="A.edAdmit('${e.id}')">Admit</button><button class="btn sm ghost" onclick="A.edOut('${e.id}')">Discharge</button></td></tr>`).join('')||'<tr><td colspan="7" class="muted">No patients in the emergency department.</td></tr>'}</tbody></table></div>
  <p class="small muted mt">Triage colours follow the South African Triage Scale used in Ugandan emergency units.</p></div>
  <div class="card"><div class="row between"><h3 style="margin:0">Ambulances coming in</h3><a class="btn sm ghost" href="#/app/c/ambulance">Dispatch board</a></div>${inbound.length?inbound.map(r=>`<div class="row between wrap" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${ic('ambulance')} <b>${r.amb||'Not assigned'}</b> · ${r.reason} · ${r.addr}</span><span class="badge blue">${r.status}</span></div>`).join(''):'<p class="muted mt">No ambulance on its way in.</p>'}</div>`;
};
A.edArrive = () => modal('New emergency arrival', `<div class="field"><label for="ed-n">Name (or description if unknown)</label><input class="inp" id="ed-n" placeholder="e.g. Unknown female, about 40"></div><div class="field"><label for="ed-c">Main problem</label><input class="inp" id="ed-c" placeholder="e.g. Chest pain for 1 hour"></div><div class="field"><label for="ed-t">Triage colour</label><select class="inp" id="ed-t">${Object.entries(ED_TRI).map(([k,[,t]])=>`<option value="${k}">${k} — seen ${t.toLowerCase()}</option>`).join('')}</select></div><div class="field"><label for="ed-b">Arrived by</label><select class="inp" id="ed-b"><option>Walk-in</option><option>Hospital ambulance</option><option>Private car / boda</option><option>Police</option></select></div>`,
  `<button class="btn red" onclick="A.edSave()">Add to triage board</button>`);
A.edSave = () => { const n=document.getElementById('ed-n').value.trim(), c=document.getElementById('ed-c').value.trim(); if(!n||!c){ toast('Enter a name or description and the main problem','red'); return; }
  const id='ED-'+(4411+S.ed.length); S.ed.unshift({id,name:n,pid:null,complaint:c,tri:document.getElementById('ed-t').value,at:new Date().toISOString(),by:document.getElementById('ed-b').value,did:null,status:'Waiting'});
  save(); closeModal(); audit('Emergency arrival',id); toast(id+' added to the triage board','green'); render(); };
A.edAssign = id => { const e=S.ed.find(x=>x.id===id); const d=S.doctors.find(x=>x.status==='Available')||S.doctors[0]; e.did=d.id; e.status='Being seen'; save(); toast(d.name+' paged for '+e.name,'green'); render(); };
A.edAdmit = id => { const e=S.ed.find(x=>x.id===id); e.status='Admitted'; save(); audit('Emergency patient sent for admission',id); toast(e.name+' sent for admission. Choose a bed on the ward board.','green'); go('#/app/c/wards'); };
A.edOut = id => { const e=S.ed.find(x=>x.id===id); e.status='Discharged'; save(); audit('Emergency patient discharged',id); toast(e.name+' discharged from emergency','green'); render(); };

/* ---------- welcome banner + quick actions on every staff dashboard ---------- */
const QUICK = {
  c:[['register','Register patient','user-plus'],['schedule','Book appointment','calendar-plus'],['lab','Lab requests','flask-conical'],['billing','Take payment','wallet'],['emergency','Emergency','siren']],
  d:null, n:null, l:null, ph:null, hc:null, am:null, a:null, sa:null };
function addWelcome(){
  const p=route(); if(p[0]!=='app') return; const role=p[1]||S.role, page=p[2]||'home';
  if(role==='p' || page!=='home') return;
  const host=document.querySelector('.main .page-h'); if(!host || document.querySelector('.welcome')) return;
  const items = QUICK[role] || NAV[role].flatMap(g=>g[1]).filter(i=>i[0]!=='home' && i[0]!=='settings' && i[0]!=='help').slice(0,5);
  const m=me(); const first=(m.name||'').replace(/^(Dr\.|Sr\.|Nurse)\s*/,'').split(' ')[0];
  const h=new Date().getHours(), greet=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const today=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  host.insertAdjacentHTML('beforebegin', `<section class="welcome"><div class="w-text"><div class="w-date">${today}</div><h2>${greet}, ${first}</h2><p>${m.sub||m.roleName}</p></div>
    <nav class="w-quick" aria-label="Quick actions">${items.map(([k,l,i])=>`<a href="#/app/${role}/${k}"><span>${ic(i)}</span>${l}</a>`).join('')}</nav>
    <svg class="w-wave" viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 80 C120 40 220 110 340 70 S520 30 600 60 V120 H0Z" fill="currentColor" opacity=".18"/><path d="M0 100 C140 70 260 120 380 92 S540 70 600 86 V120 H0Z" fill="currentColor" opacity=".22"/></svg></section>`);
  const hh=host.querySelector('h2'); if(hh && /^Good (morning|afternoon|evening)/.test(hh.textContent.trim())){ hh.remove(); const cr=host.querySelector('.crumb'); if(cr) cr.remove(); }
  if(window.lucide) lucide.createIcons();
}
{ const _render=render; window.removeEventListener("hashchange", _render); window.render = render = function(){ _render.apply(this,arguments); try{ addWelcome(); }catch(e){ console.error(e); } }; window.addEventListener("hashchange", ()=>render()); }

</script>
<script>
/* MB Musawo — clean hospital-app layout: patient home and homepage hero */

if(window.Chart) Chart.defaults.font.family='"Plus Jakarta Sans",system-ui,sans-serif';

/* ---------- patient home: greeting, big "talk to a doctor" card, service grid, next visit ---------- */
R['p/home'] = () => { const p=pat(ME); const first=p.name.split(' ')[0];
  const act=S.ambRequests.find(r=>r.pid===ME && !['Completed','Cancelled'].includes(r.status));
  const next=S.appointments.filter(a=>a.pid===ME && new Date(a.at)>Date.now()-3600e3 && !['Cancelled','Done'].includes(a.status)).sort((a,b)=>new Date(a.at)-new Date(b.at))[0];
  const unread=S.threads.filter(x=>x.pid===ME && x.unreadP).length;
  const svc=[...TILES.filter(x=>x[0]!=='consult'),['book','Book a visit','calendar-plus'],['records','My records','folder-heart']];
  return `<div class="ph-hello"><div><div class="ph-greet">${greet()}</div><h2>${t('Hello')}, ${first}</h2><div class="ph-sub">${t('How can we help you today?')}</div></div>
    <a class="btn red ph-sos" href="#/app/p/ambulance">${ic('siren')} ${t('Emergency')}</a></div>
  ${act?`<a class="note red mb" style="color:inherit" href="#/app/p/ambulance">${ic('ambulance')}<div><b>Ambulance ${act.status==='Requested'?'requested':'is '+act.status.toLowerCase()}</b> — tap to track it live.</div></a>`:''}
  <a class="ph-book" href="#/app/p/consult"><span class="ph-book-ic">${ic('stethoscope')}</span><span class="ph-book-t"><b>${t('Talk to a doctor')}</b><small>UGX 35,000 · chat, call or video</small></span><span class="ph-book-go">${ic('arrow-right')}</span>
    <svg class="ph-wave" viewBox="0 0 400 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 52 C80 22 150 70 240 44 S360 20 400 36 V80 H0Z" fill="currentColor" opacity=".16"/><path d="M0 66 C90 46 170 82 260 62 S370 50 400 58 V80 H0Z" fill="currentColor" opacity=".2"/></svg></a>
  <div class="ph-h3">${t('Services')}</div>
  <div class="ph-grid">${svc.map(([k,l,i,c])=>`<a class="ph-svc ${k==='ambulance'?'is-red':''}" href="#/app/p/${k}"><span class="ph-ic">${ic(i)}</span><span class="ph-l">${t(l)}${k==='messages'&&unread?` <span class="pill">${unread}</span>`:''}</span></a>`).join('')}</div>
  <div class="row between ph-h3row"><div class="ph-h3">${t('Upcoming appointment')}</div><a class="small" href="#/app/p/appointments">${t('See all')}</a></div>
  <div class="grid g2">
    <div class="card ph-next">${next?`<div class="row"><span class="ph-date"><b>${new Date(next.at).getDate()}</b>${new Date(next.at).toLocaleDateString('en-GB',{month:'short'})}</span><div class="grow" style="min-width:0"><b>${doc(next.did).name}</b><div class="small muted">${fdt(next.at)} · ${next.type}</div></div>${next.type==='Video'?`<button class="btn sm" onclick="A.joinVideo('${next.id}')">${ic('video')} Join</button>`:`<span class="badge ${badgeFor(next.status)}">${next.status}</span>`}</div>`
      :`<div class="row"><span class="ph-date">${ic('calendar')}</span><div class="grow"><b>No bookings yet</b><div class="small muted">Book a visit or talk to a doctor now</div></div><a class="btn sm" href="#/app/p/book">Book</a></div>`}</div>
    <div class="card"><div class="row"><span class="ph-date">${ic('wallet')}</span><div class="grow"><b>Wallet: ${ugx(S.wallet)}</b><div class="small muted">MoMo, Airtel, card, bank or insurance</div></div><a class="btn sm ghost" href="#/app/p/payments">Top up</a></div></div>
  </div>`; };

/* ---------- homepage hero: drawn phone preview of the patient app (no photos) ---------- */
function phonePreview(){
  const svc=[['Doctor','stethoscope'],['Ambulance','ambulance'],['Lab tests','flask-conical'],['Medicine','pill'],['Photo','camera'],['Receipts','receipt']];
  return `<div class="pv" aria-hidden="true"><div class="pv-screen">
    <div class="pv-status"><span>9:41</span><span>●●● ▮</span></div>
    <div class="pv-hello"><small>Good morning</small><b>Hello, Sarah</b></div>
    <div class="pv-book">${ic('stethoscope')}<span><b>Talk to a doctor</b><small>UGX 35,000</small></span>${ic('arrow-right')}</div>
    <div class="pv-grid">${svc.map(([l,i])=>`<div><span>${ic(i)}</span>${l}</div>`).join('')}</div>
    <div class="pv-next"><span class="pv-d"><b>11</b>Nov</span><span><b>Dr. Sylvia Nankya</b><small>Video · 15:00</small></span><em>Confirmed</em></div>
    <div class="pv-nav">${['home','calendar','message-circle','user'].map(i=>ic(i)).join('')}</div>
  </div></div>
  <div class="pv-float f1">${ic('ambulance')}<span><b>Ambulance UAX 214K</b><small>6 min away</small></span></div>
  <div class="pv-float f2">${ic('receipt')}<span><b>Paid UGX 35,000</b><small>Airtel Money · receipt ready</small></span></div>`;
}
for(const [k,lg,sw] of [['Services','Obuweereza','Huduma'],['Upcoming appointment','Olunaku lw’okulaba omusawo','Miadi ijayo']]){ if(I18N.lg) I18N.lg[k]=lg; if(I18N.sw) I18N.sw[k]=sw; }

</script>
<script>render();</script>
</body>
</html>
