<script>
/* MB Musawo — laboratory: orders, samples, results, Westgard QC, release chain */
const QC_MEAN=3.2, QC_SD=0.12;
const DEPT_HEADS = {Haematology:'Dr. Hellen Mirembe', Immunology:'Dr. Hellen Mirembe', 'Clinical chemistry':'Dr. Hellen Mirembe', Parasitology:'Dr. Hellen Mirembe', Microbiology:'Dr. Hellen Mirembe', Cardiology:'Dr. Hellen Mirembe', Cytology:'Dr. Hellen Mirembe'};
const DEPUTY = 'Mr. Samuel Ochieng (Deputy head)';
function westgard(vals, mean=QC_MEAN, sd=QC_SD){
  const z=vals.map(v=>(v-mean)/sd); const out=vals.map(()=>[]);
  z.forEach((x,i)=>{
    if(Math.abs(x)>3) out[i].push('1-3s');
    else if(Math.abs(x)>2) out[i].push('1-2s (warning)');
    if(i>0 && ((x>2&&z[i-1]>2)||(x<-2&&z[i-1]<-2))) out[i].push('2-2s');
    if(i>0 && ((x>2&&z[i-1]<-2)||(x<-2&&z[i-1]>2))) out[i].push('R-4s');
    if(i>=3 && [0,1,2,3].every(k=>z[i-k]>1) || i>=3 && [0,1,2,3].every(k=>z[i-k]<-1)) out[i].push('4-1s');
    if(i>=9 && ([...Array(10)].every((_,k)=>z[i-k]>0) || [...Array(10)].every((_,k)=>z[i-k]<0))) out[i].push('10x');
  });
  return {z, out};
}
const qcReject = () => { const {out}=westgard(S.qc); const lastRej = out.map((r,i)=>r.some(x=>!x.includes('warning'))?i:-1).filter(i=>i>=0).pop(); return lastRej!=null && lastRej>=0 && !(S.qcFixed>=lastRej) ? lastRej : null; };
const labOrders = () => S.labOrders.filter(o=>o.lid==='l1');
const LSTEPS=['Paid','Sample received','In progress','Awaiting review','Released'];

R['l/home'] = () => { const os=labOrders(); const rej=qcReject();
  chart('tat',{type:'bar',data:{labels:['Haem','Chem','Immuno','Parasit','Micro'],datasets:[{label:'Avg turnaround (h)',data:[2.6,5.1,3.4,0.8,2.2],backgroundColor:['#1941BA','#316FF6','#1941BA','#316FF6','#0F9D6B'],borderRadius:8},{label:'Target (h)',data:[3,6,4,1,2],type:'line',borderColor:'#E5484D',borderDash:[5,5],pointRadius:0}]}});
  return ph('MB Musawo Central Lab — Ntinda', 'Laboratory dashboard', `<select class="inp" style="width:auto" onchange="S.labPersona=this.value;save();rerender()"><option value="scientist" ${S.labPersona!=='head'?'selected':''}>Act as: Scientist Allan Waiswa</option><option value="head" ${S.labPersona==='head'?'selected':''}>Act as: Dr. Hellen Mirembe (Head)</option></select>`) + `
  ${rej!=null?`<div class="note red mb">${ic('alert-octagon')}<div><b>QC rejection on glucose control L1 (run ${rej+1}).</b> Release of results from this analyser is blocked until a corrective action is recorded. <a href="#/app/l/qc">Open QC</a></div></div>`:''}
  <div class="grid g4 mb">${stat('Orders today',os.filter(o=>isToday(o.at)).length+3,'list-checks','blue')}${stat('Awaiting review',os.filter(o=>o.status==='Awaiting review').length,'hourglass','amber')}${stat('Released (7 d)',42,'file-check-2','green')}${stat('Rejected samples',2,'test-tube-diagonal','red','1.8% this month')}</div>
  <div class="grid g-21"><div class="card"><div class="card-h"><h3>Order queue</h3><a class="small" href="#/app/l/orders">Open queue</a></div>${os.filter(o=>o.status!=='Released').map(o=>labRow(o)).join('')}</div><div class="card"><h3>Turnaround by department</h3><div style="height:240px"><canvas id="tat"></canvas></div></div></div>`; };
function labRow(o){ const p=pat(o.pid); return `<div class="li"><span class="ic purple">${ic('test-tube')}</span><div class="grow"><div class="t">${o.id} · ${p.name} ${o.home?'<span class="badge teal">Home collection</span>':''}</div><div class="s">${o.tests.map(c=>test(c).name).join(', ')} · ${ago(o.at)}</div></div>${badgeFor(o.status)}<a class="btn sm" href="#/app/l/results/${o.id}">Open</a></div>`; }

R['l/orders'] = () => { const os=labOrders(); return ph('Laboratory','Order queue') + `<div class="note mb">${ic('lock')}<div>Orders arrive only after the patient chose this lab and payment was verified. Each carries only the tests the patient accepted.</div></div>
  <div class="kan">${LSTEPS.slice(0,4).map(st=>`<div class="kan-col"><h4>${st} <span class="badge">${os.filter(o=>o.status===st).length}</span></h4>${os.filter(o=>o.status===st).map(o=>`<div class="kan-card"><div class="row between"><b class="small">${o.id}</b>${o.tests.some(c=>['TROP','RFT'].includes(c))?'<span class="badge red">Urgent</span>':''}</div><div class="small">${pat(o.pid).name}</div><div class="small muted">${o.tests.join(', ')}</div>${st==='Paid'?`<div class="row mt" style="gap:6px"><button class="btn sm" onclick="A.regSample('${o.id}')">Register sample</button><button class="btn sm ghost" onclick="A.rejSample('${o.id}')">Reject</button></div>`:`<a class="btn sm block mt" href="#/app/l/results/${o.id}">Open</a>`}</div>`).join('')||'<p class="small muted">Empty</p>'}</div>`).join('')}</div>`; };
A.regSample = oid => { const o=S.labOrders.find(x=>x.id===oid); modal('Register sample · '+oid, `<div class="row mb"><span class="ic purple">${ic('barcode')}</span><div><div class="small muted">Sample ID / barcode</div><b class="mono">MBM-${oid.slice(3)}-A</b></div></div><div class="field"><label>Collected by</label><input class="inp" id="sb" value="${o.home?'Nurse Florence Akello (home)':'Phlebotomist Joan Nakimuli'}"></div><div class="field"><label>Condition</label><select class="inp" id="sc"><option>Acceptable</option><option>Haemolysed</option><option>Clotted</option><option>Insufficient volume</option></select></div><label class="check"><input type="checkbox" checked> Patient identity verified (name + date of birth)</label>`, `<button class="btn" onclick="const c=$('#sc').value;if(c!=='Acceptable'){closeModal();return A.rejSample('${oid}',c)}const o=S.labOrders.find(x=>x.id==='${oid}');o.sample={code:'MBM-${oid.slice(3)}-A',by:$('#sb').value,at:new Date().toISOString(),cond:c};o.status='Sample received';audit('Sample registered','${oid}');notify(o.pid,'Your sample was received by the lab.','#/app/p/labrequests','lab');save();closeModal();rerender()">Register</button>`); };
A.rejSample = (oid, reason) => modal('Reject sample', `<div class="field"><label>Reason</label><select class="inp" id="rr"><option ${reason==='Haemolysed'?'selected':''}>Haemolysed</option><option ${reason==='Clotted'?'selected':''}>Clotted</option><option ${reason==='Insufficient volume'?'selected':''}>Insufficient volume</option><option>Wrong tube</option><option>Unlabelled</option></select></div><p class="small t2">The patient will be asked to recollect at no extra cost.</p>`, `<button class="btn red" onclick="const o=S.labOrders.find(x=>x.id==='${oid}');o.status='Paid';o.sample=null;audit('Sample rejected: '+$('#rr').value,'${oid}');notify(o.pid,'Your sample needs to be collected again ('+$('#rr').value+'). No extra cost.','#/app/p/labrequests','lab');save();closeModal();toast('Rejected. Patient asked to recollect.','green');rerender()">Reject sample</button>`);

R['l/results'] = (oid) => {
  if(!oid){ const os=labOrders(); return ph('Laboratory','Results & release') + `<div class="card">${os.map(labRow).join('')}</div>`; }
  const o=S.labOrders.find(x=>x.id===oid); const p=pat(o.pid); const me_=me().name; const rej=qcReject();
  audit('Lab viewed patient info for order', oid);
  const items=resultItems(o); const locked=o.status==='Released';
  const dept=test(o.tests[0]).dept; const head=DEPT_HEADS[dept]||'Head'; const reviewerNeeded = o.enteredBy && o.enteredBy.includes('Mirembe') ? DEPUTY : head;
  const isHead = S.labPersona==='head';
  const qa=o.qa||{}; const qaOK=['qc','sample','reagents','plausible','critical'].every(k=>qa[k]);
  const canSign = o.status==='Awaiting review' && isHead && qaOK && rej==null && !(o.enteredBy||'').includes('Mirembe');
  const canRelease = o.status==='Awaiting review' && o.review && qaOK && rej==null;
  const crit = items.some(r=>flagOf(o.values[r.key], r.it)==='C');
  return ph(`<a href="#/app/l/results">Results</a> / ${o.id}`, `${o.id} · ${p.name}`, badgeFor(o.status)) + `
  <div class="card mb"><div class="steps">${LSTEPS.map((s,i)=>{const ix=LSTEPS.indexOf(o.status);return `<div class="step ${i<ix?'done':i===ix?'now':''}"><div class="dotx">${i<ix?ic('check'):i+1}</div>${s}</div>`}).join('')}</div></div>
  <div class="grid g-21"><div class="col">
    <div class="card"><div class="card-h"><h3>Results entry</h3><div class="row" style="gap:6px">${['Manual','From analyser','Upload file','Scan'].map((m,i)=>`<button class="chip ${i===0?'on':''}" onclick="${i?`toast('${m}: values imported','blue');A.autoFill('${oid}')`:''}">${m}</button>`).join('')}</div></div>
      ${locked?`<div class="note green mb">${ic('lock')}<div>Released ${fdt(o.released)}. Released results can never be edited. Use “Issue corrected report”.</div></div>`:''}
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Test</th><th>Value</th><th>Unit</th><th>Normal range</th><th>Flag</th></tr></thead><tbody>${items.map(r=>{ const v=o.values[r.key]??''; const f=r.it.qual?'':flagOf(v,r.it); return `<tr><td>${r.name}</td><td>${r.it.qual?`<select class="inp" style="min-width:150px" ${locked?'disabled':''} onchange="A.setVal('${oid}','${r.key}',this.value)"><option value="">—</option>${[r.it.normal,'Positive','Reactive','Abnormal'].filter((x,i,a)=>a.indexOf(x)===i).map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`:`<input class="inp" style="width:110px" value="${esc(v)}" ${locked?'disabled':''} oninput="A.setVal('${oid}','${r.key}',this.value,true)" inputmode="decimal">`}</td><td class="muted">${r.unit}</td><td class="muted">${r.it.qual?r.it.normal:rangeTxt(r.it)}</td><td id="f-${r.key.replace(/[^a-z0-9]/gi,'')}">${f==='C'?'<span class="flag-C">CRITICAL</span>':f?`<span class="flag-${f}">${f}</span>`:''}</td></tr>`; }).join('')}</tbody></table></div>
      <div class="field mt"><label>Scientist note (method / sample quality)</label><input class="inp" ${locked?'disabled':''} placeholder="e.g. Analysed on Cobas c111"></div>
      ${!locked&&['Sample received','In progress'].includes(o.status)?`<button class="btn" onclick="A.submitResults('${oid}')">${ic('check')} Approve my entry & submit for review</button>`:''}
      ${locked?`<button class="btn ghost" onclick="A.correctReport('${oid}')">${ic('file-warning')} Issue corrected report</button>`:''}
    </div>
    ${crit?`<div class="note red">${ic('siren')}<div><b>Critical value.</b> On release, the patient is alerted at once by push, SMS and a call, with instructions to see a doctor now.</div></div>`:''}
  </div>
  <div class="col">
    <div class="card"><h3>Patient (order scope only)</h3><dl class="kv small"><dt>Name</dt><dd>${p.name}</dd><dt>Age / sex</dt><dd>${age(p.dob)} · ${p.sex}</dd><dt>Allergies</dt><dd>${p.allergies.join(', ')}</dd><dt>Medicines</dt><dd>${p.meds.join(', ')||'—'}</dd><dt>Reason</dt><dd>${esc((S.labRequests.find(r=>r.id===o.rid)||{}).reason||'Patient order')}</dd><dt>Sample</dt><dd class="mono">${o.sample?.code||'—'} · ${o.sample?.cond||''}</dd></dl><p class="small muted mt mb0">${ic('clock')} Access ends 30 days after the order closes.</p></div>
    <div class="card"><h3>QA checklist (before release)</h3>${[['qc','QC run for this test & analyser in control'],['sample','Sample acceptable & identity verified'],['reagents','Reagents & calibration in date'],['plausible','Result plausible vs earlier results'],['critical','Any critical value handled']].map(([k,l])=>`<label class="check"><input type="checkbox" ${qa[k]?'checked':''} ${locked?'disabled':''} onchange="A.qa('${oid}','${k}',this.checked)"> ${l}</label>`).join('')}
      ${rej!=null?`<div class="note red small mt">${ic('ban')}<div>QC is <b>out of control</b>. Release blocked.</div></div>`:`<div class="note green small mt">${ic('check')}<div>QC in control.</div></div>`}</div>
    <div class="card"><h3>Sign-off & release</h3>
      <div class="li"><span class="ic ${o.enteredBy?'green':''}">${ic('user-check')}</span><div class="grow"><div class="t small">Entered & self-approved</div><div class="s">${o.enteredBy||'Pending'}</div></div></div>
      <div class="li"><span class="ic ${o.review?'green':''}">${ic('stamp')}</span><div class="grow"><div class="t small">Department review</div><div class="s">${o.review?o.review.by+' · '+fdt(o.review.at):'Needs: '+reviewerNeeded}</div></div>${o.status==='Awaiting review'&&!o.review?`<button class="btn sm purple" ${canSign?'':'disabled'} onclick="A.signOff('${oid}')" title="${!isHead?'Switch to Head persona':''}">Sign off</button>`:''}</div>
      <div class="li"><span class="ic ${o.released?'green':''}">${ic('send')}</span><div class="grow"><div class="t small">Release to patient</div><div class="s">${o.released?fdt(o.released):'Disabled until QC/QA and sign-off recorded'}</div></div></div>
      ${!isHead&&o.status==='Awaiting review'&&!o.review?`<p class="small muted">Switch persona to the Head (top of dashboard) to sign off. ${reviewerNeeded===DEPUTY?'The head entered this result, so the deputy must review.':''}</p>`:''}
      <button class="btn green block mt" ${canRelease&&!locked?'':'disabled'} onclick="A.release('${oid}')">${ic('send')} Release to patient</button></div>
  </div></div>`;
};
A.setVal = (oid,k,v,live) => { const o=S.labOrders.find(x=>x.id===oid); o.values[k]=v; if(o.status==='Sample received') o.status='In progress'; save();
  if(live){ const r=resultItems(o).find(x=>x.key===k); const f=flagOf(v,r.it); const el=document.getElementById('f-'+k.replace(/[^a-z0-9]/gi,'')); if(el) el.innerHTML=f==='C'?'<span class="flag-C">CRITICAL</span>':f?`<span class="flag-${f}">${f}</span>`:''; } };
A.autoFill = oid => { const o=S.labOrders.find(x=>x.id===oid); const demo={'FBG':'7.4','HBA1C':'7.6','RFT:Creatinine':'98','RFT:Urea':'6.2','RFT:Potassium':'4.4','FBC:Haemoglobin':'10.9','FBC:WBC':'7.2','FBC:Platelets':'265','MRDT':'Positive','BS':'Positive','UA':'Normal','HCG':'Negative','TROP':'0.01'}; resultItems(o).forEach(r=>{ if(demo[r.key]) o.values[r.key]=demo[r.key]; }); o.status='In progress'; save(); rerender(); };
A.qa = (oid,k,v) => { const o=S.labOrders.find(x=>x.id===oid); o.qa=o.qa||{}; o.qa[k]=v; save(); rerender(); };
A.submitResults = oid => { const o=S.labOrders.find(x=>x.id===oid); if(resultItems(o).some(r=>!o.values[r.key])) return toast('Enter every value first','red'); o.enteredBy=me().name; o.status='Awaiting review'; audit('Results entered & self-approved', oid); save(); toast('Submitted for department review','green'); rerender(); };
A.signOff = oid => { const o=S.labOrders.find(x=>x.id===oid); o.review={by:'Dr. Hellen Mirembe (Head, '+test(o.tests[0]).dept+')', at:new Date().toISOString()}; audit('Result signed off by head', oid); save(); toast('Signed off. Release is now enabled.','green'); rerender(); };
A.release = oid => { const o=S.labOrders.find(x=>x.id===oid); modal('Confirm release', `<p>Release <b>${oid}</b> to ${pat(o.pid).name}? Released results can never be edited.</p>`, `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn green" onclick="const o=S.labOrders.find(x=>x.id==='${oid}');o.status='Released';o.released=new Date().toISOString();const r=S.labRequests.find(x=>x.id===o.rid);if(r)r.status='Released';audit('Result released','${oid}');notify(o.pid,'Your results are ready. Open MB Musawo to view.','#/app/p/labrequests','result');save();closeModal();toast('Released. Patient notified (no health details in the message).','green');rerender()">Release</button>`); };
A.correctReport = oid => modal('Corrected report', `<p class="small t2">The original stays visible to the patient. Give the reason.</p><div class="field"><label>Reason</label><textarea class="inp" id="crr"></textarea></div>`, `<button class="btn" onclick="const o=S.labOrders.find(x=>x.id==='${oid}');o.corrected=$('#crr').value;audit('Corrected report issued','${oid}');notify(o.pid,'A corrected report is available.','#/app/p/labrequests','result');save();closeModal();toast('Corrected report issued','green')">Issue</button>`);

/* QC with Levey-Jennings & Westgard */
R['l/qc'] = () => { const {z,out}=westgard(S.qc); const rej=qcReject();
  const lines=[3,2,1,0,-1,-2,-3].map(k=>({label:k===0?'Mean':(k>0?'+':'')+k+' SD',data:S.qc.map(()=>QC_MEAN+k*QC_SD),borderColor:k===0?'#316FF6':Math.abs(k)===3?'#E5484D':Math.abs(k)===2?'#E9A23B':'#94a3b8',borderDash:k===0?[]:[6,5],borderWidth:k===0?2:1,pointRadius:0,fill:false}));
  chart('lj',{type:'line',data:{labels:S.qc.map((_,i)=>'Run '+(i+1)),datasets:[{label:'Control value',data:S.qc,borderColor:'#1941BA',backgroundColor:out.map(r=>r.some(x=>!x.includes('warning'))?'#E5484D':r.length?'#E9A23B':'#1941BA'),pointRadius:out.map(r=>r.length?7:4),tension:0},...lines]},options:{plugins:{legend:{display:false}},scales:{y:{min:QC_MEAN-3.6*QC_SD,max:QC_MEAN+3.6*QC_SD}}}});
  return ph('Laboratory','Quality control',`<button class="btn" onclick="A.addQC()">${ic('plus')} Add control run</button>`) + `
  <div class="grid g4 mb">${stat('Analyser','Cobas c111','cpu','blue','Glucose · Control L1')}${stat('Mean / SD',`${QC_MEAN} / ${QC_SD}`,'sigma','teal','mmol/L')}${stat('Status',rej!=null?'Out of control':'In control',rej!=null?'alert-octagon':'check-circle-2',rej!=null?'red':'green')}${stat('Violations',out.flat().filter(x=>!x.includes('warning')).length,'alert-triangle','amber')}</div>
  <div class="card mb"><h3>Levey-Jennings chart</h3><div style="height:320px"><canvas id="lj"></canvas></div><div class="row wrap mt small">${[['#1941BA','In control'],['#E9A23B','Warning (1-2s)'],['#E5484D','Rejection rule']].map(([c,l])=>`<span class="row" style="gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:${c}"></span>${l}</span>`).join('')}</div></div>
  <div class="grid g2"><div class="card"><h3>Westgard rules engine</h3><div class="tbl-wrap"><table class="tbl" style="min-width:0"><thead><tr><th>Run</th><th>Value</th><th>z</th><th>Rules</th></tr></thead><tbody>${out.map((r,i)=>r.length?`<tr><td>${i+1}</td><td>${S.qc[i]}</td><td>${z[i].toFixed(2)}</td><td>${r.map(x=>`<span class="badge ${x.includes('warning')?'amber':'red'}">${x}</span>`).join(' ')}</td></tr>`:'').join('')}</tbody></table></div>
    <p class="small muted mt">Rules: 1-3s, 2-2s, R-4s, 4-1s, 10x reject the run; 1-2s is a warning.</p></div>
  <div class="card"><h3>Corrective action</h3>${rej!=null?`<div class="note red mb">${ic('ban')}<div>Run ${rej+1} failed. Results from this run cannot be released.</div></div><div class="field"><label>Action taken</label><select class="inp" id="ca"><option>Recalibrated analyser</option><option>New reagent lot opened</option><option>New control vial</option><option>Maintenance performed</option></select></div><div class="field"><label>Notes</label><input class="inp" id="can" value="Re-ran control: 3.21 mmol/L"></div><button class="btn" onclick="S.qcFixed=${rej};S.qc.push(3.21);audit('QC corrective action: '+$('#ca').value,'Cobas c111');save();toast('Corrective action recorded. QC back in control.','green');rerender()">Record & re-run control</button>`:`<div class="note green">${ic('check')}<div>No open rejections. History kept per analyser and test.</div></div>`}</div></div>`; };
A.addQC = () => modal('Add control run', `<div class="field"><label>Control value (mmol/L)</label><input class="inp" id="qcv" type="number" step="0.01" value="3.18"></div>`, `<button class="btn" onclick="S.qc.push(parseFloat($('#qcv').value));save();closeModal();rerender()">Add</button>`);

R['l/refer'] = () => ph('Laboratory','Suggest a test or refer') + `<div class="grid g2"><div class="card"><h3>Suggest a further test</h3><div class="field"><label>Order</label><select class="inp" id="sfo">${labOrders().map(o=>`<option>${o.id} — ${pat(o.pid).name}</option>`).join('')}</select></div><div class="field"><label>Test</label><select class="inp">${S.tests.map(t=>`<option>${t.name} — ${ugx(t.price)}</option>`).join('')}</select></div><div class="field"><label>Reason</label><textarea class="inp" placeholder="e.g. Low Hb — suggest ferritin to check iron stores"></textarea></div><button class="btn" onclick="toast('Suggestion sent to the patient. Nothing is added or billed unless they accept.','green')">Send suggestion</button></div>
  <div class="card"><h3>Refer the patient</h3><div class="chips mb"><button class="chip on">Doctor</button><button class="chip">Another lab</button><button class="chip">Reference lab (sample)</button></div><div class="field"><label>Recommend</label><select class="inp">${S.doctors.map(d=>`<option>${d.name} — ${d.spec}</option>`).join('')}</select></div><div class="field"><label>Note</label><textarea class="inp"></textarea></div><button class="btn" onclick="toast('Recommendation sent. The patient decides — the lab cannot book or pay.','green')">Send recommendation</button></div></div>`;

R['l/catalogue'] = () => ph('Setup','Test catalogue',`<button class="btn" onclick="toast('New test form opened','blue')">${ic('plus')} Add test</button>`) + `<div class="note mb">${ic('lock')}<div>Price changes apply only to new orders. Orders already placed keep their price.</div></div><div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Code</th><th>Test</th><th>Department</th><th>Price</th><th>Turnaround</th><th>Range</th></tr></thead><tbody>${S.tests.map(t=>`<tr><td class="mono">${t.code}</td><td>${t.name}</td><td>${t.dept}</td><td><input class="inp" style="width:120px" value="${t.price}" onchange="S.tests.find(x=>x.code==='${t.code}').price=+this.value;save();toast('Price updated for new orders','green')"></td><td>${t.tat} h</td><td class="muted small">${t.type==='panel'?t.items.map(i=>i.k+' '+rangeTxt(i)).join('; '):t.type==='qual'?t.range:rangeTxt(t)+' '+t.unit}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card mt"><h3>Departments</h3><div class="grid g3">${['Haematology','Clinical chemistry','Immunology','Microbiology','Parasitology'].map(d=>`<div class="card flat"><b>${d}</b><div class="small muted">Head: Dr. Hellen Mirembe<br>Deputy: Mr. Samuel Ochieng</div></div>`).join('')}</div></div>`;
R['l/equipment'] = () => ph('Setup','Equipment & reagents') + `<div class="grid g2"><div class="card"><h3>Analysers</h3>${[['Cobas c111','Clinical chemistry','Calibrated 2 days ago','Maintenance in 12 days','green'],['Sysmex XN-350','Haematology','Calibrated today','Maintenance in 3 days','amber'],['Mindray BS-240','Clinical chemistry','Calibration overdue','Service booked','red']].map(([n,d,c,m,col])=>`<div class="li"><span class="ic ${col}">${ic('cpu')}</span><div class="grow"><div class="t">${n}</div><div class="s">${d} · ${c} · ${m}</div></div></div>`).join('')}</div>
  <div class="card"><h3>Reagents & consumables</h3><div class="tbl-wrap"><table class="tbl" style="min-width:0"><thead><tr><th>Item</th><th>Lot</th><th>Expiry</th><th>Stock</th></tr></thead><tbody>${[['Glucose reagent','GL2410','Mar 2027','14 kits',''],['HbA1c reagent','HB2408','Jan 2027','3 kits','amber'],['Malaria RDT','MR2511','Jun 2027','90 tests','red'],['EDTA tubes','ED2509','Aug 2028','1,200','']].map(([a,b,c,d,col])=>`<tr><td>${a}</td><td class="mono">${b}</td><td>${c}</td><td>${col?`<span class="badge ${col}">${d}</span>`:d}</td></tr>`).join('')}</tbody></table></div><button class="btn sm mt" onclick="toast('Reorder sent to verified supplier','green')">Reorder low items</button></div></div>`;
R['l/money'] = () => { chart('lmon',{type:'line',data:{labels:['W1','W2','W3','W4'],datasets:[{label:'Income (UGX)',data:[4.2e6,5.1e6,4.8e6,6.0e6],borderColor:'#1941BA',backgroundColor:'rgba(25,65,186,.15)',fill:true,tension:.4}]}});
  return ph('Setup','Income & reports',`<button class="btn ghost" onclick="A.download('lab-report-de-identified.csv','week,tests,income,tat_hours,rejected\\nW1,212,4200000,3.1,4\\nW2,240,5100000,2.9,3\\nW3,231,4800000,3.0,2\\nW4,266,6000000,2.7,2','text/csv')">${ic('download')} Export (de-identified)</button>`) + `<div class="grid g4 mb">${stat('This month',ugx(20100000),'banknote','green')}${stat('Tests done','949','flask-conical','purple')}${stat('Avg turnaround','2.9 h','timer','blue')}${stat('Pending payout',ugx(3400000),'hourglass','amber')}</div><div class="card"><div style="height:260px"><canvas id="lmon"></canvas></div></div>`; };

</script>
<script>
/* MB Musawo — pharmacy */
const expired = m => new Date(m.expiry) < Date.now();
const nearExp = m => !expired(m) && (new Date(m.expiry)-Date.now()) < 60*864e5;
const low = m => m.stock < m.min;
const DO_FLOW = ['Received','Ready','Out for delivery','Delivered'];

R['ph/home'] = () => { const lows=S.meds.filter(low), exps=S.meds.filter(expired), nears=S.meds.filter(nearExp);
  chart('phsales',{type:'bar',data:{labels:['Antimalarial','Pain relief','Antibiotic','Diabetes','BP','Family planning','Maternal'],datasets:[{label:'Units sold (7 days)',data:[86,214,58,40,33,121,77],backgroundColor:['#1941BA','#316FF6','#1941BA','#316FF6','#E5484D','#0F9D6B','#E9A23B'],borderRadius:8}]},options:{indexAxis:'y',plugins:{legend:{display:false}}}});
  return ph('Musawo Pharmacy Ntinda · NDA verified','Pharmacy dashboard') + `
  ${lows.length?`<div class="note red mb">${ic('alert-triangle')}<div><b>Running out:</b> ${lows.map(m=>m.name.split(' ')[0]+' ('+m.stock+')').join(', ')}. <a href="#/app/ph/wholesale">Reorder</a></div></div>`:''}
  <div class="grid g4 mb">${stat('Products',S.meds.length,'boxes','blue')}${stat('Low stock',lows.length,'trending-down','red')}${stat('Orders today',S.drugOrders.filter(o=>isToday(o.at)).length,'shopping-bag','teal')}${stat('Revenue today',ugx(486500),'banknote','green')}</div>
  <div class="grid g4 mb">${[['scan-line','Scan drug','#/app/ph/scan','purple'],['truck','Wholesale order','#/app/ph/wholesale','blue'],['file-signature','Prescriptions','#/app/ph/rx','green'],['search','Drug search','#/app/ph/assistant','warm']].map(([i,l,h,c])=>`<a class="card" style="color:var(--text)" href="${h}"><div class="row"><span class="ic ${c}">${ic(i)}</span><b>${l}</b></div></a>`).join('')}</div>
  <div class="grid g2"><div class="card"><h3>Sales by category</h3><div style="height:260px"><canvas id="phsales"></canvas></div></div><div class="card"><h3>Expiry watch</h3>${[...exps,...nears].map(m=>`<div class="li"><span class="ic ${expired(m)?'red':'amber'}">${ic('calendar-x')}</span><div class="grow"><div class="t small">${m.name}</div><div class="s">Batch ${m.batch} · ${fdate(m.expiry)}</div></div>${expired(m)?'<span class="badge red">Expired — sale blocked</span>':'<span class="badge amber">Expires soon</span>'}</div>`).join('')}</div></div>`; };

R['ph/inventory'] = () => ph('Pharmacy','Inventory',`<button class="btn" onclick="go('#/app/ph/scan')">${ic('scan-line')} Add by scan</button>`) + `<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Product</th><th>Batch</th><th>Expiry</th><th>Price</th><th>Rx</th><th>Stock</th><th></th></tr></thead><tbody>${S.meds.map(m=>{ const pct=Math.min(100,m.stock/(m.min*3)*100); const col=m.stock<m.min*0.5?'var(--red)':m.stock<m.min?'var(--amber)':'var(--teal)'; return `<tr><td><b>${m.name}</b><div class="small muted">${m.cat} · supplier: Nile Pharma</div></td><td class="mono">${m.batch}</td><td>${expired(m)?`<span class="badge red">Expired</span>`:nearExp(m)?`<span class="badge amber">${fdate(m.expiry)}</span>`:fdate(m.expiry)}</td><td>${ugx(m.price)}</td><td>${m.rx?'<span class="badge red">Rx</span>':'<span class="badge green">OTC</span>'}</td><td style="min-width:140px"><div class="row between small"><b>${m.stock}</b><span class="muted">min ${m.min}</span></div><div class="bar"><i style="width:${pct}%;background:${col}"></i></div></td><td><button class="btn sm ghost" onclick="A.adjust('${m.id}')">Adjust</button></td></tr>`; }).join('')}</tbody></table></div></div>`;
A.adjust = id => { const m=med(id); modal('Adjust stock · '+m.name, `<div class="field"><label>New quantity</label><input class="inp" type="number" id="aq" value="${m.stock}"></div><div class="field"><label>Reason</label><select class="inp"><option>Stock count</option><option>Received delivery</option><option>Damaged</option><option>Expired — disposed</option></select></div>`, `<button class="btn" onclick="med('${id}').stock=+$('#aq').value;audit('Stock adjusted','${id}');save();closeModal();rerender()">Save</button>`); };

R['ph/orders'] = () => ph('Pharmacy','Patient orders') + `<div class="kan">${DO_FLOW.map(st=>`<div class="kan-col"><h4>${st} <span class="badge">${S.drugOrders.filter(o=>o.status===st).length}</span></h4>${S.drugOrders.filter(o=>o.status===st).map(o=>{ const rxNeeded=o.items.some(([id])=>med(id).rx); const nx=DO_FLOW[DO_FLOW.indexOf(st)+1]; return `<div class="kan-card"><div class="row between"><b class="small">${o.id}</b><span class="small muted">${ago(o.at)}</span></div><div class="small">${pat(o.pid).name}</div><div class="small muted">${o.items.map(([id,n])=>med(id).name.split(' ')[0]+' ×'+n).join(', ')}</div><div class="row wrap mt" style="gap:4px"><span class="badge">${o.delivery}</span><span class="badge">${o.pay}</span>${rxNeeded?`<span class="badge ${o.rxId?'green':'red'}">${o.rxId?'Rx '+o.rxId:'Needs Rx'}</span>`:''}</div>${nx?`<button class="btn sm block mt" ${rxNeeded&&!o.rxId?'disabled':''} onclick="A.doNext('${o.id}','${nx}')">${nx==='Ready'?'Mark ready':nx==='Out for delivery'?(o.delivery.includes('Collect')?'Collected':'Send with rider'):'Delivered'}</button>`:''}</div>`; }).join('')||'<p class="small muted">Empty</p>'}</div>`).join('')}</div>`;
A.doNext = (id,st) => { const o=S.drugOrders.find(x=>x.id===id); if(o.delivery.includes('Collect')&&st==='Out for delivery') st='Delivered'; o.status=st; if(st==='Ready'&&o.rxId){ const r=S.prescriptions.find(x=>x.id===o.rxId); if(r){ r.filled=true; r.status='Filled'; } o.items.forEach(([mid,n])=>med(mid).stock-=n); } audit('Order '+st, id); notify(o.pid,`Your medicine order ${id}: ${st}.`,'#/app/p/medicine','rx'); save(); toast(`${id}: ${st}. Patient notified.`,'green'); rerender(); };

R['ph/rx'] = () => ph('Pharmacy','Prescriptions',`<button class="btn ghost" onclick="toast('Upload review: pharmacist checks photo, doctor stamp and date before the order proceeds','blue')">${ic('upload')} Review uploaded Rx</button>`) + `<div class="card">${S.prescriptions.map(r=>`<div class="li"><span class="ic green">${ic('file-signature')}</span><div class="grow"><div class="t">${r.id} · ${pat(r.pid).name}</div><div class="s">${doc(r.did).name} (${doc(r.did).lic}) · ${fdt(r.at)}</div><div class="s">${r.items.map(i=>`${i.drug} — ${i.dose}, ${i.freq}, ${i.dur} (qty ${i.qty})`).join('<br>')}</div></div>${r.filled?'<span class="badge green">Filled — cannot be reused</span>':`<button class="btn sm green" onclick="A.fillRx('${r.id}')">Fill</button>`}</div>`).join('')}</div><p class="small muted mt">A prescription is marked used when filled, so it can’t be filled twice.</p>`;
A.fillRx = id => { const r=S.prescriptions.find(x=>x.id===id); if(r.filled) return toast('Already filled — blocked','red'); r.filled=true; r.status='Filled'; audit('Prescription filled', id); save(); toast(id+' filled and locked.','green'); rerender(); };

R['ph/scan'] = () => ph('Pharmacy','Scan drug packaging') + `<div class="grid g2"><div class="card"><div class="video" id="scanv" style="aspect-ratio:4/3"><div style="text-align:center">${ic('scan-line')}<div class="mt">Point the camera at the barcode</div></div></div><div class="row mt"><button class="btn" onclick="A.scan()">${ic('camera')} Start scan</button><button class="btn ghost" onclick="A.scanStop()">Stop</button></div></div>
  <div class="card" id="scanres"><h3>Result</h3><p class="muted small">Scan a box to fill in the product. Looked up first in the National Drug Authority register of authorised products, then a local catalogue.</p></div></div>`;
A.scan = async () => { try{ const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); window.__stream=s; $('#scanv').innerHTML='<video autoplay muted playsinline></video>'; $('#scanv video').srcObject=s; }catch(e){ toast('No camera — using sample scan','blue'); }
  setTimeout(()=>{ A.scanStop(); $('#scanres').innerHTML=`<h3>${ic('check-circle-2')} Found</h3><dl class="kv"><dt>Product</dt><dd>Artemether/Lumefantrine 20/120 mg</dd><dt>Brand</dt><dd>Coartem® Dispersible</dd><dt>NDA reg. no.</dt><dd class="mono">NDA/MAL/HDP/4412</dd><dt>Batch</dt><dd class="mono">AL2411</dd><dt>Expiry</dt><dd>30 Aug 2027</dd><dt>GTIN</dt><dd class="mono">07612345678904</dd></dl><div class="note green mt">${ic('badge-check')}<div>Authorised for sale in Uganda (NDA register).</div></div><div class="row mt"><input class="inp" type="number" value="60" style="width:100px"><button class="btn" onclick="med('m1').stock+=60;save();toast('Added 60 to stock','green')">Add to stock</button></div>`; lucide.createIcons(); }, 2200); };
A.scanStop = () => { if(window.__stream){ window.__stream.getTracks().forEach(t=>t.stop()); window.__stream=null; } };

R['ph/wholesale'] = () => { const verified = S.pharmacies[0].nda; const cart=S.tabs.ws||{};
  const cat=[['m1','Coartem 20/120 (carton ×30)',300000],['m3','Amoxicillin 500mg (×500)',95000],['m10','Salbutamol inhaler (×20)',240000],['m5','Amlodipine 5mg (×1000)',160000],['m9','COC pills (×100 cycles)',120000],['m6','ORS + Zinc (×100)',220000]];
  const total=Object.entries(cart).reduce((s,[k,n])=>s+cat.find(c=>c[0]===k)[2]*n,0);
  return ph('Pharmacy','Wholesale ordering') + `<div class="note ${verified?'green':'red'} mb">${ic(verified?'badge-check':'ban')}<div>${verified?'<b>NDA certified & platform verified.</b> Wholesale ordering unlocked. The server checks this flag on every order.':'Wholesale is open only to NDA-certified, verified pharmacies.'}</div></div>
  <div class="grid g2 mb">${S.wholesalers.map(w=>`<div class="card"><div class="row"><span class="ic blue">${ic('warehouse')}</span><div class="grow"><b>${w.name}</b><div class="small muted">Minimum order ${ugx(w.min)} · discounts ${w.disc}</div></div></div></div>`).join('')}</div>
  <div class="grid g-21"><div class="card"><h3>Bulk catalogue</h3>${cat.map(([k,n,p])=>`<div class="li"><span class="ic teal">${ic('package')}</span><div class="grow"><div class="t small">${n}</div><div class="s">${ugx(p)} · ${low(med(k))?'<span class="down">Low in your stock</span>':''}</div></div><div class="row"><button class="icon-btn" style="width:32px;height:32px" onclick="S.tabs.ws=S.tabs.ws||{};S.tabs.ws['${k}']=Math.max(0,(S.tabs.ws['${k}']||0)-1);save();rerender()">${ic('minus')}</button><b>${cart[k]||0}</b><button class="icon-btn" style="width:32px;height:32px" onclick="S.tabs.ws=S.tabs.ws||{};S.tabs.ws['${k}']=(S.tabs.ws['${k}']||0)+1;save();rerender()">${ic('plus')}</button></div></div>`).join('')}</div>
  <div class="card" style="align-self:start"><h3>Cart</h3><div class="row between"><span>Subtotal</span><b>${ugx(total)}</b></div><div class="row between small muted"><span>Volume discount</span><span>−${ugx(total*0.08)}</span></div><div class="divider"></div><div class="row between"><b>Total</b><b>${ugx(total*0.92)}</b></div><select class="inp mt">${S.wholesalers.map(w=>`<option>${w.name}</option>`).join('')}</select><button class="btn block mt" ${total<300000||!verified?'disabled':''} onclick="S.tabs.ws={};audit('Wholesale order placed','${ugx(total*0.92)}');save();toast('Bulk order placed. Delivery in 1–2 days.','green');rerender()">Place bulk order</button>${total<300000?'<p class="small muted mt">Below minimum order value.</p>':''}</div></div>`; };

R['ph/assistant'] = () => { const q=(S.tabs.phq||'').toLowerCase(); const hits=S.meds.filter(m=>q&&(m.name.toLowerCase().includes(q)||m.cat.toLowerCase().includes(q)));
  return ph('Pharmacy','Drug search') + `<div class="card mb"><form class="row" onsubmit="event.preventDefault();S.tabs.phq=this.q.value;rerender()"><input class="inp" name="q" value="${esc(S.tabs.phq||'')}" placeholder="e.g. malaria, blood pressure, family planning, or a brand name"><button class="btn">${ic('search')}</button></form></div>
  ${q?`<div class="grid g2"><div class="card"><h3>In your stock</h3>${hits.map(m=>`<div class="li"><span class="ic green">${ic('pill')}</span><div class="grow"><div class="t small">${m.name}</div><div class="s">${m.stock} in stock · ${ugx(m.price)}</div></div></div>`).join('')||'<p class="muted small">No matches</p>'}</div><div class="card"><h3>${ic('info')} Notes</h3><div class="note small">${ic('lightbulb')}<div>Generic alternatives are shown first to keep prices low. Check the NDA register for authorised brands. MB Musawo never suggests doses to patients.</div></div></div></div>`:''}`; };

</script>
<script>
/* MB Musawo — home care */
R['hc/home'] = () => { const today=S.homeVisits.filter(v=>isToday(v.at)).sort((a,b)=>new Date(a.at)-new Date(b.at)); const reqs=S.homeVisits.filter(v=>v.status==='Requested');
  return ph('Nurse Florence Akello · UNMC/RN/77120','Home care dashboard',`<button class="btn red" onclick="A.safety()">${ic('shield-alert')} Safety alert</button>`) + `
  <div class="grid g4 mb">${stat('Visits today',today.length,'calendar-clock','blue')}${stat('New requests',reqs.length,'inbox','amber')}${stat('Samples collected',3,'test-tube','purple','this week')}${stat('Earnings (week)',ugx(740000),'banknote','green')}</div>
  <div class="grid g-21"><div class="card"><div class="card-h"><h3>Today</h3><a class="small" href="#/app/hc/schedule">Full schedule</a></div>${today.map(hvRow).join('')}</div>
  <div class="card"><h3>New requests</h3>${reqs.map(v=>`<div class="li"><span class="ic ${v.urgent?'red':'amber'}">${ic(v.urgent?'siren':'inbox')}</span><div class="grow"><div class="t small">${v.type}</div><div class="s">${pat(v.pid).name} · ${v.addr} · ${fdt(v.at)}</div></div><button class="btn sm green" onclick="A.hvSet('${v.id}','Accepted')">Accept</button></div>`).join('')||'<p class="muted small">None</p>'}</div></div>`; };
function hvRow(v){ const p=pat(v.pid); return `<div class="li"><div style="width:52px;text-align:center"><b>${ftime(v.at)}</b></div><div class="grow"><div class="t">${v.type} ${v.urgent?'<span class="badge red">Urgent</span>':''}</div><div class="s">${p.name} · ${v.addr}</div>${v.labOrder?`<div class="s">Lab order ${v.labOrder}</div>`:''}</div>${badgeFor(v.status)}${v.status==='En route'?`<a class="btn sm purple" href="#/app/hc/map">${ic('navigation')} Map</a>`:v.status==='Accepted'?`<button class="btn sm" onclick="A.hvSet('${v.id}','En route')">Start trip</button>`:v.status==='En route'||v.status==='Arrived'?'':''}${v.status==='En route'?`<button class="btn sm green" onclick="A.hvSet('${v.id}','Arrived')">Arrived</button>`:''}${v.status==='Arrived'?`<a class="btn sm" href="#/app/hc/visit/${v.id}">Record visit</a>`:''}</div>`; }
A.hvSet = (id, st) => { const v=S.homeVisits.find(x=>x.id===id); v.status=st; audit('Home visit '+st, id); notify(v.pid, st==='En route'?'Your nurse is on the way. Track live in the app.':`Home visit ${id}: ${st}.`, '#/app/p/homevisit','info'); save(); toast(st==='En route'?'Location sharing ON until the visit starts':st==='Arrived'?'Location sharing stopped. Checked in.':'Updated','green'); rerender(); };
R['hc/requests'] = () => ph('Home care','Visit requests') + `<div class="grid g2">${S.homeVisits.filter(v=>['Requested','Accepted'].includes(v.status)).map(v=>`<div class="card"><div class="row between"><b>${v.type}</b>${v.urgent?'<span class="badge red">Urgent</span>':badgeFor(v.status)}</div><div class="small muted mt">${pat(v.pid).name} · ${age(pat(v.pid).dob)} y</div><div class="small">${ic('map-pin')} ${v.addr}</div><div class="small">${ic('clock')} ${fdt(v.at)}</div>${v.labOrder?`<div class="small">${ic('flask-conical')} From lab order ${v.labOrder}</div>`:''}${v.status==='Requested'?`<div class="row mt"><button class="btn green" onclick="A.hvSet('${v.id}','Accepted')">Accept</button><button class="btn ghost" onclick="A.hvSet('${v.id}','Declined')">Decline</button></div>`:''}</div>`).join('')}</div>`;
R['hc/schedule'] = () => ph('Home care',"Today's schedule",`<button class="btn ghost" onclick="toast('Schedule shared with your supervisor (Sr. Agnes Namutebi)','green')">${ic('share-2')} Share with supervisor</button>`) + `<div class="card">${S.homeVisits.filter(v=>isToday(v.at)||v.status==='Accepted').sort((a,b)=>new Date(a.at)-new Date(b.at)).map(hvRow).join('')}</div>`;
R['hc/map'] = () => { const v=S.homeVisits.find(x=>x.status==='En route')||S.homeVisits[1]; const start=[0.3540,32.6150];
  leaflet('hcmap',[ (start[0]+v.lat)/2, (start[1]+v.lng)/2 ],14,[{lat:start[0],lng:start[1],color:'#316FF6',r:11,popup:'You (Nurse Florence)'},{lat:v.lat,lng:v.lng,color:'#1941BA',r:11,popup:esc(pat(v.pid).name)+' — '+esc(v.addr)}], m=>{ L.polyline([start,[0.351,32.607],[0.349,32.600],[v.lat,v.lng]],{color:'#316FF6',weight:5,dashArray:'8 8'}).addTo(m); });
  return ph('Home care','Live map') + `<div class="grid g-21"><div class="map tall" id="hcmap"></div><div class="card"><h3>En route</h3><div class="li">${av(pat(v.pid).name)}<div class="grow"><div class="t">${pat(v.pid).name}</div><div class="s">${v.type}</div><div class="s">${v.addr}</div></div></div><div class="grid g2 mt">${stat('ETA','14 min','timer','teal')}${stat('Distance','3.8 km','route','blue')}</div><div class="note mt small">${ic('radio')}<div>Your live location is shared with the patient only while travelling, and stops when the visit starts.</div></div><div class="row mt"><a class="btn" href="tel:${pat(v.pid).phone.replace(/\s/g,'')}">${ic('phone')} Call</a><button class="btn green" onclick="A.hvSet('${v.id}','Arrived');go('#/app/hc/visit/${v.id}')">Arrived</button></div></div></div>`; };
R['hc/visit'] = (vid) => { const v=S.homeVisits.find(x=>x.id===vid)||S.homeVisits.find(x=>x.status==='Arrived')||S.homeVisits[1]; const p=pat(v.pid);
  return ph('Home care','Visit record') + `<div class="grid g2"><div class="card"><h3>${v.type} · ${p.name}</h3><p class="small muted">${v.addr} · ${fdt(v.at)}</p><div class="grid g3" style="gap:10px">${[['Temp °C','36.9'],['Pulse','82'],['BP','132/84'],['Resp','16'],['SpO₂ %','97'],['Glucose','6.1']].map(([l,x])=>`<div class="field"><label>${l}</label><input class="inp" value="${x}"></div>`).join('')}</div>
    ${v.type.includes('Sample')?`<div class="card flat mb"><h4>${ic('test-tube')} Sample collection for ${v.labOrder||'lab order'}</h4><div class="grid g2" style="gap:10px"><div class="field"><label>Lab sample ID</label><input class="inp mono" value="MBM-${(v.labOrder||'0000').slice(3)}-A"></div><div class="field"><label>Time collected</label><input class="inp" type="time" value="${new Date().toTimeString().slice(0,5)}"></div></div><div class="field"><label>Condition</label><select class="inp"><option>Acceptable</option><option>Haemolysed</option><option>Insufficient</option></select></div></div>`:''}
    <div class="field"><label>What was done</label><textarea class="inp" placeholder="e.g. Nebulised salbutamol, wheeze improved"></textarea></div><div class="field"><label>Concerns</label><input class="inp"></div>
    <button class="btn" onclick="const v=S.homeVisits.find(x=>x.id==='${v.id}');v.status='Done';queueOrRun('Visit record',()=>{audit('Visit recorded','${v.id}');save();toast('Visit saved. Patient and requesting doctor can see it.','green');go('#/app/hc/home')})">${ic('save')} Save visit</button></div>
  <div class="card"><h3>${ic('shield')} Safety</h3><p class="small t2">Your schedule is shared with your supervisor. Check in at each visit.</p><button class="btn green block" onclick="audit('Safety check-in','${v.id}');toast('Checked in — supervisor notified','green')">${ic('check-circle-2')} I’m safe — check in</button><button class="btn red block mt" onclick="A.safety()">${ic('siren')} Raise alert</button></div></div>`; };
A.safety = () => modal('Raise safety alert', `<div class="note red mb">${ic('siren')}<div>Your supervisor and the operations team get your live location at once.</div></div><div class="field"><label>What is happening?</label><select class="inp"><option>I feel unsafe</option><option>Aggressive person</option><option>Medical emergency at the visit</option><option>Vehicle breakdown</option></select></div>`, `<button class="btn red" onclick="audit('SAFETY ALERT raised','Nurse Florence',false);closeModal();toast('Alert sent to supervisor with location','red')">Send alert</button>`);

</script>
<script>
/* MB Musawo — clinic operator suite (multi-branch) */
const BF = () => S.branch==='all' ? 1 : ({ntd:.22,klo:.27,ebb:.11,jja:.13,mbr:.15,gul:.12})[S.branch];
const bname = () => S.branch==='all' ? 'All 6 branches' : branch(S.branch).name + ' branch';
const n0 = x => Math.round(x).toLocaleString('en-US');
const TRI = {1:['Emergency','red'],2:['Very urgent','warm'],3:['Urgent','amber'],4:['Routine','green']};

R['c/home'] = () => { const f=BF();
  const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);return d;});
  chart('cvisits',{type:'line',data:{labels:days.map(d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})),datasets:[{label:'Clients served',data:days.map((d,i)=>Math.round((1050+i*18+Math.sin(i)*90)*f)),borderColor:'#1941BA',backgroundColor:'rgba(25,65,186,.12)',fill:true,tension:.4},{label:'FP clients',data:days.map((d,i)=>Math.round((330+i*6+Math.cos(i)*30)*f)),borderColor:'#316FF6',backgroundColor:'rgba(49,111,246,.08)',fill:true,tension:.4}]},options:{interaction:{mode:'index',intersect:false}}});
  chart('cmix',{type:'doughnut',data:{labels:['Mobile Money','Insurance','Cash','Card'],datasets:[{data:[54,24,15,7],backgroundColor:['#1941BA','#316FF6','#92BDF9','#04125C'],borderWidth:0}]},options:{cutout:'68%',plugins:{legend:{position:'bottom'}}}});
  const stockouts = S.commodities.filter(c=>S.branches.some(b=>c[b.id]<c.min)).length;
  return ph(bname()+' · live', 'Operations command centre', `<button class="btn ghost" onclick="A.download('weekly-ops-report.csv','metric,value\\nclients,${n0(8980*f)}\\nfp_clients,${n0(2880*f)}\\ncyp,${n0(968*f)}\\nrevenue_ugx,${n0(38.6e6*f)}','text/csv')">${ic('download')} Export</button>`) + `
  <div class="grid g4 mb">${stat('Clients today',n0(1284*f),'users','blue','<span class="up">▲ 8%</span> vs last Sat')}${stat('Avg wait time',S.branch==='klo'?'38 min':'24 min','timer','warm',S.branch==='klo'?'<span class="down">▲ above 30 min target</span>':'<span class="up">▼ 6 min</span>')}${stat('Couple-years of protection',n0(968*f),'shield-plus','teal','month to date')}${stat('Revenue today',ugx(38.6e6*f/7),'banknote','green','<span class="up">▲ 4%</span>')}</div>
  <div class="grid g-21 mb"><div class="card"><div class="card-h"><h3>Clients served — last 14 days</h3><span class="badge green">● Live</span></div><div style="height:270px"><canvas id="cvisits"></canvas></div></div>
    <div class="card"><h3>How clients pay</h3><div style="height:270px"><canvas id="cmix"></canvas></div></div></div>
  <div class="grid g3">
    <div class="card"><h3>${ic('alert-triangle')} Needs attention</h3>
      ${[['red','baby','High-risk pregnancy','Prossy Nansubuga — GDM, BP 138/88','#/app/c/maternal'],['amber','boxes',stockouts+' commodities below minimum','DMPA-SC in Gulu: ~4 days left','#/app/c/stock'],['amber','shield-check','1 insurance claim query','CLM-2212 missing pre-auth — UGX 96,000','#/app/c/claims'],['blue','timer','Kololo wait 38 min','Open 1 more triage desk 10:00–13:00','#/app/c/queue'],['purple','flask-conical','QC rejection at Central Lab','Release blocked until corrective action','#/app/l/qc']].map(([c,i,t,s,h])=>`<a class="li" style="color:var(--text)" href="${h}"><span class="ic ${c}">${ic(i)}</span><div class="grow"><div class="t small">${t}</div><div class="s">${s}</div></div>${ic('chevron-right')}</a>`).join('')}</div>
    <div class="card"><h3>Branch league</h3>${S.branches.map((b,i)=>{const v=[96,91,88,84,79,74][i];return `<div class="li"><b style="width:18px">${i+1}</b><div class="grow"><div class="t small">${b.name}</div><div class="bar mt"><i style="width:${v}%;background:${v>85?'var(--teal)':'var(--amber)'}"></i></div></div><b class="small">${v}</b></div>`;}).join('')}<p class="small muted mt mb0">Quality score: wait time, follow-up, stock, claims, client rating.</p></div>
    <div class="card"><h3>Today at a glance</h3>${[['Queue now',S.queue.length+' clients','users-round'],['Telemedicine',n0(42*f)+' sessions','video'],['Lab orders',n0(186*f),'flask-conical'],['SMS/WhatsApp sent',n0(2410*f),'message-circle'],['Offline notes waiting',S.outbox.length,'cloud-off']].map(([k,v,i])=>`<div class="li"><span class="ic teal">${ic(i)}</span><div class="grow small">${k}</div><b>${v}</b></div>`).join('')}</div>
  </div>`; };

/* queue & triage */
function triageScore(v, svc){ if(!v) return null; let s=4; if(v.spo2<92||v.t>=40||v.rr>30) s=1; else if(v.spo2<95||v.t>=38.5||v.p>120||v.rr>24) s=2; else if(v.t>=37.8||parseInt(v.bp)>=140||/ANC/.test(svc)&&parseInt(v.bp)>=135) s=3; return s; }
R['c/queue'] = () => { const stages=['Registered','Triage','Waiting doctor','Lab','Pharmacy'];
  return ph(bname(),'Queue & triage',`<button class="btn" onclick="A.checkIn()">${ic('user-plus')} Check in client</button>`) + `
  <div class="grid g4 mb">${stat('In clinic',S.queue.length,'users-round','blue')}${stat('Longest wait',ago(S.queue.map(q=>q.in).sort()[0]).replace(' ago',''),'timer','warm')}${stat('Emergency / very urgent',S.queue.filter(q=>q.tri<=2).length,'siren','red')}${stat('Served today',n0(212*BF()),'check-circle-2','green')}</div>
  <div class="kan" style="grid-template-columns:repeat(5,minmax(220px,1fr))">${stages.map(st=>`<div class="kan-col"><h4>${st}<span class="badge">${S.queue.filter(q=>q.stage===st).length}</span></h4>${S.queue.filter(q=>q.stage===st).sort((a,b)=>a.tri-b.tri).map(q=>{const p=pat(q.pid);const [tl,tc]=TRI[q.tri];return `<div class="kan-card tri-${q.tri}"><div class="row between"><b class="small">${p.name}</b><span class="badge ${tc}">${tl}</span></div><div class="small muted">${q.service} · ${age(p.dob)} y · in ${ago(q.in)}</div>${q.vitals?`<div class="small mono mt">T ${q.vitals.t} · P ${q.vitals.p} · BP ${q.vitals.bp} · SpO₂ ${q.vitals.spo2}</div>`:''}${q.tri<=2?`<div class="note small mt" style="padding:8px">${ic('info')}<div>${q.vitals&&q.vitals.spo2<95?'Low oxygen — see first, consider nebuliser.':'Fever + fast pulse — prioritise.'}</div></div>`:''}<div class="row mt" style="gap:6px">${st==='Triage'||st==='Registered'?`<button class="btn sm" onclick="A.triage('${q.id}')">Triage</button>`:''}${stages.indexOf(st)<4?`<button class="btn sm ghost" onclick="A.qMove('${q.id}','${stages[stages.indexOf(st)+1]}')">→ ${stages[stages.indexOf(st)+1]}</button>`:`<button class="btn sm green" onclick="A.qDone('${q.id}')">Discharge</button>`}</div></div>`;}).join('')}</div>`).join('')}</div>
  <p class="small muted mt">Triage uses vital signs to suggest a priority (from vital signs). A nurse confirms. Clients get an SMS when it is their turn.</p>`; };
A.qMove = (id,st) => { const q=S.queue.find(x=>x.id===id); q.stage=st; save(); if(st==='Waiting doctor') toast(`SMS sent to ${pat(q.pid).name}: “Please go to Room 3.”`,'blue'); rerender(); };
A.qDone = id => { S.queue=S.queue.filter(x=>x.id!==id); save(); toast('Discharged. Feedback SMS sent.','green'); rerender(); };
A.checkIn = () => modal('Check in client', `<div class="field"><label>Find client (name, phone or ID)</label><select class="inp" id="cip">${S.patients.map(p=>`<option value="${p.id}">${p.name} · ${p.phone}</option>`).join('')}</select></div><div class="field"><label>Service</label><select class="inp" id="cis"><option>General OPD</option><option>Family planning</option><option>Antenatal (ANC)</option><option>Postnatal (PNC)</option><option>Paediatrics</option><option>HIV testing & counselling</option><option>Cervical cancer screening</option><option>Safe motherhood / post-abortion care</option></select></div><div class="field"><label>Payment</label><select class="inp"><option>Mobile Money</option><option>Insurance</option><option>Cash</option><option>Voucher / subsidy</option></select></div>`, `<button class="btn" onclick="S.queue.push({id:uid('Q'),pid:$('#cip').value,service:$('#cis').value,in:new Date().toISOString(),tri:4,stage:'Registered',vitals:null});audit('Client checked in',$('#cip').value);save();closeModal();rerender()">Check in</button>`);
A.triage = id => { const q=S.queue.find(x=>x.id===id); const v=q.vitals||{t:37.0,p:80,bp:'120/80',rr:16,spo2:98};
  modal('Triage · '+pat(q.pid).name, `<div class="grid g3" style="gap:10px">${[['t','Temp °C',v.t],['p','Pulse',v.p],['bp','BP',v.bp],['rr','Resp rate',v.rr],['spo2','SpO₂ %',v.spo2]].map(([k,l,x])=>`<div class="field"><label>${l}</label><input class="inp tv" data-k="${k}" value="${x}" oninput="A.triPreview('${q.service}')"></div>`).join('')}</div><div class="field"><label>Main complaint</label><input class="inp"></div><div id="tripv"></div>`, `<button class="btn" onclick="A.triSave('${id}')">Save triage</button>`); A.triPreview(q.service); };
A.triRead = () => { const o={}; $$('.tv').forEach(i=>o[i.dataset.k]=i.dataset.k==='bp'?i.value:parseFloat(i.value)); return o; };
A.triPreview = svc => { const s=triageScore(A.triRead(), svc); const [l,c]=TRI[s]; $('#tripv').innerHTML=`<div class="note">${ic('info')}<div>Suggested priority: <span class="badge ${c}">${l}</span><br><span class="small muted">Based on vital signs. The nurse decides.</span></div></div>`; lucide.createIcons(); };
A.triSave = id => { const q=S.queue.find(x=>x.id===id); q.vitals=A.triRead(); q.tri=triageScore(q.vitals,q.service); q.stage='Waiting doctor'; audit('Triage recorded', q.pid); save(); closeModal(); rerender(); };

/* appointments board */
R['c/schedule'] = () => { const ds=S.doctors.filter(d=>S.branch==='all'||d.branch===S.branch);
  return ph(bname(),'Appointments board',`<button class="btn" onclick="go('#/app/c/reminders')">${ic('message-circle')} Send reminders</button>`) + `<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Time</th><th>Client</th><th>Provider</th><th>Type</th><th>Branch</th><th>Paid</th><th>Status</th></tr></thead><tbody>${S.appointments.filter(a=>ds.some(d=>d.id===a.did)).sort((a,b)=>new Date(a.at)-new Date(b.at)).map(a=>`<tr><td>${fdt(a.at)}</td><td>${pat(a.pid).name}</td><td>${doc(a.did).name}</td><td>${a.type}</td><td>${branch(a.branch).name}</td><td>${a.paid?'<span class="badge green">Paid</span>':'<span class="badge amber">Unpaid</span>'}</td><td>${badgeFor(a.status)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="grid g3 mt">${[['No-show rate','6.2%','user-x','red','▼ 3.1 pts since WhatsApp reminders'],['Booked online','61%','smartphone','blue','of all visits'],['Video share','18%','video','teal','of consultations']].map(([k,v,i,c,d])=>stat(k,v,i,c,d)).join('')}</div>`; };

/* family planning */
R['c/fp'] = () => { const f=BF(); const mix=[310,120,520,380,900,140,6].map(x=>Math.round(x*f));
  const cyp = S.fpMethods.reduce((s,m,i)=>s+mix[i]*m.cyp,0);
  chart('fpmix',{type:'bar',data:{labels:S.fpMethods.map(m=>m.k),datasets:[{label:'Clients this month',data:mix,backgroundColor:S.fpMethods.map(m=>m.color),borderRadius:8}]},options:{plugins:{legend:{display:false}}}});
  chart('fpcyp',{type:'doughnut',data:{labels:S.fpMethods.map(m=>m.k),datasets:[{data:S.fpMethods.map((m,i)=>+(mix[i]*m.cyp).toFixed(1)),backgroundColor:S.fpMethods.map(m=>m.color),borderWidth:0}]},options:{cutout:'62%',plugins:{legend:{position:'bottom',labels:{font:{size:10}}}}}});
  return ph(bname(),'Family planning',`<button class="btn" onclick="A.newFP()">${ic('plus')} New FP client</button>`) + `
  <div class="grid g4 mb">${stat('FP clients (month)',n0(mix.reduce((a,b)=>a+b,0)),'heart-handshake','warm')}${stat('Couple-years of protection',n0(cyp),'shield-plus','teal','CYP, standard conversion factors')}${stat('Long-acting share',Math.round((mix[0]+mix[1]+mix[6])/mix.reduce((a,b)=>a+b,0)*100)+'%','trending-up','blue','implants, IUDs, tubal')}${stat('Due for follow-up',S.fpClients.filter(c=>c.status!=='Active').length,'calendar-clock','amber','this week')}</div>
  <div class="grid g-21 mb"><div class="card"><h3>Method mix</h3><div style="height:260px"><canvas id="fpmix"></canvas></div></div><div class="card"><h3>CYP by method</h3><div style="height:260px"><canvas id="fpcyp"></canvas></div></div></div>
  <div class="card"><div class="card-h"><h3>FP register</h3><span class="small muted">Discreet reminders on</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Client</th><th>Method</th><th>Started</th><th>Next due</th><th>Branch</th><th>Status</th><th></th></tr></thead><tbody>${S.fpClients.map(c=>`<tr><td>${pat(c.pid).name}<div class="small muted">${c.pid}</div></td><td>${c.method}</td><td>${c.start}</td><td>${c.next}</td><td>${branch(c.branch).name}</td><td>${badgeFor(c.status)}</td><td><button class="btn sm ghost" onclick="toast('Discreet SMS sent: “You have an update from MB Musawo.”','green')">${ic('message-circle')} Remind</button></td></tr>`).join('')}</tbody></table></div></div>
  <p class="small muted mt">CYP factors used: implant 2.5, copper IUD 4.6, injectable 0.25 per dose, pills 15 cycles, condoms 120 units, EC 20 doses, tubal ligation 10.</p>`; };
A.newFP = () => modal('New family planning client', `<div class="field"><label>Client</label><select class="inp" id="fpc">${S.patients.filter(p=>p.sex==='F'||true).map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div class="field"><label>Counselling done (all methods explained)</label><select class="inp"><option>Yes — informed choice recorded</option></select></div><div class="field"><label>Method chosen</label><select class="inp" id="fpm">${S.fpMethods.map(m=>`<option>${m.k}</option>`).join('')}</select></div><div class="field"><label>Next due date</label><input class="inp" type="date" id="fpd"></div><label class="check"><input type="checkbox" checked> Send discreet reminders (SMS/WhatsApp)</label>`, `<button class="btn" onclick="S.fpClients.unshift({pid:$('#fpc').value,method:$('#fpm').value,start:new Date().toISOString().slice(0,10),next:$('#fpd').value||'—',branch:S.branch==='all'?'ntd':S.branch,status:'Active'});audit('FP client registered',$('#fpc').value);save();closeModal();rerender()">Save</button>`);

/* maternal health */
R['c/maternal'] = () => { const rows=S.anc.map(a=>{ const wk=Math.floor((Date.now()-new Date(a.lmp))/604800000); return {...a, wk, edd:new Date(new Date(a.lmp).getTime()+280*864e5)}; });
  return ph(bname(),'Maternal health',`<button class="btn" onclick="A.eddCalc()">${ic('calculator')} Due-date calculator</button>`) + `
  <div class="grid g4 mb">${stat('Active pregnancies',n0(642*BF()),'baby','warm')}${stat('High-risk',n0(57*BF()),'alert-triangle','red','flagged for review')}${stat('ANC 1 before 12 weeks','47%','calendar-check','blue','<span class="up">▲ 9 pts</span>')}${stat('4+ ANC visits','71%','check-circle-2','green')}</div>
  <div class="card mb"><h3>Antenatal register</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Client</th><th>Gestation</th><th>Due date</th><th>ANC visits</th><th>Risk</th><th>Next visit</th><th>Notes</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${pat(r.pid).name}</b><div class="small muted">${age(pat(r.pid).dob)} y</div></td><td>${r.wk} wk<div class="bar" style="width:90px"><i style="width:${r.wk/40*100}%;background:var(--warm)"></i></div></td><td>${fdate(r.edd.toISOString())}</td><td>${r.visits} / 8</td><td>${badgeFor(r.risk)}</td><td>${fdt(r.next)}</td><td class="small">${esc(r.notes)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="grid g2"><div class="card"><h3>${ic('info')} Risk alerts</h3><div class="note red">${ic('alert-triangle')}<div><b>Prossy Nansubuga, 34 wks</b> — gestational diabetes, BP 138/88. Pre-eclampsia watch: check urine protein, review within 48 h, plan delivery at a facility with theatre.</div></div><div class="note warn mt">${ic('droplet')}<div><b>Sarah Nakato, 24 wks</b> — Hb 10.9 g/dL. Continue iron; repeat FBC in 4 weeks (request sent).</div></div><p class="small muted mt mb0">Guidance only — the clinician decides.</p></div>
  <div class="card"><h3>Postnatal follow-up</h3><div class="li">${av('Doreen Achieng')}<div class="grow"><div class="t small">Doreen Achieng — 3 weeks postpartum</div><div class="s">Home visit done today · baby weight 4.1 kg · FP counselling due</div></div><span class="badge blue">PNC 3</span></div><div class="li"><span class="ic teal">${ic('syringe')}</span><div class="grow small">Baby immunisation reminders (6, 10, 14 weeks) via WhatsApp</div><label class="switch"><input type="checkbox" checked><span></span></label></div></div></div>`; };
A.eddCalc = () => modal('Due-date calculator', `<div class="field"><label>First day of last menstrual period</label><input class="inp" type="date" id="lmp" oninput="const d=new Date(this.value);if(!isNaN(d)){const e=new Date(d.getTime()+280*864e5);const w=Math.floor((Date.now()-d)/604800000);$('#eddr').innerHTML='<div class=&quot;note green&quot;><div>Due date: <b>'+e.toDateString()+'</b><br>Gestation today: <b>'+w+' weeks</b></div></div>'}"></div><div id="eddr"></div>`);

/* telemedicine */
R['c/telemed'] = () => { chart('tmc',{type:'bar',data:{labels:['Mon','Tue','Wed','Thu','Fri','Sat'],datasets:[{label:'Video',data:[38,44,51,47,55,29],backgroundColor:'#316FF6',borderRadius:6},{label:'Audio fallback',data:[9,12,10,14,11,6],backgroundColor:'#316FF6',borderRadius:6}]},options:{scales:{x:{stacked:true},y:{stacked:true}}}});

A.newInvoice = () => { const rows=[['Consultation — GP',50000],['Malaria RDT',10000],['Full blood count',25000],['Artemether/Lumefantrine',12000]];

/* insurance claims */

const scKB = id => KB.find(k=>k.id===id);
function scDetect(text){ if(EMERGENCY_RX.test(text)) return 'EMERGENCY'; const ch=scKB('child'); if(ch.kw.test(text)) return 'child'; const hit=KB.find(k=>k.kw.test(text)); return hit?hit.id:null; }
function scCompute(st){
  const k=scKB(st.cid); let lvl=k.base; let spec=k.spec; const causes=[...k.causes]; const tests=[...k.tests];
  const p=st.profile||{};
  if((st.danger||[]).length) lvl=1;
  (k.qs||[]).forEach(q=>{ const a=st.answers[q.id]; if(a==null) return; const eff=q.o[a][1]; if(eff.l) lvl=Math.min(lvl,eff.l); if(eff.s) spec=eff.s; (eff.c||[]).forEach(x=>{ if(!causes.includes(x)) causes.unshift(x); }); (eff.t||[]).forEach(x=>{ if(!tests.includes(x)) tests.push(x); }); });
  if(p.age==='inf' && st.cid==='fever') { lvl=1; causes.unshift('Fever in a baby under 2 months is always an emergency'); }
  if(['inf','u5'].includes(p.age)) { if(spec==='General Practitioner'||spec==='Dermatologist') spec='Paediatrician'; if(['fever','cough','diarr'].includes(st.cid)) lvl=Math.min(lvl,2); }
  if(p.preg && ['stomach','head','fever','urine','bp'].includes(st.cid)) { lvl=Math.min(lvl,2); if(spec==='General Practitioner') spec='Obstetrician & Gynaecologist'; }
  if(p.age==='old' && ['chest','head','bp'].includes(st.cid)) lvl=Math.min(lvl,2);
  if(p.preg) { const i=tests.indexOf('HCG'); if(i>=0 && st.cid!=='preg') tests.splice(i,1); }
  const docs=S.doctors.filter(d=>d.spec===spec); const alt=S.doctors.filter(d=>d.spec==='General Practitioner'||d.spec==='Family Physician');
  return {lvl, spec, causes:causes.slice(0,5), tests:tests.filter(c=>S.tests.some(t=>t.code===c)).slice(0,5), care:k.care, watch:k.watch, docs:(docs.length?docs:alt).slice(0,2)};
}
