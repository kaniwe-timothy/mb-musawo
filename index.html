      <div class="card"><h3>Lab requests & forwarded results</h3>${pending.map(r=>`<div class="li"><span class="ic purple">${ic('file-text')}</span><div class="grow"><div class="t small">${r.id} · ${r.tests.map(c=>test(c).name).join(', ')}</div><div class="s">${esc(r.reason)}</div></div>${badgeFor(r.status)}</div>`).join('')}
        ${results.map(o=>`<div class="mt"><div class="row between"><b class="small">${o.id} — forwarded by patient</b><span class="small muted">${fdate(o.released)}</span></div>${resultTable(o)}</div>`).join('')||'<p class="small muted mt">No results forwarded yet. Results reach the patient first.</p>'}</div>
      <div class="card"><h3>Consultation notes <span class="small muted" style="font-weight:500">— cannot be deleted</span></h3>${notes.map(c=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="row between"><b class="small">${fdt(c.at)} · ${c.by}</b><button class="btn sm ghost" onclick="A.correctNote('${c.id}')">${ic('pen-line')} Add correction</button></div>${c.corrects?`<span class="badge amber">Correction of ${c.corrects}</span>`:''}<dl class="kv mt small"><dt>Complaint</dt><dd>${esc(c.complaint)}</dd><dt>Findings</dt><dd>${esc(c.findings)}</dd><dt>Diagnosis</dt><dd>${esc(c.dx)}</dd><dt>Plan</dt><dd>${esc(c.plan)}</dd></dl></div>`).join('')||'<p class="muted small">No notes yet</p>'}</div>
    </div></div>`;
}
R['common/patients'] = pid => patientFile(pid);
A.patientFile = pid => go('#/app/'+S.role+'/patients/'+pid);
A.breakGlass = pid => modal('Break-glass access', `<div class="note red mb">${ic('alert-triangle')}<div>Use only in a genuine emergency. Your reason is recorded and reviewed by an administrator.</div></div><div class="field"><label>Reason</label><textarea class="inp" id="bgr" placeholder="e.g. Patient unconscious in emergency room, need allergy history"></textarea></div>`, `<button class="btn red" onclick="if($('#bgr').value.length<10)return toast('Give a clear reason','red');S.shares.push({id:uid('S'),what:'Break-glass',to:'${doc(DID).name}',pidx:'${pid}',at:new Date().toISOString(),revoked:null});audit('BREAK-GLASS: '+$('#bgr').value,'${pid}',false);save();closeModal();toast('Access granted for 4 hours. Flagged for review.','red');rerender()">Open record</button>`);
A.correctNote = id => { const c=S.consultations.find(x=>x.id===id); modal('Add correction', `<p class="small t2">The original note stays visible. Your correction is a new entry linked to it.</p><div class="field"><label>Corrected diagnosis</label><input class="inp" id="cd" value="${esc(c.dx)}"></div><div class="field"><label>Corrected plan</label><textarea class="inp" id="cp">${esc(c.plan)}</textarea></div><div class="field"><label>Reason for correction</label><input class="inp" id="cr" required></div>`, `<button class="btn" onclick="S.consultations.push({...S.consultations.find(x=>x.id==='${id}'),id:uid('C'),at:new Date().toISOString(),dx:$('#cd').value,plan:$('#cp').value+' [Reason: '+$('#cr').value+']',corrects:'${id}'});audit('Note correction added','${id}');save();closeModal();rerender()">Save correction</button>`); };

/* consultation */
R['d/consult'] = (aid) => {
  let pid = null, appt=null;
  if(aid && aid.startsWith('new-')) pid=aid.slice(4); else if(aid){ appt=S.appointments.find(a=>a.id===aid); pid=appt?.pid; }
  const cands = myAppts().filter(a=>['Arrived','In consultation','Confirmed'].includes(a.status));
  if(!pid) return ph('Clinic','Consultation') + `<div class="card"><h3>Choose a patient</h3>${cands.map(docApptRow).join('')||'<div class="empty">No patients waiting</div>'}</div>`;
  const p=pat(pid);
  return ph(`<a href="#/app/d/consult">Consultation</a>`, p.name, `<button class="btn ghost" onclick="A.openFile('${pid}')">${ic('folder-open')} Full file</button>`) + `
  <div class="grid g-21"><div class="card"><h3>Vital signs</h3><div class="grid g4" style="gap:10px">${[['Temp (°C)','36.8','t'],['Pulse (/min)','78','p'],['BP (mmHg)','128/82','bp'],['Resp (/min)','16','rr'],['SpO₂ (%)','98','spo2'],['Weight (kg)',p.weight,'w'],['Height (cm)',p.height,'h'],['BMI',bmi(p.height,p.weight),'bmi']].map(([l,v,k])=>`<div class="field"><label>${l}</label><input class="inp" id="v-${k}" value="${v}"></div>`).join('')}</div>
    <h3 class="mt">Notes (SOAP)</h3>
    <div class="field"><label>Complaint</label><textarea class="inp" id="n-c">${esc(appt?.reason||'')}</textarea></div>
    <div class="field"><label>Examination / findings</label><textarea class="inp" id="n-f"></textarea></div>
    <div class="field"><label>Diagnosis (ICD-10)</label><input class="inp" id="n-d" list="icd" placeholder="Start typing…"><datalist id="icd"><option>B54 — Malaria, unspecified</option><option>I10 — Essential hypertension</option><option>E11.9 — Type 2 diabetes</option><option>J45.9 — Asthma</option><option>Z30.0 — Contraceptive counselling</option><option>Z34.2 — Supervision of normal pregnancy</option><option>O24.4 — Gestational diabetes</option><option>N39.0 — Urinary tract infection</option></datalist></div>
    <div class="field"><label>Plan</label><textarea class="inp" id="n-p"></textarea></div>
    <div class="row wrap"><button class="btn" onclick="A.saveNote('${pid}','${appt?.id||''}')">${ic('save')} Save note</button><a class="btn ghost" href="#/app/d/rx/${pid}">Prescribe</a><a class="btn ghost" href="#/app/d/labreq/${pid}">Request labs</a><a class="btn ghost" href="#/app/d/letters/${pid}">Referral / sick note</a></div></div>
  <div class="col"><div class="card">${av(p.name)} <b>${p.name}</b><div class="small muted">${age(p.dob)} y · ${p.sex} · ${p.blood}</div><div class="row wrap mt" style="gap:6px">${p.allergies.filter(a=>!/none/i.test(a)).map(a=>`<span class="badge red">⚠ ${a}</span>`).join('')}${p.conditions.map(c=>`<span class="badge blue">${c}</span>`).join('')}</div></div>
   <div class="card"><h3>${ic('info')} Clinical hints</h3><div class="note small">${ic('lightbulb')}<div>${p.conditions.some(c=>/Hyper/.test(c))?'BP trend improving (152→136). Consider continuing current plan; check renal function yearly.':p.conditions.some(c=>/Pregn/.test(c))?'Pregnant: avoid ACE inhibitors, tetracyclines, misoprostol. Check Hb and urine.':'Consider malaria RDT for any fever in Uganda.'}</div></div><p class="small muted mt mb0">Guidance only.</p></div>
   <div class="card"><h3>Patient chat</h3><div class="msg bot small">Doctor, I’ll be 5 minutes late — boda traffic at Kiwatule.</div><div class="row mt"><input class="inp" placeholder="Reply…"><button class="btn sm" onclick="toast('Sent','green')">${ic('send')}</button></div></div></div></div>`;
};
A.saveNote = (pid, aid) => { const n={id:uid('C'), pid, by:doc(DID).name, at:new Date().toISOString(), complaint:$('#n-c').value, findings:`T ${$('#v-t').value}, P ${$('#v-p').value}, BP ${$('#v-bp').value}, RR ${$('#v-rr').value}, SpO₂ ${$('#v-spo2').value}. ${$('#n-f').value}`, dx:$('#n-d').value||'—', plan:$('#n-p').value};
  queueOrRun('Consultation note', ()=>{ S.consultations.push(n); if(aid){ const a=S.appointments.find(x=>x.id===aid); if(a) a.status='Done'; } audit('Consultation note saved', pid); save(); toast('Note saved to the record. It cannot be deleted — corrections are new entries.','green'); go('#/app/d/patients/'+pid); }); };

/* e-prescription with allergy & interaction check */
const INTERACT = {'Penicillin':['Amoxicillin','Ampicillin','Benzathine'],'Sulfa drugs':['Co-trimoxazole','Sulfadoxine'],'Aspirin':['Aspirin','Ibuprofen']};
const DDI = [['Metformin','Ceftriaxone','Monitor glucose'],['Amlodipine','Simvastatin','Limit simvastatin to 20 mg'],['Artemether','Ondansetron','QT prolongation risk']];
R['d/rx'] = (pid) => {
  const pts=[...new Set(myAppts().map(a=>a.pid))].map(pat); pid = pid || S.tabs.rxp || pts[0].id; S.tabs.rxp=pid; const p=pat(pid);
  const items = S.tabs.rxi || (S.tabs.rxi=[{drug:'',dose:'',freq:'Twice daily',dur:'5 days',qty:''}]);
  const warn=[]; items.forEach(it=>{ p.allergies.forEach(al=>{ (INTERACT[al]||[]).forEach(d=>{ if(it.drug.toLowerCase().includes(d.toLowerCase())) warn.push(`<b>${it.drug}</b> — patient is allergic to <b>${al}</b>. Blocked.`); }); }); [...p.meds,...items.map(x=>x.drug)].forEach(m=>{ DDI.forEach(([a,b,msg])=>{ if(it.drug.includes(a)&&m.includes(b)||it.drug.includes(b)&&m.includes(a)) warn.push(`Interaction ${a} + ${b}: ${msg}`); }); }); if(p.conditions.some(c=>/Pregn/.test(c)) && /misoprostol|doxycycline|enalapril|lisinopril/i.test(it.drug)) warn.push(`<b>${it.drug}</b> is not safe in pregnancy.`); });
  const blocked = warn.some(w=>w.includes('Blocked'));
  return ph('Orders','e-Prescription') + `<div class="grid g-21"><div class="card">
    <div class="grid g3" style="gap:10px"><div class="field"><label>Document</label><select class="inp" id="rxdoc"><option>Prescription</option><option>Medical order</option></select></div><div class="field"><label>Patient</label><select class="inp" onchange="S.tabs.rxp=this.value;S.tabs.rxi=null;rerender()">${pts.map(x=>`<option value="${x.id}" ${x.id===pid?'selected':''}>${x.name}</option>`).join('')}</select></div><div class="field"><label>Send to</label><select class="inp" id="rxto"><option>Patient & pharmacy</option><option>Patient only</option></select></div></div>
    ${p.allergies.filter(a=>!/none/i.test(a)).map(a=>`<span class="badge red mb">⚠ Allergy: ${a}</span>`).join(' ')}
    ${items.map((it,i)=>`<div class="card flat mt" style="padding:12px"><div class="grid" style="grid-template-columns:2fr 1fr 1fr 1fr .7fr auto;gap:8px;align-items:end">
      <div class="field mb0"><label>Medicine</label><input class="inp" list="drugs" value="${esc(it.drug)}" onchange="S.tabs.rxi[${i}].drug=this.value;save();rerender()"></div>
      <div class="field mb0"><label>Dose</label><input class="inp" value="${esc(it.dose)}" placeholder="1 tab" onchange="S.tabs.rxi[${i}].dose=this.value;save()"></div>
      <div class="field mb0"><label>Frequency</label><select class="inp" onchange="S.tabs.rxi[${i}].freq=this.value;save()">${['Once daily','Twice daily','Three times daily','At night','When needed'].map(f=>`<option ${it.freq===f?'selected':''}>${f}</option>`).join('')}</select></div>
      <div class="field mb0"><label>Duration</label><input class="inp" value="${esc(it.dur)}" onchange="S.tabs.rxi[${i}].dur=this.value;save()"></div>
      <div class="field mb0"><label>Qty</label><input class="inp" value="${esc(it.qty)}" onchange="S.tabs.rxi[${i}].qty=this.value;save()"></div>
      <button class="icon-btn" onclick="S.tabs.rxi.splice(${i},1);save();rerender()">${ic('trash-2')}</button></div></div>`).join('')}
    <datalist id="drugs">${S.meds.map(m=>`<option>${m.name}</option>`).join('')}<option>Amoxicillin 500mg</option><option>Co-trimoxazole 960mg</option><option>Misoprostol 200mcg</option></datalist>
    <button class="btn ghost mt" onclick="S.tabs.rxi.push({drug:'',dose:'',freq:'Twice daily',dur:'5 days',qty:''});save();rerender()">${ic('plus')} Add item</button>
    ${warn.length?`<div class="note ${blocked?'red':'warn'} mt">${ic('shield-alert')}<div>${warn.join('<br>')}</div></div>`:items.some(i=>i.drug)?`<div class="note green mt">${ic('shield-check')}<div>No allergy or interaction problems found.</div></div>`:''}
    <div class="row mt" style="justify-content:flex-end"><button class="btn green lg" ${blocked||!items.some(i=>i.drug)?'disabled':''} onclick="A.sendRx('${pid}')">${ic('send')} Sign & send</button></div></div>
    <div class="rx-paper"><div class="row between">${logoSVG(30)}<span class="small mono">e-Rx preview</span></div><h4 class="mt">${doc(DID).name}</h4><div class="small muted">${doc(DID).spec} · ${doc(DID).lic} · ${doc(DID).area}</div><div class="divider"></div><div class="small"><b>${p.name}</b> · ${age(p.dob)} y · ${p.id}</div>${items.filter(i=>i.drug).map(i=>`<div class="small mt">℞ <b>${esc(i.drug)}</b><br>${esc(i.dose)} · ${i.freq} · ${esc(i.dur)} · qty ${esc(i.qty)}</div>`).join('')}<div class="divider"></div><div class="small muted">Valid once. QR verified by pharmacy.</div></div></div>`;
};
A.sendRx = pid => { const id=uid('RX'); S.prescriptions.unshift({id, pid, did:DID, items:S.tabs.rxi.filter(i=>i.drug), at:new Date().toISOString(), status:'Sent to pharmacy', filled:false}); S.tabs.rxi=null; audit('Prescription signed & sent', id); notify(pid, 'You have a new prescription from '+doc(DID).name+'.', '#/app/p/medicine','rx'); save(); toast(`${id} sent to patient and pharmacy.`,'green'); rerender(); };

/* lab request */
R['d/labreq'] = (pid) => {
  const pts=[...new Set(myAppts().map(a=>a.pid))].map(pat); pid=pid||pts[0].id; const sel=S.tabs.lrsel||(S.tabs.lrsel=[]);
  const mine=S.labRequests.filter(r=>r.did===DID);
  return ph('Orders','Lab requests') + `<div class="grid g2"><div class="card"><h3>New request</h3><div class="field"><label>Patient</label><select class="inp" id="lrp">${pts.map(x=>`<option value="${x.id}" ${x.id===pid?'selected':''}>${x.name}</option>`).join('')}</select></div>
    <div class="field"><label>Tests</label><div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px">${S.tests.map(t=>`<label class="check"><input type="checkbox" ${sel.includes(t.code)?'checked':''} onchange="const s=S.tabs.lrsel;this.checked?s.push('${t.code}'):s.splice(s.indexOf('${t.code}'),1);save()"> <span class="grow small">${t.name}</span><span class="small muted">${t.dept}</span></label>`).join('')}</div></div>
    <div class="field"><label>Clinical reason</label><textarea class="inp" id="lrr" placeholder="e.g. fever 3 days, rule out malaria"></textarea></div>
    <div class="field"><label>Expires after</label><select class="inp"><option>14 days</option><option>7 days</option><option>30 days</option></select></div>
    <button class="btn" onclick="A.sendLR()">${ic('send')} Send to patient</button><p class="small muted mt">The patient chooses the lab and pays. You see each status, and results only if the patient forwards them.</p></div>
  <div class="card"><h3>Sent requests</h3>${mine.map(r=>{ const o=S.labOrders.find(x=>x.rid===r.id); return `<div class="li"><span class="ic purple">${ic('flask-conical')}</span><div class="grow"><div class="t small">${pat(r.pid).name} · ${r.tests.join(', ')}</div><div class="s">${fdt(r.at)}${o?' · '+lab(o.lid).name+' · '+o.status:''}</div></div>${badgeFor(o&&o.shared&&o.shared.includes(DID)?'Shared':r.status)}</div>`; }).join('')}</div></div>`;
};
A.sendLR = () => { const tests=S.tabs.lrsel; if(!tests.length) return toast('Choose at least one test','red'); const pid=$('#lrp').value; const id=uid('LR'); S.labRequests.unshift({id, pid, did:DID, tests:[...tests], reason:$('#lrr').value||'Clinical review', at:new Date().toISOString(), status:'Requested', expires:new Date(Date.now()+14*864e5).toISOString()}); S.tabs.lrsel=[]; notify(pid,doc(DID).name+' sent you a lab request.','#/app/p/labrequests/'+id,'lab'); audit('Sent lab request', id); save(); toast('Request sent. The patient gets an alert in plain words.','green'); rerender(); };

/* letters */
R['d/letters'] = (pid) => { const pts=[...new Set(myAppts().map(a=>a.pid))].map(pat); const k=tabOf('let','ref'); const p=pat(pid||pts[0].id);
  const body={ref:`Dear colleague,\n\nI am referring ${p.name} (${age(p.dob)} y, ${p.id}) for specialist review.\n\nHistory: ${p.conditions.join(', ')}.\nCurrent medicines: ${p.meds.join(', ')||'none'}.\nAllergies: ${p.allergies.join(', ')}.\n\nReason for referral: \n\nKind regards,\n${doc(DID).name} (${doc(DID).lic})`, sick:`This is to certify that ${p.name} was seen on ${fdate(new Date().toISOString())} and is unfit for work for 3 days, returning on ${fdate(new Date(Date.now()+3*864e5).toISOString())}.\n\n${doc(DID).name}`, cert:`MEDICAL CERTIFICATE\n\n${p.name}, born ${fdate(p.dob)}, has been examined and found medically fit for employment.\n\n${doc(DID).name} (${doc(DID).lic})`, fu:`Follow-up for ${p.name}: review in 4 weeks with fasting glucose and BP log.`}[k];
  return ph('Orders','Referrals, sick notes & certificates', tabs('let',[['ref','Referral letter'],['sick','Sick note'],['cert','Medical certificate'],['fu','Follow-up']],k)) + `<div class="grid g-21"><div class="card"><div class="field"><label>Patient</label><select class="inp" onchange="go('#/app/d/letters/'+this.value)">${pts.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${x.name}</option>`).join('')}</select></div>${k==='ref'?`<div class="field"><label>To</label><select class="inp"><option>Dr. Daniel Kiggundu — Cardiologist</option><option>Mulago National Referral Hospital</option><option>Dr. Agnes Auma — Obstetrician</option></select></div>`:''}<div class="field"><label>Letter</label><textarea class="inp" style="min-height:260px">${body}</textarea></div><div class="row"><button class="btn" onclick="audit('Letter issued','${p.id}');toast('Signed and sent to the patient’s records','green')">${ic('pen-tool')} Sign & send</button><button class="btn ghost" onclick="window.print()">${ic('printer')} Print</button></div></div><div class="card"><h3>Reminders</h3><div class="li"><span class="ic teal">${ic('bell')}</span><div class="grow small">Medicine refill reminder 5 days before running out</div><label class="switch"><input type="checkbox" checked><span></span></label></div><div class="li"><span class="ic teal">${ic('bell')}</span><div class="grow small">Repeat HbA1c in 3 months</div><label class="switch"><input type="checkbox" checked><span></span></label></div></div></div>`; };

/* video */
R['d/video'] = () => { const v=myAppts().filter(a=>a.type==='Video'&&!['Done','Cancelled'].includes(a.status)); return ph('Clinic','Video consultations') + `<div class="grid g-21"><div class="card"><div class="video"><div style="text-align:center">${ic('video')}<div class="mt">Pre-join check</div><div class="small" style="opacity:.7">Camera, microphone and network</div><button class="btn teal mt" onclick="A.camera2()">Test my camera</button></div><div class="self" id="selfv2">${ic('user')}</div></div><div class="row wrap mt">${['Network: 4G · 12 Mbps','Mic OK','Speaker OK'].map(x=>`<span class="badge green">${ic('check')} ${x}</span>`).join('')}</div></div><div class="card"><h3>Waiting for video</h3>${v.map(a=>`<div class="li">${av(pat(a.pid).name,'sm')}<div class="grow"><div class="t small">${pat(a.pid).name}</div><div class="s">${fdt(a.at)}</div></div><button class="btn sm teal" onclick="A.joinVideo('${a.id}')">Join</button></div>`).join('')||'<div class="empty">None</div>'}<div class="note mt small">${ic('lock')}<div>Each appointment gets its own unguessable room (Jitsi Meet).</div></div></div></div>`; };
A.camera2 = async () => { try{ const s=await navigator.mediaDevices.getUserMedia({video:true}); window.__stream=s; const el=$('#selfv2'); el.innerHTML='<video autoplay muted playsinline></video>'; el.firstChild.srcObject=s; toast('Camera working','green'); }catch(e){ toast('Camera not available or permission refused','red'); } };

/* availability */
R['d/availability'] = () => { const days=S.avail||(S.avail=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>({d,on:i<6,s:'08:00',e:i===5?'13:00':'17:00',video:i<5})));
  return ph('Practice','Availability',`<button class="btn" onclick="save();audit('Availability updated','d1');toast('Saved. Patients only see slots inside these hours.','green')">${ic('save')} Save</button>`) + `<div class="card">${days.map((x,i)=>`<div class="li"><label class="switch"><input type="checkbox" ${x.on?'checked':''} onchange="S.avail[${i}].on=this.checked;rerender()"><span></span></label><b style="width:48px">${x.d}</b><div class="row wrap grow ${x.on?'':'lock'}"><input class="inp" type="time" value="${x.s}" style="width:130px" onchange="S.avail[${i}].s=this.value"> to <input class="inp" type="time" value="${x.e}" style="width:130px" onchange="S.avail[${i}].e=this.value"><label class="check small"><input type="checkbox" ${x.video?'checked':''}> Video hours</label></div></div>`).join('')}</div>
  <div class="card mt"><h3>Blocked dates</h3><div class="row wrap"><input class="inp" type="date" style="width:180px" id="bd"><button class="btn ghost" onclick="toast('Date blocked. Existing patients will be asked to reschedule.','green')">Block date</button></div><div class="row wrap mt">${['24 Dec 2026 — Christmas Eve','25 Dec 2026 — Christmas','26 Dec 2026 — Boxing Day'].map(x=>`<span class="badge">${x}</span>`).join('')}</div></div>
  <div class="card mt"><h3>Fees & visit types</h3><div class="grid g3">${[['App consultation (chat / call / video)',35000],['In person at hospital',35000],['Home visit',60000]].map(([k,v])=>`<div class="field"><label>${k} (UGX)</label><input class="inp" type="number" value="${v}"></div>`).join('')}</div></div>`; };

/* earnings */

  return ph('Practice','Earnings',`<button class="btn green" onclick="A.payout()">${ic('arrow-down-to-line')} Request payout</button>`) + `<div class="grid g4 mb">${stat('This month',ugx(4850000),'banknote','green','<span class="up">+12%</span>')}${stat('Consultations','96','stethoscope','blue')}${stat('Video calls','31','video','teal')}${stat('Pending payout',ugx(1240000),'hourglass','amber')}</div>
  <div class="grid g-21"><div class="card"><h3>This week</h3><div style="height:260px"><canvas id="earn"></canvas></div></div><div class="card"><h3>Reviews · 4.9 ★</h3>${S.reviews.map(r=>`<div class="li"><div class="grow"><div class="small">${stars(r.stars)} <b>${r.by}</b></div><div class="small t2">“${r.text}”</div></div></div>`).join('')}<p class="small muted mt">Platform service fee: 10%.</p></div></div>`; };
