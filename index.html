A.scText = (ctx, text) => {
  text=(text||'').trim(); const st=scState(ctx); st.text=text; if(!text) return;
  const id=scDetect(text);
  if(id==='EMERGENCY'){ st.cid=KB[0].id; st.danger=['breath']; st.step='result'; st.cid = /chest/i.test(text)?'chest':/bleed/i.test(text)?'injury':/suicid|kill myself|harm/i.test(text)?'mental':/stroke|droop|slurred|one side/i.test(text)?'bp':/fit|seiz|convuls/i.test(text)?'child':'cough'; if(/suicid|kill myself|harm/i.test(text)) st.danger=['harm']; save(); rerender(); return; }
  if(!id){ const m=$('#scmsg'); if(m){ m.innerHTML=`<div class="note warn mb">${ic('help-circle')}<div>I didn’t recognise that. Please choose the closest one below, or try other words (e.g. “fever”, “cough”, “stomach pain”).</div></div>`; lucide.createIcons(); } return; }
  A.scPick(ctx,id);
};
A.scPick = (ctx, id) => { if(ctx==='pub' && scFreeLeft()<=0){ modal('Free checks used for today', `<p>You have used today’s 5 free checks on this device. They reset tomorrow. Create a free account for unlimited checks — or, if this is urgent, go to <a href="#/emergency" onclick="closeModal()">Emergency</a>.</p>`, `<a class="btn ghost" href="#/emergency" onclick="closeModal()">Emergency</a><a class="btn" href="#/register" onclick="closeModal()">Create free account</a>`); return; }
  A.scSet(ctx,{cid:id, answers:{}, danger:[], step:'questions'}); };
A.scFinish = ctx => { if(ctx==='pub'){ scFreeLeft(); S.tabs.scUsed=(S.tabs.scUsed||0)+1; } const st=scState(ctx); S.scLog=(S.scLog||[]); S.scLog.unshift({at:new Date().toISOString(), cid:st.cid, lvl:scCompute(st).lvl, anon:ctx==='pub'}); A.scSet(ctx,{step:'result'}); };
A.scSave = (ctx, toDoc) => { const st=scState(ctx); const r=scCompute(st); S.consultations.push({id:uid('C'), pid:'P-10231', by:'Symptom check (self-reported)', at:new Date().toISOString(), complaint:scKB(st.cid).label+(st.text?' — "'+st.text+'"':''), findings:'Self-reported answers: '+Object.entries(st.answers).map(([q,a])=>scKB(st.cid).qs.find(x=>x.id===q).o[a][0]).join('; '), dx:'Not a diagnosis — advice level: '+LEVELS[r.lvl].k, plan:'Suggested: '+r.spec+(r.tests.length?'; tests: '+r.tests.join(', '):'')});
  if(toDoc){ S.shares.unshift({id:uid('S'), what:'Symptom check — '+scKB(st.cid).label, to:'Dr. Ruth Nalwoga (Doctor)', at:new Date().toISOString(), revoked:null}); }
  audit(toDoc?'Symptom check shared with doctor':'Symptom check saved','P-10231'); save(); toast(toDoc?'Sent to Dr. Ruth Nalwoga. You can withdraw access in Records.':'Saved to your records','green'); };
A.scShare = () => { const txt='I used the MB Musawo symptom check. Try it free: '+location.origin+location.pathname+'#/symptom-check'; if(navigator.share) navigator.share({title:'MB Musawo symptom check', text:txt}).catch(()=>{}); else { try{ navigator.clipboard.writeText(txt); toast('Link copied — paste it in WhatsApp','green'); }catch(e){ toast(txt,'blue'); } } };

/* real voice input where the browser supports it */
A.voice = (inputId) => { const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ toast('Voice input is not supported in this browser. Try Chrome on Android.','red'); return; }
  const r=new SR(); r.lang = S.lang==='sw'?'sw-KE':S.lang==='lg'?'lg-UG':'en-UG'; r.interimResults=false; toast('Listening… speak now','blue');
  r.onresult=e=>{ const t=e.results[0][0].transcript; const el=document.getElementById(inputId); if(el){ el.value=t; el.form?.requestSubmit?.(); } };
  r.onerror=e=>toast('Could not hear you ('+e.error+'). Please type instead.','red'); r.start(); };

/* override chat answers to use the same knowledge base */
A.ask = (ctx, text) => {
  text=(text||'').trim(); if(!text) return;
  const log=S['chat_'+ctx]; log.push({me:true, html:esc(text)});
  log.push({me:false, html:'<span class="typing"><span></span><span></span><span></span></span>', tmp:true}); rerender();
  setTimeout(()=>{
    log.pop(); const id=scDetect(text);
    if(id==='EMERGENCY'){ log.push({me:false, html:`<b style="color:var(--red)">${ic('siren')} This could be an emergency.</b><br>Please call an ambulance (0800 100 066) or go to the nearest hospital now.<br><a class="btn red sm mt" href="#/${ctx==='pub'?'emergency':'app/p/sos'}">Open Emergency</a>`}); }
    else if(!id){ log.push({me:false, html:`I’m not sure I understood. Could you say the main problem in a few words — for example “fever”, “cough”, “stomach pain”, “rash” or “feeling low”? You can also use the <b>guided check</b> above.`}); }
    else { const k=scKB(id); const r=scCompute({cid:id, answers:{}, danger:[], profile:{}}); const L=LEVELS[r.lvl];
      log.push({me:false, html:`It sounds like <b>${k.label.toLowerCase()}</b>. Common reasons include ${r.causes.slice(0,3).join(', ').toLowerCase()}.<div class="card flat mt" style="padding:10px"><span class="badge ${L.c}">${L.k}</span><div class="small mt">Suggested: <b>${r.spec}</b>${r.tests.length?' · tests: '+r.tests.map(c=>test(c).name).join(', '):''}</div><div class="small mt"><b>Now:</b> ${k.care[0]}</div><div class="small" style="color:var(--red)"><b>Go to hospital if:</b> ${k.watch[0].toLowerCase()}.</div></div><button class="btn sm mt" onclick="A.scPick('${ctx==='pub'?'pub':'p'}','${id}');S.tabs.scmode='guided';save();rerender()">Answer ${k.qs.length} quick questions for better advice</button>${AI_DISCLAIMER}`}); }
    save(); rerender();
  }, 800);
};

/* pages */
R['pub/symptom-check'] = () => { const mode=tabOf('scmode','guided'); AFTER.push(()=>{ const c=$('#chat'); if(c) c.scrollTop=c.scrollHeight; });
  return `<section class="section"><div class="wrap" style="max-width:900px">
  <div class="row between wrap"><div><div class="eyebrow">Free · private · no sign-in</div><h2>Symptom check</h2><p class="muted mb0">Answer a few questions. Get advice on how urgent it is, who to see and what tests may help. ${scFreeLeft()} free checks left today.</p></div>${tabs('scmode',[['guided','Guided check'],['chat','Chat']],mode)}</div>
  <div class="mt">${mode==='guided'?symptomChecker('pub'):chatUI('pub')}</div>
  <div class="note mt">${ic('info')}<div>This is guidance, <b>not a diagnosis</b>, and never gives medicine doses. If you have chest pain, trouble breathing, heavy bleeding, fits or signs of stroke, go to <a href="#/emergency">Emergency</a> now. What you type is not stored for visitors who are not signed in.</div></div>
</div></section>`; };
R['p/assistant'] = () => { const mode=tabOf('scmode','guided'); AFTER.push(()=>{ const c=$('#chat'); if(c) c.scrollTop=c.scrollHeight; });
  const hist=(S.scLog||[]).filter(x=>!x.anon).slice(0,5);
  return ph('Care',t('Check symptoms'), tabs('scmode',[['guided','Guided check'],['chat','Chat']],mode)) + `<div class="grid g-21"><div>${mode==='guided'?symptomChecker('p'):chatUI('p')}</div>
  <div class="col"><div class="card"><h3>${ic('shield-check')} Safety rules</h3><ul class="small t2" style="padding-left:18px;margin:0"><li>Danger signs are checked first.</li><li>Guidance only — never a diagnosis.</li><li>Never gives medicine doses.</li><li>Reviewed by clinicians before launch.</li></ul></div>
  <div class="card"><h3>Recent checks</h3>${hist.map(h=>`<div class="li"><span class="ic ${LEVELS[h.lvl].c}">${ic(scKB(h.cid).icon)}</span><div class="grow"><div class="t small">${scKB(h.cid).label}</div><div class="s">${LEVELS[h.lvl].k} · ${ago(h.at)}</div></div></div>`).join('')||'<p class="small muted">None yet</p>'}</div></div></div>`; };
R['d/assistant'] = () => ph('Practice','Symptom check (patient view)') + `<div class="note mb">${ic('info')}<div>This is what patients see. Use it to explain advice, or try the chat for quick triage suggestions.</div></div>` + symptomChecker('d');

</script>
<script>
/* MB Musawo — extra features: home readings, reminders, immunisation, library, help, USSD, investors, feedback, outreach, privacy, SaaS */

/* ---------- patient: home readings ---------- */
function seedReadings(){ if(S.readings) return S.readings; const r=[]; for(let i=20;i>=0;i-=2){ const d=new Date(Date.now()-i*864e5).toISOString(); r.push({at:d, sys:118+Math.round(Math.random()*12), dia:72+Math.round(Math.random()*8), glu:+(4.8+Math.random()*1.2).toFixed(1), wt:+(67+Math.random()*1.5).toFixed(1), temp:+(36.5+Math.random()*.5).toFixed(1)}); } S.readings=r; return r; }
R['p/vitals'] = () => { const r=seedReadings(); const last=r[r.length-1];
  chart('vbp',{type:'line',data:{labels:r.map(x=>fdate(x.at,{day:'numeric',month:'short'})),datasets:[{label:'Systolic',data:r.map(x=>x.sys),borderColor:'#E5484D',tension:.35},{label:'Diastolic',data:r.map(x=>x.dia),borderColor:'#1941BA',tension:.35}]}});
  chart('vglu',{type:'line',data:{labels:r.map(x=>fdate(x.at,{day:'numeric',month:'short'})),datasets:[{label:'Glucose (mmol/L)',data:r.map(x=>x.glu),borderColor:'#316FF6',backgroundColor:'rgba(49,111,246,.12)',fill:true,tension:.35}]}});
  const bpFlag = last.sys>=140||last.dia>=90;
  return ph('My health','Home readings',`<button class="btn" onclick="A.addReading()">${ic('plus')} Add reading</button>`) + `
  <div class="grid g4 mb">${stat('Blood pressure',`${last.sys}/${last.dia}`,'heart-pulse',bpFlag?'red':'green',bpFlag?'<span class="down">High — see a doctor</span>':'Normal range')}${stat('Glucose',last.glu+' mmol/L','droplet','teal','Fasting')}${stat('Weight',last.wt+' kg','scale','blue','BMI '+bmi(pat(ME).height,last.wt))}${stat('Temperature',last.temp+' °C','thermometer','warm')}</div>
  <div class="grid g2"><div class="card"><h3>Blood pressure</h3><div style="height:230px"><canvas id="vbp"></canvas></div></div><div class="card"><h3>Blood sugar</h3><div style="height:230px"><canvas id="vglu"></canvas></div></div></div>
  <div class="note mt">${ic('share-2')}<div>Your doctor sees these readings only if you share them. Pregnant women: BP of 140/90 or higher needs a same-day check.</div></div>`; };
A.addReading = () => modal('Add a reading', `<div class="grid g2" style="gap:10px">${[['sys','Systolic BP','120'],['dia','Diastolic BP','80'],['glu','Glucose (mmol/L)','5.2'],['wt','Weight (kg)','68'],['temp','Temperature (°C)','36.7']].map(([k,l,v])=>`<div class="field"><label>${l}</label><input class="inp rd" data-k="${k}" type="number" step="0.1" value="${v}"></div>`).join('')}</div><p class="small muted">Tip: rest 5 minutes before measuring BP. Bluetooth BP cuffs and glucometers can sync automatically (planned).</p>`, `<button class="btn" onclick="A.saveReading()">Save</button>`);
A.saveReading = () => { const o={at:new Date().toISOString()}; $$('.rd').forEach(i=>o[i.dataset.k]=parseFloat(i.value)); seedReadings().push(o); closeModal();
  queueOrRun('Home reading',()=>{ save(); if(o.sys>=180||o.dia>=110) modal('Very high blood pressure',`<div class="note red">${ic('siren')}<div>${o.sys}/${o.dia} is very high. If you have headache, chest pain, blurred vision or weakness, go to a hospital now. Otherwise rest 5 minutes and measure again, then contact a doctor today.</div></div>`,`<a class="btn red" href="#/app/p/sos" onclick="closeModal()">Emergency</a><a class="btn" href="#/app/p/book/d1" onclick="closeModal()">See a doctor today</a>`); else if(o.sys>=140||o.dia>=90) toast('BP is high. Measure again tomorrow; book a doctor if it stays high.','red'); else toast('Reading saved','green'); rerender(); }); };

/* ---------- patient: medicine reminders ---------- */
function myMeds(){ if(!S.medPlan) S.medPlan=[{name:'Ferrous sulphate + Folic acid', time:'08:00', freq:'Daily', left:6, taken:{}}, {name:'Sulfadoxine-pyrimethamine (IPTp)', time:'09:00', freq:'Monthly at ANC', left:1, taken:{}}]; return S.medPlan; }
R['p/meds'] = () => { const m=myMeds(); const today=new Date().toISOString().slice(0,10); const days=[...Array(7)].map((_,i)=>new Date(Date.now()-(6-i)*864e5).toISOString().slice(0,10));
  const adh = Math.round(m.reduce((s,x)=>s+days.filter(d=>x.taken[d]||d<today&&Math.random()>.15).length,0)/(m.length*7)*100);
  return ph('My health','Medicine reminders',`<button class="btn" onclick="A.addMed()">${ic('plus')} Add medicine</button>`) + `<div class="grid g3 mb">${stat('Taken on time (7 days)',adh+'%','check-circle-2','green')}${stat('Medicines',m.length,'pill','blue')}${stat('Refill soon',m.filter(x=>x.left<=7).length,'refresh-cw','amber','<a href="#/app/p/medicine">Order refill</a>')}</div>
  <div class="card">${m.map((x,i)=>`<div class="li"><span class="ic green">${ic('pill')}</span><div class="grow"><div class="t">${esc(x.name)}</div><div class="s">${x.freq} at ${x.time} · ${x.left} days left</div></div>${x.taken[today]?'<span class="badge green">Taken today ✓</span>':`<button class="btn sm green" onclick="S.medPlan[${i}].taken['${today}']=true;S.medPlan[${i}].left=Math.max(0,S.medPlan[${i}].left-1);save();toast('Well done!','green');rerender()">Mark taken</button>`}<button class="btn sm ghost" onclick="S.medPlan.splice(${i},1);save();rerender()">${ic('trash-2')}</button></div>`).join('')||'<div class="empty">No medicines yet</div>'}</div>
  <div class="card mt"><h3>Reminders by</h3><div class="row wrap">${['Push notification','SMS','WhatsApp','Voice call (Luganda)'].map((x,i)=>`<label class="check"><input type="checkbox" ${i<3?'checked':''}> ${x}</label>`).join('')}</div><p class="small muted mb0">Messages say only “Time for your medicine” — never the medicine name.</p></div>`; };
A.addMed = () => modal('Add medicine', `<div class="field"><label>Medicine</label><input class="inp" id="mn" list="drugs2"><datalist id="drugs2">${S.meds.map(x=>`<option>${x.name}</option>`).join('')}</datalist></div><div class="grid g2" style="gap:10px"><div class="field"><label>Time</label><input class="inp" type="time" id="mt" value="20:00"></div><div class="field"><label>How often</label><select class="inp" id="mf"><option>Daily</option><option>Twice daily</option><option>Weekly</option><option>Every 3 months</option></select></div></div><div class="field"><label>Days of supply left</label><input class="inp" type="number" id="ml" value="30"></div><p class="small muted">Take medicines exactly as your doctor or pharmacist told you.</p>`, `<button class="btn" onclick="myMeds().push({name:$('#mn').value||'Medicine',time:$('#mt').value,freq:$('#mf').value,left:+$('#ml').value,taken:{}});save();closeModal();rerender()">Save</button>`);

/* ---------- patient: child immunisation (Uganda national schedule) ---------- */
const UNEPI = [['At birth','BCG, Polio 0 (OPV0), Hepatitis B birth dose',0],['6 weeks','Polio 1, DPT-HepB-Hib 1, PCV 1, Rotavirus 1',6],['10 weeks','Polio 2, DPT-HepB-Hib 2, PCV 2, Rotavirus 2',10],['14 weeks','Polio 3, IPV, DPT-HepB-Hib 3, PCV 3',14],['6 months','Vitamin A (then every 6 months), Malaria vaccine 1 (where offered)',26],['9 months','Measles-Rubella 1, Yellow fever',39],['18 months','Measles-Rubella 2',78],['10 years (girls)','HPV vaccine',520]];
R['p/immunise'] = () => { const kids=S.kids||(S.kids=[{name:'Brian Mukasa',dob:new Date(Date.now()-16*7*864e5).toISOString().slice(0,10),done:4}]);
  return ph('My health','Child immunisation',`<button class="btn" onclick="A.addKid()">${ic('user-plus')} Add child</button>`) + kids.map((k,ki)=>{ const wk=Math.floor((Date.now()-new Date(k.dob))/604800000); return `<div class="card mb"><div class="row">${av(k.name)}<div class="grow"><b>${esc(k.name)}</b><div class="small muted">Born ${fdate(k.dob)} · ${wk} weeks old</div></div><span class="badge ${k.done>=UNEPI.filter(u=>u[2]<=wk).length?'green':'amber'}">${k.done>=UNEPI.filter(u=>u[2]<=wk).length?'Up to date':'Due now'}</span></div>
  <div class="mt">${UNEPI.map(([when,what,w],i)=>{ const done=i<k.done; const due=!done&&w<=wk; const date=new Date(new Date(k.dob).getTime()+w*7*864e5); return `<div class="li"><span class="ic ${done?'green':due?'red':''}">${ic(done?'check':due?'alert-circle':'calendar')}</span><div class="grow"><div class="t small">${when} — ${what}</div><div class="s">${done?'Given':due?'Overdue since '+fdate(date.toISOString()):'Due '+fdate(date.toISOString())}</div></div>${!done&&i===k.done?`<button class="btn sm" onclick="S.kids[${ki}].done++;save();toast('Recorded. Next reminder set.','green');rerender()">Mark given</button>`:''}</div>`; }).join('')}</div></div>`; }).join('') + `<p class="small muted">Based on the Uganda national immunisation schedule — confirm with your health worker. Reminders go by SMS/WhatsApp 3 days before.</p>`; };
A.addKid = () => modal('Add child', `<div class="field"><label>Name</label><input class="inp" id="kn"></div><div class="field"><label>Date of birth</label><input class="inp" type="date" id="kd"></div><div class="field"><label>Vaccines already given (from the child health card)</label><select class="inp" id="kg">${UNEPI.map((u,i)=>`<option value="${i}">Up to: ${u[0]}</option>`).join('')}<option value="${UNEPI.length}">All</option></select></div>`, `<button class="btn" onclick="S.kids.push({name:$('#kn').value||'Child',dob:$('#kd').value||new Date().toISOString().slice(0,10),done:+$('#kg').value});save();closeModal();rerender()">Add</button>`);

/* ---------- patient: queue ticket ---------- */
R['p/queue'] = () => { const pos=S.tabs.qpos??3; return ph('Care','My queue ticket') + `<div class="grid g2"><div class="card" style="text-align:center;padding:32px"><div class="small muted">MB Musawo Ntinda · General OPD</div><div style="font-size:64px;font-weight:800;letter-spacing:-.03em;color:var(--blue)">A-${String(40+pos).padStart(3,'0')}</div><div class="badge blue">${pos?pos+' people ahead of you':'It’s your turn — Room 3'}</div><div class="bar mt" style="max-width:300px;margin:16px auto 0"><i style="width:${(5-pos)/5*100}%"></i></div><p class="small muted mt">Estimated wait: ~${pos*7} min. We’ll SMS you 2 people before your turn — you can wait outside or nearby.</p><button class="btn ghost" onclick="S.tabs.qpos=Math.max(0,${pos}-1);save();rerender()">${ic('refresh-cw')} Refresh</button></div>
  <div class="card"><h3>Check in from your phone</h3><p class="small t2">When you arrive, scan the QR code at reception or tap below. No paper, no long line.</p><button class="btn" onclick="S.tabs.qpos=3;save();toast('Checked in at Ntinda. Ticket A-043.','green');rerender()">${ic('qr-code')} I have arrived</button><div class="divider"></div><h4>Your visit today</h4>${['Registered','Triage (nurse)','Doctor','Lab (if needed)','Pharmacy'].map((x,i)=>`<div class="li"><span class="ic ${i<1?'green':i===1?'blue':''}">${ic(i<1?'check':'circle')}</span><div class="grow small">${x}</div></div>`).join('')}</div></div>`; };

/* ---------- health library (public + patient) ---------- */
const ARTICLES = [
  ['malaria','Malaria: test before you treat','thermometer','Fever in Uganda should be tested for malaria the same day. A rapid test takes 15 minutes. Do not use leftover medicine. Sleep under a treated net every night — especially pregnant women and children under 5. Danger signs: confusion, fits, yellow eyes, dark urine, cannot drink.'],
  ['fp','Family planning methods compared','heart-handshake','Implants last 3–5 years and are over 99% effective. A copper IUD lasts up to 12 years. Injectables (including self-injection DMPA-SC) last 3 months. Pills are taken daily. Condoms also protect against HIV and STIs. All methods are reversible except sterilisation. Talk to a provider privately to choose.'],
  ['anc','Antenatal care: the 8 contacts','baby','Start antenatal care before 12 weeks. WHO recommends at least 8 contacts. At visits you get blood pressure checks, iron and folic acid, malaria prevention (IPTp), HIV and syphilis tests and an ultrasound. Go to hospital at once for bleeding, severe headache, fits or reduced baby movement.'],
  ['bp','High blood pressure: the silent killer','heart-pulse','Most people with high blood pressure feel nothing. Check yours at least once a year after age 18. Eat less salt, move every day, limit alcohol and take medicines daily if prescribed — even when you feel fine.'],
  ['diabetes','Living well with diabetes','candy','Check your sugar as advised, take medicines daily, eat more vegetables and fewer sugary drinks, walk 30 minutes a day, and check your feet every day for wounds.'],
  ['mental','Your mental health matters','cloud-rain','Feeling low, worried or unable to sleep for more than two weeks is common and treatable. Talk to someone you trust and to a health worker. If you have thoughts of ending your life, go to a health facility or call for help now.'],
  ['hiv','HIV testing and prevention','shield-plus','Testing is free, quick and confidential. If you are HIV negative and at risk, ask about PrEP. If positive, treatment works — people on treatment live long, healthy lives and do not pass HIV to partners when the virus is suppressed.'],
  ['child','Danger signs in children under 5','baby','Go to a health facility at once if your child cannot drink or breastfeed, vomits everything, has fits, is very sleepy or breathes fast. Keep immunisations up to date and give ORS and zinc for diarrhoea.']
];
function libraryHtml(pub){ const q=(S.tabs.libq||'').toLowerCase(); return `<div class="row wrap mb"><input class="inp" style="max-width:340px" placeholder="Search health topics" value="${esc(S.tabs.libq||'')}" onchange="S.tabs.libq=this.value;rerender()"><span class="small muted">Reviewed by MB Musawo clinicians · English (Luganda & Kiswahili coming)</span></div><div class="grid g3">${ARTICLES.filter(a=>!q||(a[1]+a[3]).toLowerCase().includes(q)).map(([id,t,i,b])=>`<div class="feat" style="cursor:pointer" onclick="A.article('${id}')"><span class="ic teal">${ic(i)}</span><h3>${t}</h3><p class="small t2 mb0">${b.slice(0,110)}…</p></div>`).join('')}</div>`; }
A.article = id => { const a=ARTICLES.find(x=>x[0]===id); modal(a[1], `<p>${a[3]}</p><div class="note small">${ic('info')}<div>General health information, not a diagnosis. For advice about you, use the symptom check or see a doctor.</div></div>`, `<button class="btn ghost" onclick="A.scShare()">${ic('share-2')} Share</button><a class="btn" href="${S.role==='p'&&route()[0]==='app'?'#/app/p/assistant':'#/symptom-check'}" onclick="closeModal()">Symptom check</a>`); };
R['p/learn'] = () => ph('My health','Health library') + libraryHtml(false);
R['pub/learn'] = () => `<section class="section"><div class="wrap"><div class="eyebrow">Health library</div><h2>Trusted health information in plain words</h2>${libraryHtml(true)}</div></section>`;

/* ---------- help & support (all roles) ---------- */
R['common/help'] = () => { const log=S.support||(S.support=[{me:false,t:'Hello! This is MB Musawo support. How can we help? We reply within 5 minutes, 7am–10pm.'}]);
  return ph('Account','Help & support') + `<div class="grid g-21"><div class="col"><div class="card"><h3>Frequently asked</h3><div class="faq">${[['How do I pay with Mobile Money?','Choose MTN MoMo or Airtel Money at checkout. A prompt appears on your phone — enter your PIN to approve. You get an SMS receipt.'],['How do I get a refund?','Go to Payments and tap “Request refund” next to the payment. Refunds go back to your Mobile Money within 24–72 hours.'],['Who can see my results?','Only you, until you forward them. Every view is logged in Records.'],['I forgot my phone / changed my number','Contact support. We verify your identity before moving your account.'],['Can I use MB Musawo without internet?','Emergency numbers, saved records and appointments open offline. For no smartphone, dial *284*88# or use WhatsApp.']].map(([q,a])=>`<details><summary>${q}</summary><p class="t2 mt mb0 small">${a}</p></details>`).join('')}</div></div>
    <div class="card"><h3>Report a problem</h3><div class="field"><label>Type</label><select class="inp" id="rpt"><option>App not working</option><option>Payment problem</option><option>Complaint about a provider</option><option>Privacy concern</option><option>Wrong information</option></select></div><div class="field"><label>Details</label><textarea class="inp" id="rpd"></textarea></div><button class="btn" onclick="audit('Support ticket: '+$('#rpt').value,'ticket');toast('Ticket TCK-'+Math.floor(1000+Math.random()*9000)+' created. We will reply by SMS.','green');$('#rpd').value=''">Submit</button></div></div>
  <div class="col"><div class="card"><h3>${ic('message-circle')} Chat with support</h3><div class="chat" style="height:300px">${log.map(m=>`<div class="msg ${m.me?'me':'bot'}">${esc(m.t)}</div>`).join('')}</div><form class="row mt" onsubmit="event.preventDefault();if(!this.q.value)return;S.support.push({me:true,t:this.q.value});S.support.push({me:false,t:'Thanks — an agent (Joan) has picked this up and will reply shortly.'});save();rerender()"><input class="inp" name="q" placeholder="Type a message"><button class="btn">${ic('send')}</button></form></div>
    <div class="card"><h3>Other ways</h3><a class="li" style="color:var(--text)" href="tel:+256700000000"><span class="ic blue">${ic('phone')}</span><div class="grow small">Call +256 700 000 000 (sample)</div></a><a class="li" style="color:var(--text)" href="#/ussd"><span class="ic green">${ic('message-square')}</span><div class="grow small">WhatsApp & USSD *284*88#</div></a></div></div></div>`; };

A.att = (input, slot) => { const f=input.files&&input.files[0]; if(!f) return; if(!/^image\//.test(f.type)) return toast('Please choose a photo','red');
  window['__busy_'+slot]=true; const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=()=>{ window['__busy_'+slot]=false; const k=Math.min(1,900/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); window['__att_'+slot]=cv.toDataURL('image/jpeg',0.72); const el=document.getElementById(slot); if(el){ el.innerHTML=attPreview(slot); lucide.createIcons(); } }; img.onerror=()=>{ window['__busy_'+slot]=false; toast('Could not read that photo','red'); }; img.src=fr.result; }; fr.readAsDataURL(f); input.value=''; };

    ${asStaff&&ap&&ap.status!=='Done'?`<div class="row mt"><button class="btn sm green" onclick="A.finishConsult('${ap.id}')">${ic('check')} Finish consultation</button><a class="btn sm ghost" href="#/app/d/rx/${p.id}">Prescribe</a><a class="btn sm ghost" href="#/app/d/labreq/${p.id}">Request tests</a></div>`:''}</div></div>`;
}
A.send = (tid, asStaff) => { if(window.__busy_mprev) return toast('Photo still loading — tap send again in a second','blue'); const th=S.threads.find(x=>x.id===tid); const text=$('#mtext').value.trim(); const img=window.__att_mprev; if(!text&&!img) return toast('Type a message or add a photo','red');
  th.msgs.push({from:asStaff?'s':'p', name:asStaff?me().name:undefined, text, img:img||null, at:new Date().toISOString()}); window.__att_mprev=null; th.at=new Date().toISOString();
  if(asStaff) th.unreadP=(th.unreadP||0)+1; else th.unreadStaff=(th.unreadStaff||0)+1;
  audit(asStaff?'Staff replied to patient message':'Patient sent message'+(img?' with photo':''), tid); save(); rerender();
  if(!asStaff) setTimeout(()=>{ th.msgs.push({from:'s', name:th.staff, text:img?`Thank you, I have received your photo. ${th.to==='Doctor'?'I am looking at it now.':'A '+th.to.toLowerCase()+' team member is checking it.'}`:`Thank you — ${th.staff} has seen your message and will reply shortly.`, at:new Date().toISOString()}); save(); if(location.hash.includes(tid)) rerender(); }, 1800); };
R['p/messages'] = (tid) => { if(tid){ const th=S.threads.find(x=>x.id===tid); return ph(`<a href="#/app/p/messages">${t('Messages & photos')}</a>`, th.to) + threadView(th,false); }
  const mine=S.threads.filter(x=>x.pid===ME).sort((a,b)=>new Date(b.at)-new Date(a.at));
  return ph('Get care', t('Messages & photos')) + `<h3>Send a message or photo to:</h3><div class="tiles small mb">${WHO.map(([k,i,c,s])=>`<button class="tile ${c}" onclick="A.newThread('${k}')">${ic(i)}<span>${k}</span><small>${s}</small></button>`).join('')}</div>
  <div class="card"><h3>My conversations</h3>${mine.map(th=>{ const last=th.msgs[th.msgs.length-1]; return `<a class="li" style="color:var(--text)" href="#/app/p/messages/${th.id}">${av(th.staff)}<div class="grow" style="min-width:0"><div class="t">${th.staff} <span class="small muted">· ${th.to}</span></div><div class="s trunc">${last.img?'📷 Photo · ':''}${esc(last.text||'')}</div></div><div class="col" style="align-items:flex-end;gap:4px"><span class="small muted">${ago(last.at)}</span>${th.unreadP?`<span class="pill">${th.unreadP}</span>`:''}</div></a>`; }).join('')||'<div class="empty">No messages yet</div>'}</div>
  <p class="small muted mt">${ic('info')} Messages are not for emergencies. For an emergency use the red Ambulance button.</p>`; };
A.newThread = to => { const staff={Doctor:'Doctor on duty',Nurse:'Sr. Grace Atim',Pharmacy:'Brenda Akello (Pharmacist)',Laboratory:'Central Lab team',Reception:'Reception — MB Musawo Ntinda'}[to]; const th={id:uid('T'), pid:ME, to, staff, at:new Date().toISOString(), msgs:[{from:'s', name:staff, text:`Hello! You are talking to the ${to.toLowerCase()} team. Write your question or send a photo — we usually reply within 15 minutes.`, at:new Date().toISOString()}]}; S.threads.unshift(th); save(); go('#/app/p/messages/'+th.id); };
R['common/inbox'] = (tid) => { const r=S.role; if(tid){ const th=S.threads.find(x=>x.id===tid); return ph(`<a href="#/app/${r}/inbox">Messages & photos</a>`, pat(th.pid).name) + threadView(th,true); }
  const box=roleBox[r]; const list=S.threads.filter(x=>!box||x.to===box||(r==='d'&&x.to==='Doctor')).sort((a,b)=>new Date(b.at)-new Date(a.at));
  return ph('Patients','Messages & photos', `<span class="badge blue">${list.filter(x=>x.unreadStaff).length} unread</span>`) + `<div class="note mb">${ic('camera')}<div>Patients can send photos (wounds, rashes, medicine boxes, test papers, meter readings) for easy explanation. Tap a photo to enlarge.</div></div><div class="card">${list.map(th=>{ const last=th.msgs[th.msgs.length-1]; const pic=[...th.msgs].reverse().find(m=>m.img); return `<a class="li" style="color:var(--text)" href="#/app/${r}/inbox/${th.id}">${av(pat(th.pid).name)}<div class="grow" style="min-width:0"><div class="t">${pat(th.pid).name} <span class="small muted">→ ${th.to}</span></div><div class="s trunc">${last.img?'📷 Photo · ':''}${esc(last.text||'')}</div></div>${pic?`<img src="${pic.img}" alt="" style="width:52px;height:40px;object-fit:cover;border-radius:8px">`:''}${th.unreadStaff?`<span class="pill">${th.unreadStaff}</span>`:''}</a>`; }).join('')||'<div class="empty">No messages</div>'}</div>`; };
A.finishConsult = aid => { const a=S.appointments.find(x=>x.id===aid); a.status='Done'; audit('App consultation finished', aid); notify(a.pid,'Your consultation is finished. Notes are in your records. Please rate your visit.','#/app/p/appointments','appt'); save(); toast('Consultation finished. Patient can rate the visit.','green'); rerender(); };

/* doctor: waiting app consultations (any doctor can take) */
R['d/consults'] = () => { const list=S.appointments.filter(a=>a.app && ['Waiting','In consultation'].includes(a.status));

  <div class="card">${list.map(a=>{ const p=pat(a.pid); const th=S.threads.find(x=>x.appt===a.id); return `<div class="li">${av(p.name)}<div class="grow"><div class="t">${p.name} <span class="small muted">· ${age(p.dob)} y</span></div><div class="s">${a.type} · ${esc(a.reason)} · waiting ${ago(a.at).replace(' ago','')}</div></div>${badgeFor(a.status==='Waiting'?'Requested':a.status)}${a.status==='Waiting'?`<button class="btn sm green" onclick="A.takeConsult('${a.id}')">Accept</button>`:''}${th?`<a class="btn sm" href="#/app/d/inbox/${th.id}">${ic('message-circle')} Chat</a>`:''}${a.type==='Video'?`<button class="btn sm teal" onclick="A.joinVideo('${a.id}')">${ic('video')}</button>`:''}${a.type==='Phone call'?`<a class="btn sm teal" href="tel:${p.phone.replace(/\s/g,'')}">${ic('phone')}</a>`:''}</div>`; }).join('')||'<div class="empty">No one waiting. Great job!</div>'}</div>`; };
A.takeConsult = aid => { const a=S.appointments.find(x=>x.id===aid); a.did=DID; a.status='In consultation'; const th=S.threads.find(x=>x.appt===aid); if(th) th.staff=doc(DID).name; audit('Consultation accepted', aid); save(); toast('You accepted the consultation','green'); rerender(); };
R['d/inbox'] = R['common/inbox'];

/* ---------- ambulances (each hospital owns its own) ---------- */
const AMB_FLOW = ['Requested','Dispatched','On scene','Going to hospital','Arrived at hospital','Completed'];
const ambProg = r => r.status!=='Dispatched'||!r.dispatchedAt ? (AMB_FLOW.indexOf(r.status)>1?1:0) : Math.min(1,(Date.now()-r.dispatchedAt)/90000);
const ambPos = (r,p) => { const f=r.from||{lat:r.lat,lng:r.lng}; return [f.lat+(r.lat-f.lat)*p, f.lng+(r.lng-f.lng)*p]; };
const ambIcon = () => L.divIcon({html:'<div class="amb-pin"><svg viewBox="0 0 24 24" fill="none" stroke="#E5484D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10H6"/><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.28a1 1 0 0 0-.684-.948l-1.923-.641a1 1 0 0 1-.578-.502l-1.539-3.076A1 1 0 0 0 16.382 8H14"/><path d="M8 8v4"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg></div>', className:'', iconSize:[36,36], iconAnchor:[18,18]});
function hospOptions(){ const me_=myLoc(); return S.branches.map(b=>({b, free:S.ambulances.filter(a=>a.branch===b.id&&a.status==='Available').length, total:S.ambulances.filter(a=>a.branch===b.id).length, km:kmBetween(me_,b)})).sort((a,b)=>a.km-b.km); }
R['p/ambulance'] = () => { const act=S.ambRequests.find(r=>r.pid===ME && !['Completed','Cancelled'].includes(r.status)) || (S.tabs.lastAmb && S.ambRequests.find(r=>r.id===S.tabs.lastAmb && r.status==='Completed' && !r.paid));
  if(act) return ambTrack(act);
  const st=S.tabs.amb||(S.tabs.amb={}); const opts=hospOptions(); if(!st.branch){ const f=opts.find(o=>o.free); st.branch=f?f.b.id:opts[0].b.id; }
  return ph('Get care', t('Ambulance')) + `<div class="grid g-21"><div class="card">
    <h3>1. What happened?</h3><div class="chips mb">${['Accident / injury','Labour / pregnancy','Can’t breathe','Unconscious / fainted','Chest pain','Fits','Bleeding a lot','Other'].map(x=>`<button class="chip ${st.reason===x?'on':''}" style="padding:11px 15px;font-size:15px" onclick="S.tabs.amb.reason='${x.replace(/'/g,'’')}';save();rerender()">${x}</button>`).join('')}</div>
    <h3>2. Where are you?</h3><div class="row wrap mb"><div class="grow"><input class="inp" id="aaddr" value="${esc(myLoc().label)}" aria-label="Address or landmark"></div><button class="btn ghost" onclick="A.locate()">${ic('locate-fixed')} Use my location</button></div>
    <h3>3. Which hospital’s ambulance?</h3><p class="small muted">Each hospital sends its own ambulances. Nearest first.</p>
    ${opts.map(o=>`<label class="role-card mb ${st.branch===o.b.id?'on':''}" style="cursor:${o.free?'pointer':'not-allowed'};opacity:${o.free?1:.55}"><input type="radio" name="hb" hidden ${o.free?'':'disabled'} onchange="S.tabs.amb.branch='${o.b.id}';save();rerender()"><span class="ic red">${ic('hospital')}</span><span class="grow">${hosp(o.b.id)}<small>${o.km} km away · ${o.free} of ${o.total} ambulances free</small></span>${o.free?'<span class="badge green">Available</span>':'<span class="badge">None free</span>'}</label>`).join('')}
    <div class="divider"></div><div class="row between wrap"><div class="small muted">Fee ${ugx(AMB_FEE)} within town — pay <b>after</b>, or by insurance. Never wait to pay in an emergency.</div><button class="btn red lg" ${st.reason?'':'disabled'} onclick="A.ambRequest()">${ic('siren')} Send ambulance now</button></div></div>
    <div class="col"><div class="card" style="text-align:center"><h3>Or call directly</h3><a class="btn red lg block" href="tel:0800100066">${ic('phone')} Ambulance 0800 100 066</a><a class="btn ghost block mt" href="tel:999">${ic('shield')} Police 999</a><a class="btn ghost block mt" href="tel:+256414540141">${ic('hospital')} Mulago Hospital</a></div>
    <div class="card"><h3>While you wait</h3><div class="chips">${Object.keys(FIRST_AID).map(x=>`<button class="chip" onclick="A.firstAid('${x}')">${x}</button>`).join('')}</div></div></div></div>`; };
A.locate = () => { if(!navigator.geolocation) return toast('Location not available — type your address','red'); toast('Finding your location…','blue');
  navigator.geolocation.getCurrentPosition(p=>{ S.myLoc={lat:p.coords.latitude, lng:p.coords.longitude, label:`My current location (${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)})`}; save(); rerender(); toast('Location found','green'); }, ()=>toast('Could not get location. Using your saved address — you can type a landmark.','red'), {timeout:7000}); };
A.ambRequest = () => { const st=S.tabs.amb; const L_=myLoc(); const addr=$('#aaddr').value||L_.label;
  const r={id:uid('ER'), pid:ME, branch:st.branch, reason:st.reason, addr, lat:L_.lat, lng:L_.lng, status:'Requested', at:new Date().toISOString(), fee:AMB_FEE, paid:false};
  S.ambRequests.unshift(r); S.tabs.amb=null; S.tabs.lastAmb=r.id; audit('Ambulance requested', r.id); save();
  toast('Request sent to '+hosp(r.branch)+'. Stay on the phone line open.','red'); if(navigator.vibrate) navigator.vibrate(200); rerender();
  setTimeout(()=>{ if(r.status==='Requested' && S.autoDispatch!==false){ const a=S.ambulances.find(x=>x.branch===r.branch&&x.status==='Available'); if(a){ A.ambAssign(r.id,a.id,true); } } }, 4000); };
A.ambAssign = (rid, aid, auto) => { const r=S.ambRequests.find(x=>x.id===rid), a=S.ambulances.find(x=>x.id===aid); if(!a||a.status!=='Available') return toast('That ambulance is not free','red');
  r.amb=aid; r.status='Dispatched'; r.dispatchedAt=Date.now(); r.from={lat:a.lat,lng:a.lng}; a.status='On job'; audit('Ambulance dispatched '+a.plate, rid); notify(r.pid, `Ambulance ${a.plate} from ${hosp(r.branch)} is on the way.`, '#/app/p/ambulance','info'); save();
  toast(`${hosp(r.branch)} accepted — ambulance ${a.plate} is coming.`,'green'); rerender(); };
A.ambNext = rid => { const r=S.ambRequests.find(x=>x.id===rid); const i=AMB_FLOW.indexOf(r.status); r.status=AMB_FLOW[Math.min(i+1,AMB_FLOW.length-1)];
  if(r.status==='Completed'){ const a=S.ambulances.find(x=>x.id===r.amb); if(a){ a.status='Available'; const b=branch(r.branch); a.lat=b.lat; a.lng=b.lng; } }
  audit('Ambulance trip: '+r.status, rid); notify(r.pid, `Ambulance update: ${r.status}.`, '#/app/p/ambulance','info'); save(); rerender(); };
A.ambCancel = rid => { const r=S.ambRequests.find(x=>x.id===rid); r.status='Cancelled'; const a=S.ambulances.find(x=>x.id===r.amb); if(a) a.status='Available'; audit('Ambulance request cancelled', rid); save(); toast('Request cancelled','blue'); rerender(); };
function ambTrack(r){ const a=S.ambulances.find(x=>x.id===r.amb); const p=ambProg(r); const i=AMB_FLOW.indexOf(r.status);
  if(r.status!=='Requested') leaflet('ambmap',[r.lat,r.lng],14,[{lat:r.lat,lng:r.lng,color:'#1941BA',r:11,popup:'You are here'},{lat:branch(r.branch).lat,lng:branch(r.branch).lng,color:'#316FF6',r:9,popup:hosp(r.branch)}], m=>{ window.__ambMarker=L.marker(ambPos(r,p),{icon:ambIcon()}).addTo(m); if(r.from) L.polyline([[r.from.lat,r.from.lng],[r.lat,r.lng]],{color:'#E5484D',weight:4,dashArray:'6 8'}).addTo(m); });
  AFTER.push(()=>{ clearInterval(window.__ambT); window.__ambT=setInterval(()=>{ const el=document.getElementById('amb-eta'); if(!el){ clearInterval(window.__ambT); return; } const p2=ambProg(r); if(window.__ambMarker) try{ window.__ambMarker.setLatLng(ambPos(r,p2)); }catch(e){} el.textContent = r.status==='Dispatched' ? Math.max(1,Math.ceil((1-p2)*12))+' min' : r.status==='Requested'?'…':'Here'; if(p2>=1 && r.status==='Dispatched'){ r.status='On scene'; notify(r.pid,'The ambulance has arrived.','#/app/p/ambulance','info'); save(); rerender(); } }, 1000); });
  return ph('Get care', 'Your ambulance') + `<div class="card mb"><div class="steps">${AMB_FLOW.map((s,k)=>`<div class="step ${k<i?'done':k===i?'now':''}"><div class="dotx">${k<i?ic('check'):k+1}</div>${s}</div>`).join('')}</div></div>
  <div class="grid g-21"><div>${r.status==='Requested'?`<div class="card" style="text-align:center;padding:40px"><div class="ic red" style="width:72px;height:72px;border-radius:50%;margin:0 auto">${ic('loader-2','spin')}</div><h3 class="mt">Waiting for ${hosp(r.branch)} to accept…</h3><p class="muted">This usually takes less than a minute. If it takes long, call <a href="tel:0800100066">0800 100 066</a>.</p><span id="amb-eta" hidden>…</span></div>`:`<div class="map tall" id="ambmap"></div>`}</div>
  <div class="col"><div class="card" style="text-align:center;background:linear-gradient(135deg,#E5484D,#B42328);color:#fff;border:0"><div class="small" style="opacity:.85">${r.status==='Dispatched'?'Arriving in':'Status'}</div><div style="font-size:44px;font-weight:800" id="amb-eta">${r.status==='Dispatched'?Math.max(1,Math.ceil((1-p)*12))+' min':r.status==='Requested'?'…':r.status}</div><div class="small" style="opacity:.85">${esc(r.reason)} · ${esc(r.addr)}</div></div>
   ${a?`<div class="card"><div class="row"><span class="ic red">${ic('ambulance')}</span><div class="grow"><b>${a.plate}</b><div class="small muted">${a.type} · ${hosp(a.branch)}</div></div></div><div class="li"><span class="ic blue">${ic('user')}</span><div class="grow small">Driver: <b>${a.driver}</b><br>Crew: ${a.crew}</div></div><div class="row"><a class="btn green grow" href="tel:${a.phone.replace(/\s/g,'')}">${ic('phone')} Call driver</a><button class="btn ghost" onclick="A.shareTrip('${r.id}')">${ic('share-2')}</button></div></div>`:''}
   ${r.status==='Completed'&&!r.paid?`<div class="card"><h3>Pay for the ambulance</h3><p class="small t2">${ugx(r.fee)} · or bill your insurance.</p><button class="btn grad block" onclick="A.pay(${r.fee},'Ambulance trip ${r.id} (${hosp(r.branch)})',()=>{const x=S.ambRequests.find(y=>y.id==='${r.id}');x.paid=true;S.tabs.lastAmb=null;save();rerender()},{insurance:true})">Pay ${ugx(r.fee)}</button></div>`:''}
   ${['Requested','Dispatched'].includes(r.status)?`<button class="btn ghost block" onclick="A.ambCancel('${r.id}')">Cancel request</button>`:''}
   <div class="note warn small">${ic('alert-triangle')}<div>Keep your phone on. Turn on a light or send someone to the road to guide the ambulance.</div></div></div></div>`; }
A.shareTrip = rid => { const txt='My MB Musawo ambulance is on the way. Track: '+location.origin+location.pathname+'#/app/p/ambulance'; if(navigator.share) navigator.share({text:txt}).catch(()=>{}); else { try{ navigator.clipboard.writeText(txt); toast('Link copied — send it on WhatsApp','green'); }catch(e){} } };

/* ambulance team dashboard (one hospital’s own fleet) */
function ambBoard(){ const b=S.amBranch||'ntd'; const fleet=S.ambulances.filter(a=>a.branch===b); const reqs=S.ambRequests.filter(r=>r.branch===b && !['Completed','Cancelled'].includes(r.status));
  leaflet('dispmap',[branch(b).lat,branch(b).lng],13,[{lat:branch(b).lat,lng:branch(b).lng,color:'#316FF6',r:11,popup:hosp(b)}].concat(reqs.map(r=>({lat:r.lat,lng:r.lng,color:'#E5484D',r:10,popup:`<b>${r.id}</b><br>${esc(r.reason)}<br>${esc(r.addr)}`}))), m=>{ fleet.forEach(a=>{ const r=reqs.find(x=>x.amb===a.id); const pos=r?ambPos(r,ambProg(r)):[a.lat,a.lng]; L.marker(pos,{icon:ambIcon()}).addTo(m).bindPopup(`${a.plate} · ${a.status}`); }); });
  return `<div class="grid g4 mb">${stat('New requests',reqs.filter(r=>r.status==='Requested').length,'bell-ring','red')}${stat('Active trips',reqs.filter(r=>r.status!=='Requested').length,'route','warm')}${stat('Ambulances free',fleet.filter(a=>a.status==='Available').length+' / '+fleet.length,'ambulance','green')}${stat('Avg response','11 min','timer','blue','target under 15 min')}</div>
  <div class="grid g-21"><div class="col">
    <div class="card"><h3>${ic('bell-ring')} Requests for ${hosp(b)}</h3>${reqs.map(r=>{ const p=pat(r.pid); const free=fleet.filter(a=>a.status==='Available'); return `<div class="card flat mb" style="padding:12px;border-left:4px solid ${r.status==='Requested'?'var(--red)':'var(--amber)'}"><div class="row between wrap"><div><b>${r.id} · ${esc(r.reason)}</b><div class="small muted">${p.name} · ${p.phone} · ${esc(r.addr)} · ${ago(r.at)}</div></div>${badgeFor(r.status==='Requested'?'Requested':r.status==='Dispatched'?'En route':'In progress')}</div>
      <div class="row wrap mt">${r.status==='Requested'?(free.length?`<select class="inp" id="as-${r.id}" style="width:auto">${free.map(a=>`<option value="${a.id}">${a.plate} — ${a.type}</option>`).join('')}</select><button class="btn red sm" onclick="A.ambAssign('${r.id}',$('#as-${r.id}').value)">${ic('send')} Dispatch</button>`:'<span class="badge red">No ambulance free — call partner service</span>'):`<span class="small">${S.ambulances.find(a=>a.id===r.amb)?.plate||''}</span><button class="btn sm" onclick="A.ambNext('${r.id}')">→ ${AMB_FLOW[AMB_FLOW.indexOf(r.status)+1]}</button>`}<a class="btn sm ghost" href="tel:${p.phone.replace(/\s/g,'')}">${ic('phone')} Call patient</a></div></div>`; }).join('')||'<div class="empty">No open requests</div>'}</div>

  const p=pat(pid); const adm=(S.admissions||[]).find(a=>a.pid===pid && a.status==='Admitted'); const al=p.allergies.filter(a=>!/none/i.test(a));
  return `<div class="pbanner"><div class="pb-name">${av(p.name)}<div><b>${esc(p.name)}</b><span>${mrn(p.id)} · ${age(p.dob)} y · ${p.sex==='F'?'Female':'Male'} · DOB ${fdate(p.dob)}</span></div></div>
    <div class="pb-cell"><span>Blood group</span><b>${p.blood}</b></div>
    <div class="pb-cell"><span>Allergies</span>${al.length?al.map(a=>`<b class="pb-alert">${esc(a)}</b>`).join(' '):'<b>None known</b>'}</div>
    <div class="pb-cell"><span>Location</span><b>${adm?WARDS.find(w=>w.id===adm.ward).name+' · Bed '+adm.bed:'Outpatient'}</b></div>
    <div class="pb-cell"><span>Payer</span><b>${esc(p.insurer)}</b></div></div>`;
}
(function(){
  const orig = patientFile;
  window.patientFile = patientFile = function(pid){ const h=orig(pid); const i=h.indexOf('<div class="grid g-12">'); return i>0 ? h.slice(0,i)+patientBanner(pid)+h.slice(i) : h; };
  R['common/patients'] = pid => patientFile(pid); R['c/patients'] = pid => patientFile(pid);
  const origLab = R['l/results'];
  R['l/results'] = oid => { const h=origLab(oid); if(!oid) return h; const o=S.labOrders.find(x=>x.id===oid); const i=h.indexOf('<div class="card mb"><div class="steps">'); return o&&i>0 ? h.slice(0,i)+patientBanner(o.pid)+h.slice(i) : h; };
})();

(function(){

A.regPatient = f => { const v=n=>f[n].value; const dup=S.patients.find(p=>p.phone.replace(/\s/g,'')===v('phone').replace(/\s/g,'')); if(dup) return modal('Possible duplicate',`<p>${esc(dup.name)} (${mrn(dup.id)}) already uses this phone number.</p>`,`<button class="btn ghost" onclick="closeModal()">Edit details</button><button class="btn" onclick="closeModal();A.patientCard('${dup.id}')">Use existing record</button>`);
